registry:
  version: 1.0.0
  registered_at: "2026-10-13"
capability:
  id: get_procurement_region_filter_options
  exposure: public
  name: 조달 지역 필터 옵션 조회
  description: Runtime이 실제 지원하는 구조화 공고 참가 지역제한 기준과 관측된 공식 지역 코드·명칭을 반환한다.
  kind: compute
  processor: procurement_exploration.get_procurement_region_filter_options
  semantic_requirements:
    concepts:
      - stable_key: procurement.BidNotice
    properties:
      - stable_key: procurement.BidNotice.bidNoticeId
  effects:
    reads: [public_procurement.bid_notice]
    produces: [public_procurement.procurement_region_filter_options]
  inputs:
    region_basis:
      data_type: string
      enum: [participation_restriction]
      default: participation_restriction
    query: {data_type: string}
  returns: [public_procurement.procurement_region_filter_options]
