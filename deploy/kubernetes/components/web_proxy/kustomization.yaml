apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
- name: teoria-web-proxy
  files:
  - default.conf.template
  - start.sh
patches:
- target:
    kind: Deployment
    name: admin-ui
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: admin-ui\nspec:\n\
    \  template:\n    spec:\n      containers:\n      - name: admin-ui\n        command:\n\
    \        - /bin/sh\n        - /etc/teoria_proxy/start.sh\n        env:\n     \
    \   - name: TEORIA_CLUSTER_DOMAIN\n          value: cluster.local\n        volumeMounts:\n\
    \        - name: web-proxy\n          mountPath: /etc/teoria_proxy\n         \
    \ readOnly: true\n      volumes:\n      - name: web-proxy\n        configMap:\n\
    \          name: teoria-web-proxy\n"
