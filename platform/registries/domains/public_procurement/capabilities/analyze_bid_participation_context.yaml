registry:
  version: 1.3.5
  registered_at: "2026-10-04"
capability:
  id: analyze_bid_participation_context
  name: 공고 참여 판단 컨텍스트 분석
  description: 현재 공고 게시 직전의 동일 기관·업무구분·공식 조달분야 계약과 낙찰 원천을 분석해 시장 진입, 집중도, 규모, 경쟁 강도, 비교기관 benchmark, 신규·재진입 유사규모 계약 사례와 주요 업체를 반환한다.
  kind: compute
  processor: market_context.analyze_bid_participation_context
  effects:
    reads: [public_procurement.bid_notice, public_procurement.bid_award, public_procurement.contract]
    produces: [public_procurement.bid_participation_context]
  inputs:
    bid_notice_id: {property: public_procurement.bid_notice.bid_notice_id, required: true}
    period_years: {data_type: integer, default: 3, minimum: 1, maximum: 10}
  returns: [public_procurement.bid_participation_context]
