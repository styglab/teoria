registry:
  version: 1.4.0
  registered_at: "2026-09-28"

capability:
  id: get_organization_company_relationship
  exposure: public
  name: 기관·업체 전체 수주관계
  description: 분야 또는 유사사업 판정으로 사건을 제외하지 않고 특정 기관과 업체 사이의 전체 고유 수주사건을 최근순으로 페이지 조회한다. 공고 연결 사건은 게시일, 미연결 계약은 최초 계약일에 귀속하며 최초 계약일과 최신 계약 버전일을 분리한다.
  kind: compute
  processor: market_context.get_organization_company_relationship
  semantic_requirements:
    concepts:
      - stable_key: procurement.Organization
      - stable_key: procurement.BidNotice
      - stable_key: procurement.Award
      - stable_key: procurement.Contract
      - stable_key: procurement.ContractVersion
      - stable_key: procurement.ContractParty
      - stable_key: party.BusinessRegistration
    properties:
      - stable_key: procurement.Organization.organizationCode
      - stable_key: procurement.BidNotice.publishedAt
      - stable_key: procurement.Award.awardId
      - stable_key: procurement.Contract.contractId
      - stable_key: procurement.Contract.currentAmount
      - stable_key: procurement.Contract.firstContractDate
      - stable_key: procurement.ContractVersion.concludedDate
      - stable_key: procurement.ContractParty.attributedAmount
      - stable_key: party.BusinessRegistration.businessRegistrationNumber
    relationships:
      - stable_key: procurement.PUBLISHES
      - stable_key: procurement.RESULTS_IN_AWARD
      - stable_key: procurement.RESULTS_IN_CONTRACT
      - stable_key: procurement.HAS_CONTRACT_VERSION
      - stable_key: procurement.HAS_CONTRACT_PARTY
      - stable_key: procurement.REPRESENTS_CONTRACTOR
      - stable_key: procurement.SIGNS
  effects:
    reads:
      - public_procurement.bid_notice
      - public_procurement.bid_award
      - public_procurement.contract
    produces:
      - public_procurement.organization_company_relationship
  inputs:
    organization_code:
      data_type: string
      required: true
    business_registration_number:
      data_type: business_registration_number
      required: true
    work_type:
      data_type: string
      enum: [goods, service, construction, foreign, other, unknown]
    large_category:
      data_type: string
    middle_category:
      data_type: string
    field_code:
      data_type: string
    period_years:
      data_type: integer
      default: 10
      minimum: 1
      maximum: 15
    period_from_year:
      data_type: integer
      minimum: 2000
      maximum: 2100
    period_to_year:
      data_type: integer
      minimum: 2000
      maximum: 2100
    page:
      data_type: integer
      default: 1
      minimum: 1
    page_size:
      data_type: integer
      default: 20
      minimum: 1
      maximum: 100
  returns:
    - public_procurement.organization_company_relationship
