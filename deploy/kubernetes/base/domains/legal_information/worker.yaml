apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-law-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: prefect-law-worker
  template:
    metadata:
      labels:
        app: prefect-law-worker
    spec:
      containers:
      - name: prefect-law-worker
        image: teoria/pipelines:release
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        env:
        - name: TEORIA_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: teoria-mlops-connections
              key: TEORIA_ENVIRONMENT
        - name: TEORIA_PIPELINE_PATH
          value: /app/backend
        - name: PREFECT_API_URL
          valueFrom:
            configMapKeyRef:
              name: teoria-mlops-connections
              key: PREFECT_API_URL
        - name: PREFECT_API_AUTH_STRING
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: PREFECT_API_AUTH_STRING
        - name: PREFECT_INTEGRATIONS_KUBERNETES_OBSERVER_NAMESPACES
          value: teoria-pipelines
        command:
        - prefect
        - worker
        - start
        - --pool
        - teoria-legal-information
        - --type
        - kubernetes
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: true
      serviceAccountName: teoria-pipeline-worker
  strategy:
    type: Recreate
