registry:
  version: 1.7.0
  registered_at: "2026-09-26"

capability:
  id: analyze_bid_organization_field_companies
  name: 기관·분야 수주업체 분석
  description: 현재 공고를 기준으로 실제 낙찰·확정계약 이력이 있는 업체를 세 관계로 구분하고, 각 업체에 공개 Capability와 동일한 기관 전체 수주관계 및 업종·면허 OR 기준 유사사업 경험 지표를 반환한다.
  kind: compute
  processor: market_context.analyze_bid_organization_field_companies
  effects:
    reads:
      - public_procurement.bid_notice
      - public_procurement.bid_award
      - public_procurement.contract
    produces:
      - public_procurement.bid_organization_field_company
  inputs:
    bid_notice_id:
      property: public_procurement.bid_notice.bid_notice_id
      required: true
    period_years:
      data_type: integer
      default: 5
      minimum: 1
      maximum: 10
    limit:
      data_type: integer
      default: 50
      minimum: 1
      maximum: 100
  returns:
    - public_procurement.bid_organization_field_company
  lifecycle:
    status: deprecated
    deprecated_at: "2026-09-29"
    replacement_ids:
      - get_bid_notice_relationship_context
      - analyze_organization_procurement_profile
      - get_organization_company_relationship
      - get_company_similar_project_experience
    reason: 공고·기관·업체 관계를 한 응답에서 혼합하고 구형 분야 판정과 집계를 사용한다.
