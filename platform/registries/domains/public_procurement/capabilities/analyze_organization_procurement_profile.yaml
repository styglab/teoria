registry:
  version: 1.24.0
  registered_at: "2026-10-02"
capability:
  id: analyze_organization_procurement_profile
  exposure: public
  name: 기관 조달 프로필 분석
  description: 기관 조달관계를 최근 N개 또는 명시한 회계연도 범위로 집계하고 종료 연도 기준 공급업체 진입, 선택 기간 기준 CR5·HHI, 평균 계약금액, 전년 비교, 분야·분기·계약방식 구조를 반환한다. 분야 분포는 업무구분과 독립된 공식 조달분류만 사용하며 display_name, display_level, has_children, selection_filter를 반환한다. 연도별 공고는 게시일, 낙찰은 최종낙찰일 또는 개찰일, 계약 건수·금액·업체 수는 최초 계약일에 귀속한다. 계약사건은 버전을 병합하고 금액은 조회 종료일 이전 최신 계약 버전을 사용한다. 최초 계약일이 없는 계약사건은 기간 집계에 포함하지 않고 missing_first_contract_date_count로 반환한다. 업체명 검색·정렬·페이지는 업체 관계 목록에만 적용한다.
  kind: compute
  processor: market_context.analyze_organization_procurement_profile
  semantic_requirements:
    concepts:
      - stable_key: procurement.Organization
      - stable_key: procurement.BidNotice
      - stable_key: procurement.ProcurementCase
      - stable_key: procurement.Industry
      - stable_key: procurement.BidParticipation
      - stable_key: procurement.Award
      - stable_key: procurement.Contract
      - stable_key: procurement.ContractVersion
      - stable_key: procurement.ContractParty
      - stable_key: party.BusinessRegistration
    properties:
      - stable_key: procurement.Organization.organizationCode
      - stable_key: procurement.BidNotice.publishedAt
      - stable_key: procurement.ProcurementCase.workType
      - stable_key: procurement.Industry.industryCode
      - stable_key: procurement.BidParticipation.participationId
      - stable_key: procurement.Award.awardId
      - stable_key: procurement.Contract.contractId
      - stable_key: procurement.Contract.currentAmount
      - stable_key: procurement.Contract.firstContractDate
      - stable_key: procurement.ContractVersion.concludedDate
      - stable_key: procurement.ContractParty.attributedAmount
      - stable_key: party.BusinessRegistration.businessRegistrationNumber
    relationships:
      - stable_key: procurement.PUBLISHES
      - stable_key: procurement.HAS_NOTICE
      - stable_key: procurement.CLASSIFIED_AS_INDUSTRY
      - stable_key: procurement.HAS_PARTICIPATION
      - stable_key: procurement.RESULTS_IN_AWARD
      - stable_key: procurement.RESULTS_IN_CONTRACT
      - stable_key: procurement.HAS_CONTRACT_VERSION
      - stable_key: procurement.HAS_CONTRACT_PARTY
      - stable_key: procurement.REPRESENTS_CONTRACTOR
      - stable_key: procurement.SIGNS
  effects:
    reads: [public_procurement.bid_notice, public_procurement.bid_opening_participation, public_procurement.bid_award, public_procurement.contract]
    produces: [public_procurement.organization_procurement_profile]
  inputs:
    organization_code: {data_type: string, required: true}
    period_years: {data_type: integer, default: 5, minimum: 1, maximum: 15}
    period_from_year: {data_type: integer, minimum: 2000, maximum: 2100}
    period_to_year: {data_type: integer, minimum: 2000, maximum: 2100}
    large_category: {data_type: string}
    middle_category: {data_type: string}
    field_code: {data_type: string}
    work_type:
      data_type: string
      enum: [goods, service, construction, foreign, other, unknown]
    company_query: {data_type: string}
    page: {data_type: integer, default: 1, minimum: 1}
    page_size: {data_type: integer, default: 20, minimum: 1, maximum: 100}
    sort_by:
      data_type: string
      default: contract_amount
    sort:
      data_type: string
      enum: [contract_amount_desc, contract_count_desc, latest_contract_desc]
      default: contract_amount_desc
  returns: [public_procurement.organization_procurement_profile]
