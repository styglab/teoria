schema_version: '1.0'
namespace: goods
name: 규격서 물품
description: 문서별 납품 범위·물품·서비스·자료·적용 문맥과 구성·연계·구조화한 규격·기능·검수·근거를 연결한다. 외부 분류 없이 기술할 수 있으며 분류·유형·특성 사전을 선택적으로
  참조한다.
target_version: 1.0.0
objects:
- code: classification_scheme
  name: 물품 분류체계
  stable_key: goods.classification_scheme
  description: 조달 분류 등 외부 분류 사전의 특정 판본. 기술 metadata나 Ontology namespace가 아니다.
  identity_properties:
  - scheme_id
  - edition
  properties:
  - code: scheme_id
    name: 분류체계 식별자
    stable_key: goods.classification_scheme.scheme_id
    value_type: string
    cardinality: one
    description: 제공기관이 식별하는 분류체계. 출처 확인 없이 서로 다른 체계를 합치지 않는다.
  - code: edition
    name: 분류 판본
    stable_key: goods.classification_scheme.edition
    value_type: string
    cardinality: one
    description: 제공기관 판본 또는 출처 snapshot 식별자. 기준 시점을 모르면 미확인 snapshot으로 명시한다.
  - code: name
    name: 분류체계명
    stable_key: goods.classification_scheme.name
    value_type: string
    cardinality: one
    description: 출처에 확인된 체계명.
  - code: authority
    name: 관리 기관
    stable_key: goods.classification_scheme.authority
    value_type: string
    cardinality: one
    description: 해당 분류체계의 관리 기관.
  - code: source_ref
    name: 사전 출처
    stable_key: goods.classification_scheme.source_ref
    value_type: string
    cardinality: one
    description: 공식 사전 또는 검증한 snapshot의 참조.
- code: classification_entry
  name: 물품 분류항목
  stable_key: goods.classification_entry
  description: 분류체계 판본 내의 코드. 조달 대·중·소·세 분류와 세부품명을 표현하며 개별 제품의 식별번호와 구분한다.
  identity_properties:
  - scheme_id
  - edition
  - code
  properties:
  - code: scheme_id
    name: 분류체계 식별자
    stable_key: goods.classification_entry.scheme_id
    value_type: string
    cardinality: one
    description: 소속 분류체계와 일치해야 한다.
  - code: edition
    name: 분류 판본
    stable_key: goods.classification_entry.edition
    value_type: string
    cardinality: one
    description: 소속 분류체계 판본과 일치해야 한다.
  - code: code
    name: 분류 코드
    stable_key: goods.classification_entry.code
    value_type: string
    cardinality: one
    description: 선행 0을 보존하는 문자열. 물품식별번호·문서 품목번호와 구분한다.
  - code: preferred_name
    name: 공식 분류명
    stable_key: goods.classification_entry.preferred_name
    value_type: string
    cardinality: one
    description: 해당 판본의 공식 사전에서 검증한 이름.
  - code: level
    name: 분류 단계
    stable_key: goods.classification_entry.level
    value_type: string
    cardinality: one
    description: 조달에서는 segment/family/class/commodity/detail_name. 타 체계의 단계는 해당 체계 정의를 따른다.
  - code: source_ref
    name: 항목 출처
    stable_key: goods.classification_entry.source_ref
    value_type: string
    cardinality: one
    description: 코드 존재·명칭·상위 관계를 확인한 사전 위치.
- code: classification_assignment
  name: 물품 분류 판정
  stable_key: goods.classification_assignment
  description: 특정 규격 물품 항목에 대한 출처별 분류 주장. 원문 표기·수집 필터·검증 결과와 검토 상태를 구별하며 충돌을 덮어쓰지 않는다.
  identity_properties:
  - assignment_id
  properties:
  - code: assignment_id
    name: 분류 판정 식별자
    stable_key: goods.classification_assignment.assignment_id
    value_type: string
    cardinality: one
    description: 대상·출처·판정 문맥의 식별자.
  - code: raw_code
    name: 원문 코드
    stable_key: goods.classification_assignment.raw_code
    value_type: string
    cardinality: one
    description: 표제의 자리 수와 맞지 않아도 원문 그대로 보존한다.
  - code: raw_label
    name: 원문 분류 표제
    stable_key: goods.classification_assignment.raw_label
    value_type: string
    cardinality: optional
    description: '예: 정부물품분류번호(8자리). 실제 코드와 불일치할 수 있다.'
  - code: source_kind
    name: 분류 주장 출처
    stable_key: goods.classification_assignment.source_kind
    value_type: string
    cardinality: one
    description: document/item_metadata/reviewed_inference 등. 검색 필터만으로 물품 분류를 확정하지 않는다.
  - code: resolution_status
    name: 분류 검증 상태
    stable_key: goods.classification_assignment.resolution_status
    value_type: string
    cardinality: one
    description: unresolved/verified/conflicting/rejected. 코드 길이만으로 verified로 만들지 않는다.
  - code: source_ref
    name: 주장 출처
    stable_key: goods.classification_assignment.source_ref
    value_type: string
    cardinality: one
    description: 원문 또는 항목별 metadata snapshot의 참조.
  - code: review_ref
    name: 검토 기록 참조
    stable_key: goods.classification_assignment.review_ref
    value_type: string
    cardinality: optional
    description: 기존 인증된 제안·검토·승인 이력의 참조. actor 문자열을 권위 정보로 쓰지 않는다.
- code: item_type
  name: 물품 유형 정의
  stable_key: goods.item_type
  description: 서버·메모리 등 규격 물품을 해석하는 업무 유형 사전. 개별 모델·실물이나 조달 분류 코드와 동일시하지 않으며 native Object schema의 복제본이 아니다.
  identity_properties:
  - type_id
  properties:
  - code: type_id
    name: 물품 유형 식별자
    stable_key: goods.item_type.type_id
    value_type: string
    cardinality: one
    description: 검토 대상 사전 항목의 지속적인 식별자. 이름 변경으로 바꾸지 않는다.
  - code: preferred_name
    name: 표준 물품 유형명
    stable_key: goods.item_type.preferred_name
    value_type: string
    cardinality: one
    description: 동의어와 구분한 유형명.
  - code: definition
    name: 유형 정의
    stable_key: goods.item_type.definition
    value_type: string
    cardinality: one
    description: 대상의 의미와 포함·제외 범위를 설명한다.
  - code: aliases
    name: 유형 동의어
    stable_key: goods.item_type.aliases
    value_type: string
    cardinality: many
    description: 원문 표현만으로 동등성이나 분류 일치를 확정하지 않는다.
  - code: source_ref
    name: 정의 근거
    stable_key: goods.item_type.source_ref
    value_type: string
    cardinality: one
    description: 외부 표준 또는 검토 근거.
  - code: review_ref
    name: 정의 검토 참조
    stable_key: goods.item_type.review_ref
    value_type: string
    cardinality: optional
    description: 기존 승인 이력과 연결한다. 사전 행 생성이 승인을 뜻하지 않는다.
- code: characteristic_definition
  name: 물품 표준 특성 정의
  stable_key: goods.characteristic_definition
  description: 물품 특성 사전의 업무 항목. 가변적인 특성의 뜻·값 종류·단위 정책을 정의한다. Ontology native Property는 이 사전과 명세 객체의 고정 필드를
    계속 정의한다.
  identity_properties:
  - characteristic_id
  properties:
  - code: characteristic_id
    name: 표준 특성 식별자
    stable_key: goods.characteristic_definition.characteristic_id
    value_type: string
    cardinality: one
    description: 의미를 지속적으로 식별하는 사전 ID. 명칭·단위가 같다고 합치지 않는다.
  - code: preferred_name
    name: 표준 특성명
    stable_key: goods.characteristic_definition.preferred_name
    value_type: string
    cardinality: one
    description: 시스템 메모리 용량과 GPU 메모리 용량 등 업무상 구별되는 이름.
  - code: definition
    name: 특성 정의
    stable_key: goods.characteristic_definition.definition
    value_type: string
    cardinality: one
    description: 무엇을 기술하며 무엇과 구별되는지 설명한다.
  - code: value_kind
    name: 허용 값 종류
    stable_key: goods.characteristic_definition.value_kind
    value_type: string
    cardinality: one
    description: 수치·문자·불리언·식별자·범위·집합·복합 값 등의 계약.
  - code: quantity_kind_ref
    name: 수량 종류 참조
    stable_key: goods.characteristic_definition.quantity_kind_ref
    value_type: string
    cardinality: optional
    description: 의미가 검증된 수량 종류 식별자. 단위와 구분하며 모든 특성에 강제하지 않는다.
  - code: allowed_unit_refs
    name: 허용 단위 참조
    stable_key: goods.characteristic_definition.allowed_unit_refs
    value_type: string
    cardinality: many
    description: 의미·차원·환산 정책을 검증한 단위 ID. 원문 GB를 근거 없이 GiB로 바꾸지 않는다.
  - code: source_ref
    name: 정의 근거
    stable_key: goods.characteristic_definition.source_ref
    value_type: string
    cardinality: one
    description: 표준 또는 업무 정의 근거.
  - code: review_ref
    name: 정의 검토 참조
    stable_key: goods.characteristic_definition.review_ref
    value_type: string
    cardinality: optional
    description: 검토·승인 상태는 기존 사전/프로파일 검토 기능과 연결한다.
- code: specification_document
  name: 규격서 버전
  stable_key: goods.specification_document
  description: 특정 원본 버전의 규격서. 문서 간 개정 관계는 별도 근거로 판단하며 filename이나 checksum만으로 논리 문서를 합치지 않는다.
  identity_properties:
  - document_id
  - revision_id
  properties:
  - code: document_id
    name: 논리 문서 식별자
    stable_key: goods.specification_document.document_id
    value_type: string
    cardinality: one
    description: 명시적으로 확인한 문서의 식별자. 원문 파일명과 구분한다.
  - code: revision_id
    name: 문서 버전 식별자
    stable_key: goods.specification_document.revision_id
    value_type: string
    cardinality: one
    description: 해당 원본 버전의 식별자.
  - code: title
    name: 문서명
    stable_key: goods.specification_document.title
    value_type: string
    cardinality: optional
    description: 원문의 문서 제목.
  - code: source_sha256
    name: 원본 SHA-256
    stable_key: goods.specification_document.source_sha256
    value_type: string
    cardinality: one
    description: 근거가 참조하는 원본의 checksum. 본문은 파일/S3에 둔다.
  - code: revision_label
    name: 원문 개정 표시
    stable_key: goods.specification_document.revision_label
    value_type: string
    cardinality: optional
    description: 원문에 명시된 개정명 또는 날짜. 추측하지 않는다.
- code: specified_item
  name: 규격 물품 항목
  stable_key: goods.specified_item
  description: 규격서 안에서 지시하는 물품 또는 구성 대상. 제조사 제품 모델이나 설치된 실물 자산과 동일시하지 않으며, 구성품 역할은 구성 명세의 문맥으로 표현한다.
  identity_properties:
  - item_id
  properties:
  - code: item_id
    name: 규격 항목 식별자
    stable_key: goods.specified_item.item_id
    value_type: string
    cardinality: one
    description: 문서 버전과 안정적인 항목 식별 근거로 구별하는 ID. 다른 문서의 같은 이름·행 번호와 충돌하지 않으며 run ID나 용량 문자열을 ID로 쓰지 않는다.
  - code: designation
    name: 원문 항목명
    stable_key: goods.specified_item.designation
    value_type: string
    cardinality: optional
    description: 원문 언급을 보존한다. 명칭 유사성만으로 다른 대상을 합치지 않는다.
- code: property_statement
  name: 속성 명세
  stable_key: goods.property_statement
  description: 특정 대상의 특성에 관하여 규격서가 기술한 값과 조건. 실제 장착량·제조사 사양의 확정 사실로 간주하지 않는다.
  identity_properties:
  - statement_id
  properties:
  - code: statement_id
    name: 속성 명세 식별자
    stable_key: goods.property_statement.statement_id
    value_type: string
    cardinality: one
    description: 원문 관찰과 대응되는 명세의 ID. 반복·상충 원문을 추적할 수 있어야 한다.
  - code: statement_text
    name: 원문 속성 진술
    stable_key: goods.property_statement.statement_text
    value_type: string
    cardinality: one
    description: 값·연산·한정자를 포함하는 원문 진술.
  - code: value_kind
    name: 값의 종류
    stable_key: goods.property_statement.value_kind
    value_type: string
    cardinality: one
    description: 숫자·문자·식별자·불리언·범위·집합·복합 조건·미해결의 구분. 세부 값 계약은 별도 검증한다.
  - code: value_raw
    name: 원문 값
    stable_key: goods.property_statement.value_raw
    value_type: string
    cardinality: optional
    description: 원문 표현 그대로의 값. 복합 조건을 단일 숫자로 축약하지 않는다.
  - code: operator
    name: 조건 연산
    stable_key: goods.property_statement.operator
    value_type: string
    cardinality: optional
    description: 이상·이하·동일·선택 등 원문을 검증한 연산. 불확실하면 raw 또는 미해결로 유지한다.
  - code: unit_raw
    name: 원문 단위
    stable_key: goods.property_statement.unit_raw
    value_type: string
    cardinality: optional
    description: 원문 단위. 단위가 같다는 이유로 서로 다른 속성을 합치지 않는다.
  - code: assertion_role
    name: 진술 역할
    stable_key: goods.property_statement.assertion_role
    value_type: string
    cardinality: one
    description: 납품 요구·기재 사양·지원 상한·기보유·권고·선택 등의 구분. 검토 승인 상태와 별개다.
  - code: semantic_scope
    name: 적용 범위
    stable_key: goods.property_statement.semantic_scope
    value_type: string
    cardinality: optional
    description: 전체·구성품당·모듈당 등 적용 범위. 원문에 없는 합계를 계산해 명시 값으로 만들지 않는다.
  - code: qualifiers
    name: 원문 한정 조건
    stable_key: goods.property_statement.qualifiers
    value_type: string
    cardinality: many
    description: 부정·대안·호환 조건 등을 보존한다. 미주석을 조건 없음으로 해석하지 않는다.
  - code: numeric_value
    name: 해석한 수치
    stable_key: goods.property_statement.numeric_value
    value_type: decimal
    cardinality: optional
    description: 단일 수치 조건인 경우의 값. 원문·연산·단위를 함께 보존하며 복합 범위를 축약하지 않는다.
  - code: unit_ref
    name: 검증한 단위 참조
    stable_key: goods.property_statement.unit_ref
    value_type: string
    cardinality: optional
    description: 표준 특성의 허용 단위와 일치하는 ID. 해석 전에는 비워 둔다.
  - code: value_expression
    name: 구조화한 규격값
    stable_key: goods.property_statement.value_expression
    value_type: object
    cardinality: optional
    description: SpecificationValue 계약의 단일 값·범위·오차·차원·집합·상대값·대안·원문식. 해석하지 못한 식을 실행하지 않는다.
  - code: conditions
    name: 규격 적용 조건
    stable_key: goods.property_statement.conditions
    value_type: object
    cardinality: many
    description: SpecificationCondition 계약. 주입량·반복횟수·작업면·상온 등 조건.
- code: composition_statement
  name: 구성 명세
  stable_key: goods.composition_statement
  description: 물품 사이의 물리 구성·통합 시스템 구성·부속품 관계의 문서별 진술. 수량·포함·범위·근거를 보존하며 호환·데이터 연결은 별도 연계 명세로 표현한다.
  identity_properties:
  - composition_id
  properties:
  - code: composition_id
    name: 구성 명세 식별자
    stable_key: goods.composition_statement.composition_id
    value_type: string
    cardinality: one
    description: 부모·자식과 원문 조건을 함께 추적하는 식별자.
  - code: relation_kind
    name: 관계 의미
    stable_key: goods.composition_statement.relation_kind
    value_type: string
    cardinality: one
