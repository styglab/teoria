[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kory-parser"
dynamic = ["version"]
description = "Python document parser for Korean documents, PDF and Office files"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "third_party/*.txt"]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "olefile>=0.47,<1",
  "pymupdf>=1.27,<1.28",
  "fonttools>=4.60,<5",
  "Pillow>=11,<13",
  "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.4,<4", "onnxruntime>=1.20,<2"]

[project.urls]
Repository = "https://github.com/styglab/kory-parser"
Issues = "https://github.com/styglab/kory-parser/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.14,<1", "xlwt>=1.3,<2", "httpx>=0.28,<1"]

[project.scripts]
kory-parser = "kory_parser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kory_parser"]

[tool.hatch.version]
path = "src/kory_parser/version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml", "uv.lock", "LICENSE", "NOTICE", "third_party", "docs"]
exclude = ["verification", ".artifacts", ".venv", "dist"]

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 110
target-version = "py311"
