registry:
  version: 1.0.0
  registered_at: '2026-10-26'
source:
  id: example_api
  name: Synthetic API
  type: api
  provider:
    organization: Example
  specification:
    format: manual
    version: '1.0'
    source_document: api.md
  access:
    base_url: https://example.invalid
    authentication:
      type: api_key
      in: query
      name: serviceKey
      credential_env: TEORIA_SOURCE_EXAMPLE_API_API_KEY
  components:
    objects:
    - id: record
      fields:
      - id: code
        data_type: record_code
      - id: status
        data_type: string
      - id: observed_date
        data_type: string
    - id: request_record
      fields:
      - id: code
        data_type: record_code
      - id: optional_code
        data_type: optional_code
    - id: verification
      fields:
      - id: request_param
        ref: request_record
  operations:
  - id: get_records
    method: POST
    path: /records
    idempotent: true
    request:
      query:
        fields:
        - id: format
          data_type: string
          default: JSON
      body:
        fields:
        - id: codes
          type: array
          items:
            data_type: record_code
        required:
        - codes
      content_type: application/json
    response:
      content_type: application/json
      http_status: 200
      control:
        record_path: .
        fields:
        - id: status_code
          data_type: string
        success:
          field: status_code
          equals: OK
      data:
        record_path: data[]
        ref: record
  - id: verify_records
    method: POST
    path: /verify
    idempotent: true
    request:
      body:
        fields:
        - id: records
          type: array
          items:
            ref: request_record
        required:
        - records
      content_type: application/json
    response:
      content_type: application/json
      http_status: 200
      data:
        record_path: data[]
        ref: verification
