# Service modules are composed by deploy.sh; jobs run explicitly with --rm.
services:
  runtime-api:
    cpus: 1
    mem_limit: 512m
    image: ${TEORIA_RUNTIME_API_IMAGE:-teoria-platform-runtime:latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: runtime
      labels:
        io.teoria.project: teoria
        io.teoria.role: runtime
    restart: unless-stopped
    command:
    - teoria-runtime-api
    environment:
      TEORIA_ENVIRONMENT: production
      TEORIA_REGISTRY_PATH: /app/backend/contracts/runtime
      TEORIA_REGISTRY_REQUIRE_PUBLISHED: 'true'
      TEORIA_RUNTIME_ARTIFACT_STORE: /app/runtime_artifacts
      TEORIA_RUNTIME_API_ROOT_PATH: /runtime-api
      TEORIA_RUNTIME_API_TOKEN: ${TEORIA_RUNTIME_API_TOKEN:?set TEORIA_RUNTIME_API_TOKEN}
      TEORIA_RUNTIME_CACHE_BACKEND: redis
      TEORIA_RUNTIME_CACHE_URL: redis://runtime-redis:6379/0
      TEORIA_RUNTIME_CACHE_PREFIX: teoria:runtime
      TEORIA_POLICY_MODE: opa
      TEORIA_OPA_URL: http://opa:8181
      TEORIA_OPA_DECISION_PATH: teoria/authz/decision
      TEORIA_RUNTIME_DATA_DATABASE_URL: ${TEORIA_RUNTIME_DATA_DATABASE_URL:-postgresql://teoria_runtime:${TEORIA_LOCAL_RUNTIME_DB_PASSWORD:?set TEORIA_LOCAL_RUNTIME_DB_PASSWORD}@postgres:5432/teoria_data}
      TEORIA_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_DATABASE_CONCURRENCY_LIMIT:-10}
    volumes:
    - runtime-artifacts:/app/runtime_artifacts:ro
    depends_on:
      runtime-redis:
        condition: service_healthy
      opa:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '8000'
  runtime-redis:
    cpus: 0.25
    mem_limit: 256m
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - 64mb
    - --maxmemory-policy
    - allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
    - runtime-redis:/data
  openmetadata-search:
    cpus: 2
    mem_limit: 6g
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: ${OPENMETADATA_SEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    healthcheck:
      test:
      - CMD-SHELL
      - curl --silent --fail http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
    - openmetadata-search:/usr/share/elasticsearch/data
  openmetadata-server:
    cpus: 2
    mem_limit: 2g
    image: docker.getcollate.io/openmetadata/server:${OPENMETADATA_VERSION:-2.0.5}
    restart: unless-stopped
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-openmetadata_local}
      DB_HOST: platform-postgres
      DB_PORT: 5432
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: openmetadata-search
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      PIPELINE_SERVICE_CLIENT_ENABLED: 'false'
      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '</dev/tcp/127.0.0.1/8586'
      interval: 10s
      timeout: 5s
      retries: 40
    ports:
    - ${OPENMETADATA_HTTP_PORT:-8585}:8585
  openmetadata-migrate:
    cpus: 1
    mem_limit: 2g
    image: docker.getcollate.io/openmetadata/server:${OPENMETADATA_VERSION:-2.0.5}
    restart: 'no'
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-openmetadata_local}
      DB_HOST: platform-postgres
      DB_PORT: 5432
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: openmetadata-search
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      PIPELINE_SERVICE_CLIENT_ENABLED: 'false'
      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
    entrypoint:
    - /bin/bash
    - bootstrap/openmetadata-ops.sh
    - migrate
    depends_on:
      openmetadata-search:
        condition: service_healthy
    profiles:
    - jobs
  postgres-metadata-grants:
    cpus: 0.5
    mem_limit: 256m
    image: postgres:17
    command:
    - sh
    - -ec
    - |
      psql --set=ON_ERROR_STOP=1 <<'SQL'
      REVOKE ALL ON SCHEMA ingestion FROM teoria_metadata;
      REVOKE ALL ON ALL TABLES IN SCHEMA ingestion FROM teoria_metadata;
      ALTER DEFAULT PRIVILEGES FOR ROLE teoria_pipeline IN SCHEMA ingestion REVOKE ALL ON TABLES FROM teoria_metadata;
      GRANT USAGE ON SCHEMA public_procurement TO teoria_metadata;
      GRANT SELECT ON ALL TABLES IN SCHEMA public_procurement TO teoria_metadata;
      ALTER DEFAULT PRIVILEGES FOR ROLE teoria_pipeline IN SCHEMA public_procurement GRANT SELECT ON TABLES TO teoria_metadata;
      SQL
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: teoria_data
      PGUSER: teoria_pipeline
      PGPASSWORD: ${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}
    profiles:
    - jobs
  prefect-metadata-deploy:
    cpus: 0.5
    mem_limit: 512m
    image: teoria-pipelines-metadata:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: metadata-worker
      labels:
        io.teoria.project: teoria
        io.teoria.role: metadata-worker
    command:
    - teoria-pipelines
    - register
    - --backend
    - process
    - --kind
    - metadata
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      TEORIA_OPENMETADATA_INGESTION_ALLOWED_IMAGE: teoria-openmetadata-ingestion:${OPENMETADATA_VERSION:-2.0.5}
      PREFECT_API_AUTH_STRING: ${TEORIA_PREFECT_USERNAME:?set TEORIA_PREFECT_USERNAME}:${TEORIA_PREFECT_PASSWORD:?set TEORIA_PREFECT_PASSWORD}
    depends_on:
      prefect-server:
        condition: service_healthy
      openmetadata-server:
        condition: service_healthy
    profiles:
    - jobs
  prefect-metadata-worker:
    cpus: 0.5
    mem_limit: 512m
    image: teoria-pipelines-metadata:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: metadata-worker
      labels:
        io.teoria.project: teoria
        io.teoria.role: metadata-worker
    restart: unless-stopped
    command:
    - prefect
    - worker
    - start
    - --pool
    - teoria-metadata
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_AUTH_STRING: ${TEORIA_PREFECT_USERNAME:?set TEORIA_PREFECT_USERNAME}:${TEORIA_PREFECT_PASSWORD:?set TEORIA_PREFECT_PASSWORD}
      TEORIA_METADATA_DB_PASSWORD: ${TEORIA_METADATA_DB_PASSWORD:-teoria_local_metadata}
      OPENMETADATA_INGESTION_BOT_TOKEN: ${OPENMETADATA_INGESTION_BOT_TOKEN:-}
      TEORIA_OPENMETADATA_INGESTION_ALLOWED_IMAGE: teoria-openmetadata-ingestion:${OPENMETADATA_VERSION:-2.0.5}
      TEORIA_OPENMETADATA_INGESTION_CPUS: ${TEORIA_OPENMETADATA_INGESTION_CPUS:-1}
      TEORIA_OPENMETADATA_INGESTION_MEMORY: ${TEORIA_OPENMETADATA_INGESTION_MEMORY:-2g}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      openmetadata-server:
        condition: service_healthy
  prefect-law-deploy:
    cpus: 0.5
    mem_limit: 512m
    image: teoria-pipelines-law:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: law-worker
      labels:
        io.teoria.project: teoria
        io.teoria.role: law-worker
    command:
    - teoria-pipelines
    - register
    - --backend
    - process
    - --kind
    - legal-information
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_AUTH_STRING: ${TEORIA_PREFECT_USERNAME:?set TEORIA_PREFECT_USERNAME}:${TEORIA_PREFECT_PASSWORD:?set TEORIA_PREFECT_PASSWORD}
    depends_on:
      prefect-server:
        condition: service_healthy
    profiles:
    - jobs
  prefect-law-worker:
    image: teoria-pipelines-law:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: law-worker
      labels:
        io.teoria.project: teoria
        io.teoria.role: law-worker
    restart: unless-stopped
    command:
    - teoria-pipelines
    - worker
    - --pool
    - teoria-legal-information
    cpus: 1
    mem_limit: 1g
    environment:
      TEORIA_ENVIRONMENT: production
      TEORIA_PIPELINE_PATH: /app/backend
      TEORIA_PIPELINE_CONCURRENCY: '1'
      TEORIA_PIPELINE_DATA_DATABASE_URL: ${TEORIA_PIPELINE_DATA_DATABASE_URL:-postgresql://teoria_pipeline:${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}@postgres:5432/teoria_data}
      TEORIA_PIPELINE_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_PIPELINE_DATABASE_CONCURRENCY_LIMIT:-10}
      TEORIA_CONNECTOR_MOLEG_LAW_API_KEY: ${TEORIA_CONNECTOR_MOLEG_LAW_API_KEY:-}
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_AUTH_STRING: ${TEORIA_PREFECT_USERNAME:?set TEORIA_PREFECT_USERNAME}:${TEORIA_PREFECT_PASSWORD:?set TEORIA_PREFECT_PASSWORD}
  metadata-assessment-worker:
    profiles: [assessment]
    stop_grace_period: 600s
    cpus: 0.5
    mem_limit: 512m
    image: ${TEORIA_ASSESSMENT_WORKER_IMAGE:-teoria-platform-authoring:latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: authoring
      labels:
        io.teoria.project: teoria
        io.teoria.role: authoring
    restart: unless-stopped
    command:
    - teoria-metadata-assessment-worker
    environment:
      TEORIA_ASSESSMENT_LAW_MAX_DOCUMENTS: ${TEORIA_ASSESSMENT_LAW_MAX_DOCUMENTS:-5}
      TEORIA_ASSESSMENT_LAW_MAX_CHARS: ${TEORIA_ASSESSMENT_LAW_MAX_CHARS:-12000}
      TEORIA_ENVIRONMENT: production
      TEORIA_ASSESSMENT_ENABLED: ${TEORIA_ASSESSMENT_ENABLED:-false}
      TEORIA_ASSESSMENT_CODEX_MODEL: ${TEORIA_ASSESSMENT_CODEX_MODEL:-}
      TEORIA_ASSESSMENT_CODEX_TIMEOUT_SECONDS: ${TEORIA_ASSESSMENT_CODEX_TIMEOUT_SECONDS:-180}
      TEORIA_APP_DATABASE_URL: postgresql://teoria_app:${TEORIA_LOCAL_APP_DB_PASSWORD:-teoria_local_app}@platform-postgres:5432/teoria_app
      TEORIA_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_DATABASE_CONCURRENCY_LIMIT:-10}
      TEORIA_ADMIN_DATA_DATABASE_URL: ${TEORIA_RUNTIME_DATA_DATABASE_URL:-postgresql://teoria_runtime:${TEORIA_LOCAL_RUNTIME_DB_PASSWORD:?set TEORIA_LOCAL_RUNTIME_DB_PASSWORD}@postgres:5432/teoria_data}
      TEORIA_OPENMETADATA_ENABLED: ${TEORIA_OPENMETADATA_ENABLED:-true}
      TEORIA_OPENMETADATA_BASE_URL: ${TEORIA_OPENMETADATA_BASE_URL:-http://openmetadata-server:8585/api}
      TEORIA_OPENMETADATA_AUTH_TOKEN: ${TEORIA_OPENMETADATA_AUTH_TOKEN:-${OPENMETADATA_INGESTION_BOT_TOKEN:-}}
    volumes:
    - metadata-model-auth:/home/teoria/.codex
  openmetadata-ingestion-job:
    cpus: ${TEORIA_OPENMETADATA_INGESTION_CPUS:-1}
    mem_limit: ${TEORIA_OPENMETADATA_INGESTION_MEMORY:-2g}
    image: teoria-openmetadata-ingestion:${OPENMETADATA_VERSION:-2.0.5}
    build:
      context: ../..
      dockerfile: deploy/compose/openmetadata/Dockerfile
      additional_contexts:
        ingestion_base: ${TEORIA_OPENMETADATA_INGESTION_BUILD_CONTEXT:-docker-image://docker.getcollate.io/openmetadata/ingestion-base:${OPENMETADATA_VERSION:-2.0.5}}
      args:
        OPENMETADATA_VERSION: ${OPENMETADATA_VERSION:-2.0.5}
        OPENMETADATA_BASE_IMAGE: ingestion_base
      labels:
        io.teoria.project: teoria
        io.teoria.role: metadata-ingestion
    restart: 'no'
    environment:
      TEORIA_METADATA_DB_PASSWORD: ${TEORIA_METADATA_DB_PASSWORD:-teoria_local_metadata}
      OPENMETADATA_INGESTION_BOT_TOKEN: ${OPENMETADATA_INGESTION_BOT_TOKEN:-}
    entrypoint:
    - metadata
    command:
    - ingest
    - -c
    - /config/teoria-postgres.yaml
    depends_on:
      openmetadata-server:
        condition: service_healthy
    profiles:
    - jobs
  mcp:
    cpus: 0.5
    mem_limit: 256m
    image: teoria-mcp:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: mcp
      labels:
        io.teoria.project: teoria
        io.teoria.role: mcp
    command:
    - teoria-mcp
    stdin_open: true
    environment:
      TEORIA_MCP_RUNTIME_MODE: remote
      TEORIA_MCP_RUNTIME_API_URL: http://runtime-api:8000
      TEORIA_MCP_RUNTIME_API_TOKEN: ${TEORIA_RUNTIME_API_TOKEN:?set TEORIA_RUNTIME_API_TOKEN}
      TEORIA_MCP_RUNTIME_TIMEOUT_SECONDS: ${TEORIA_MCP_RUNTIME_TIMEOUT_SECONDS:-150}
      TEORIA_MCP_RUNTIME_MAX_ATTEMPTS: ${TEORIA_MCP_RUNTIME_MAX_ATTEMPTS:-3}
      TEORIA_MCP_RUNTIME_RETRY_BACKOFF_SECONDS: ${TEORIA_MCP_RUNTIME_RETRY_BACKOFF_SECONDS:-0.25}
    depends_on:
      runtime-api:
        condition: service_healthy
    profiles:
    - jobs
  admin-api:
    environment:
      TEORIA_SEMANTIC_MODELING_ENABLED: 'true'
      TEORIA_LEGAL_INFORMATION_ENABLED: 'true'
      TEORIA_RUNTIME_ARTIFACT_STORE: /app/runtime_artifacts
      TEORIA_OPENMETADATA_ENABLED: ${TEORIA_OPENMETADATA_ENABLED:-true}
      TEORIA_ASSESSMENT_ENABLED: ${TEORIA_ASSESSMENT_ENABLED:-false}
      TEORIA_ASSESSMENT_CODEX_MODEL: ${TEORIA_ASSESSMENT_CODEX_MODEL:-}
      TEORIA_OPENMETADATA_BASE_URL: ${TEORIA_OPENMETADATA_BASE_URL:-http://openmetadata-server:8585/api}
      TEORIA_OPENMETADATA_AUTH_TOKEN: ${TEORIA_OPENMETADATA_AUTH_TOKEN:-${OPENMETADATA_INGESTION_BOT_TOKEN:-}}
      TEORIA_OPENMETADATA_DATABASE_SERVICE: ${TEORIA_OPENMETADATA_DATABASE_SERVICE:-teoria_postgresql}
      TEORIA_CONTEXT_RUNTIME_API_URL: http://runtime-api:8000
      TEORIA_CONTEXT_RUNTIME_API_TOKEN: ${TEORIA_RUNTIME_API_TOKEN:?set TEORIA_RUNTIME_API_TOKEN}
    volumes:
    - runtime-artifacts:/app/runtime_artifacts:ro
    image: ${TEORIA_ADMIN_API_IMAGE:-teoria-platform-authoring:latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: authoring
      labels:
        io.teoria.project: teoria
        io.teoria.role: authoring
  runtime-artifact-check:
    image: ${TEORIA_RUNTIME_API_IMAGE:-teoria-platform-runtime:latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: runtime
      labels:
        io.teoria.project: teoria
        io.teoria.role: runtime
    profiles:
    - jobs
    cpus: 0.5
    mem_limit: 512m
    command:
    - python
    - -c
    - from teoria.features.semantic_modeling.registry.artifact import RegistryArtifactStore; b=RegistryArtifactStore('/app/runtime_artifacts').load_active(); print('Verified artifact:', b.manifest.version)
    volumes:
    - runtime-artifacts:/app/runtime_artifacts:ro
