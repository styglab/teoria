apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      containers:
      - name: admin-api
        image: teoria/admin:release
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env:
        - name: TEORIA_ENVIRONMENT
          value: production
        - name: TEORIA_ADMIN_AUTH_MODE
          value: bearer
        - name: TEORIA_POLICY_MODE
          value: disabled
        - name: TEORIA_SEMANTIC_MODELING_ENABLED
          value: 'false'
        - name: TEORIA_FORMATID_ENABLED
          value: 'false'
        - name: TEORIA_LEGAL_INFORMATION_ENABLED
          value: 'false'
        - name: TEORIA_OPENMETADATA_ENABLED
          value: 'false'
        - name: TEORIA_MODEL_OPERATIONS_ENABLED
          value: 'true'
        - name: TEORIA_MODEL_MLFLOW_URL
          value: http://mlflow:5000/mlflow
        - name: TEORIA_ADMIN_API_ROOT_PATH
          value: /admin-api
        - name: TEORIA_MODEL_PREFECT_URL
          value: http://prefect-server:4200/api
        - name: TEORIA_APP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_APP_DATABASE_URL
              optional: false
        - name: TEORIA_ADMIN_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_ADMIN_API_TOKEN
              optional: false
        - name: TEORIA_MODEL_PREFECT_AUTH
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: PREFECT_API_AUTH_STRING
        - name: TEORIA_IMAGE_REGISTRY_URL
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_IMAGE_REGISTRY_URL
              optional: true
        - name: TEORIA_IMAGE_REGISTRY_PUBLIC_HOST
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_IMAGE_REGISTRY_PUBLIC_HOST
              optional: true
        - name: TEORIA_IMAGE_REGISTRY_USERNAME
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_IMAGE_REGISTRY_USERNAME
              optional: true
        - name: TEORIA_IMAGE_REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_IMAGE_REGISTRY_PASSWORD
              optional: true
        - name: TEORIA_IMAGE_REGISTRY_CA_PEM
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_IMAGE_REGISTRY_CA_PEM
              optional: true
        command:
        - teoria-admin-api
        ports:
        - containerPort: 8001
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
spec:
  selector:
    app: admin-api
  ports:
  - port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-ui
  template:
    metadata:
      labels:
        app: admin-ui
    spec:
      containers:
      - name: admin-ui
        image: teoria/admin-ui:release
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env: []
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: &id001
            path: /
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: admin-ui
spec:
  selector:
    app: admin-ui
  ports:
  - port: 80
    targetPort: 80
