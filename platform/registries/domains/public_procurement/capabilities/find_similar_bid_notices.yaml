registry:
  version: 1.3.0
  registered_at: "2026-09-23"

capability:
  id: find_similar_bid_notices
  name: 유사 입찰공고 조회
  description: 과거 낙찰·계약 공고를 직접 비교, 동일 수요기관·동일 분야, 제목 탐색 후보군으로 구분하고 업종·분야·사업유형·금액대·계약방법·최근성의 설명 가능한 근거를 반환한다.
  kind: compute
  processor: market_context.find_similar_bid_notices
  effects:
    reads:
      - public_procurement.bid_notice
      - public_procurement.bid_award
      - public_procurement.contract
    produces:
      - public_procurement.similar_bid_notice
  inputs:
    bid_notice_id:
      property: public_procurement.bid_notice.bid_notice_id
      required: true
    period_years:
      data_type: integer
      default: 5
      minimum: 1
      maximum: 10
    result_statuses:
      data_type: string
      collection: list
      default: [awarded, contracted]
    page:
      data_type: integer
      default: 1
      minimum: 1
    page_size:
      data_type: integer
      default: 20
      minimum: 1
      maximum: 100
  returns:
    - public_procurement.similar_bid_notice
  lifecycle:
    status: deprecated
    deprecated_at: "2026-09-29"
    replacement_ids:
      - get_company_similar_project_experience
    reason: 제목·규칙 기반 공고 유사도를 업체의 구조화된 유사사업 경험으로 대체한다.
