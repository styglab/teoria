- document_id: sample_04
  revision_id: 40c6d6203877a0bdc50b8cbb4f2f71f3efcd5eb5a1c06bc9ac5756ac3c86289d
  source_sha256: 40c6d6203877a0bdc50b8cbb4f2f71f3efcd5eb5a1c06bc9ac5756ac3c86289d
  evidence:
  - evidence_id: e_vehicle
    quote: 동물이송진료용 차량
    locator: /blocks/20/table/cells/5/3
  - evidence_id: e_power
    quote: '- 차량 내부에서 이동형 의료장비 및 진료장비의 안정적인 사용이 가능하도록 별도의 전원공급 시스템을 구축

      ·인버터는 정격출력 3kW 이상으로 하며, 차량 전원을 의료장비 사용이 가능한 220V AC 전원으로 변환할 수 있어야 함

      ·차량 내부에 220V AC 콘센트를 2개소 이상 설치

      ·각 콘센트는 의료장비 사용에 적합하도록 안전하게 고정하고, 차량 운행 중 플러그가 쉽게 이탈하지 않는 구조

      ·분전함은 장비보관함 측면에 하이박스(High Box) 형태로 견고하게 고정·설치하고, 내부에 누전차단기 및 과전류·과부하 보호장치 등을 구성하여 전원회로를 안전하게 분배·차단할 수
      있는 구조 확보

      ·인버터 및 전기설비는 차량의 기존 전기계통 및 특장 설비와 적절히 연계하여 설치하고, 배선은 차량 운행 중 진동·마찰 등에 의해 손상되지 않도록 보호

      ·인버터 및 전기설비의 설치 위치는 진료공간의 사용성과 유지보수성을 고려하여 발주기관과 협의하여 결정'
    locator: /blocks/39/table/cells/5/1
  - evidence_id: e_table_inclusion
    quote: 이동형 진료대는 차량 구성품으로 포함
    locator: /blocks/39/table/cells/1/1
  - evidence_id: e_table
    quote: '- 차량에는 대형동물의 구조·이송 및 응급처치와 간이수술이 가능한 이동형 진료대 설치·비치

      - 진료대는 대형동물의 안전한 이송 및 진료가 가능하도록 견고한 구조로 제작

      상하 범위: 600~1,100㎜

      상판 크기: 1,600 × 600㎜

      허용하중: 200kg 이상

      - 진료 및 수술 시 작업 높이에 맞게 상판의 높이를 원활하게 조절할 수 있는 구조 확보

      - 차량 내 적재 후 주행 중 진료대가 움직이지 않도록 차량 고정장치 설치

      - 상판은 혈액·분변·소변 등 오염물의 흡수 및 잔류가 최소화되며 세척·소독이 용이한 재질로 마감

      - 진료대의 모서리 및 돌출부는 동물과 작업자의 부상 방지를 위해 안전하게 마감'
    locator: /blocks/39/table/cells/3/1
  - evidence_id: e_cage
    quote: 우치동물원에서 별도 제작하는 이동형 케이지(800 × 1,800 × 900㎜)
    locator: /blocks/39/table/cells/1/1
  - evidence_id: e_rail
    quote: '- 차량 바닥에는 이동형 진료대 및 이동형 케이지를 안전하게 고정할 수 있는 L-track 방식의 레일 시스템 설치

      - 레일 시스템은 이동형 진료대 및 이동형 케이지의 고정장치와 호환 가능한 구조로 제작하고, 각 고정장치의 체결 및 해제가 용이한 구조 확보

      - 레일은 차량 바닥에 견고하게 고정하여 차량 운행 중 진료대 및 케이지의 전후·좌우 이동 및 전도 방지

      - 레일 시스템은 알루미늄 또는 스테인리스 재질로 제작하고, 동물의 배설물·체액 및 세척·소독제 등에 대한 내구성 확보

      - 레일 및 체결장치는 차량의 구조와 진료대·케이지의 사용 형태를 고려하여 발주기관과 협의 후 설치 위치 및 수량 결정

      - 이동형 진료대 및 케이지의 원활한 적재·하역과 차량 내부 공간 활용을 고려하여 레일 돌출부 및 설치 높이를 최소화하고, 바닥 청소 및 소독이 용이한 구조로 제작'
    locator: /blocks/39/table/cells/4/1
  - evidence_id: e_space
    quote: 운전석·조수석 공간과 응급처치·간이수술 공간으로 구분
    locator: /blocks/39/table/cells/1/1
  - evidence_id: e_light
    quote: 수술 작업면 기준 조도 100,000 lux 이상
    locator: /blocks/39/table/cells/2/1
  - evidence_id: e_warranty
    quote: ·특장장치 전반사항에 대하여는 차량등록일 시점으로부터 2년을 적용한다.
    locator: /blocks/53
  - evidence_id: e_wiring_deliverable
    quote: · 특장부품 분해도, 특장 전기배선 결선도(감지기․스위치 등 위치표시)
    locator: /blocks/51
