[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teoria-platform"
version = "0.1.0"
description = "Teoria Semantic Platform registry and runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=1.0,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "redis>=6,<7",
  "teoria-provider-api",
  "uvicorn>=0.34,<1",
]

[tool.uv.sources]
teoria-provider-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
teoria = "teoria.entrypoints.cli:main"
teoria-runtime-api = "teoria.entrypoints.runtime_api:main"
teoria-admin-api = "teoria.entrypoints.admin_api:main"
teoria-policy-control-plane = "teoria.entrypoints.policy_control_plane:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teoria"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
