    locator: /blocks/107
  - evidence_id: e_camera
    quote: 나. 고해상도 초고속카메라(2대)(동적주행성능시험)
    locator: /blocks/119
  - evidence_id: e_motion
    quote: 바. 3차원 모션캡처 장치(정적상태진단시험)
    locator: /blocks/147
  - evidence_id: e_thermal
    quote: 사. 열화상카메라(정적상태진단시험)
    locator: /blocks/154
  - evidence_id: e_power
    quote: 마. 고정밀 전력측정장치(동적주행성능시험)
    locator: /blocks/139
  - evidence_id: e_motion_components
    quote: '6) 구성품 : 모션캡처 카메라 20 EA, 운영 소프트웨어 1 COPY, 브라켓 20 EA, 트러스(Truss) 구조물 1 SET'
    locator: /blocks/153
  - evidence_id: e_thermal_components
    quote: '5) 구성품 : 열화상카메라 1 EA, 표준 렌즈 1 EA, 기타 부속품 1 SET'
    locator: /blocks/159
  - evidence_id: e_test_subject
    quote: 본 시험장치는 트랙터, 농업용 로봇, 방제기, 수확기, 운반기, 전동 농기계 및 작업기 등 다양한 지능형 농기계를 대상으로 정적 상태와 실제 주행상태에서 발생하는 기체 거동,
      발열, 음향, 전자파, 영상, 위치, 주행궤적 및 전력 등의 물리량을 계측·분석하고, 이를 종합적으로 연계하여 시험대상의 상태 및 주행성능을 분석하기 위한 통합 시험장치이다.
    locator: /blocks/30
  - evidence_id: e_maximum_temperature
    quote: 3) 시험대상 주요 발열부 측정에 충분한 온도측정범위를 확보하여야 하며 최대 측정온도는 +1,000℃ 이상이어야 한다.
    locator: /blocks/157
  - evidence_id: e_position_accuracy
    quote: 3) 3차원 위치측정 정확도는 ±15 μm + 6 μm/m급 이하 또는 동등 이상의 성능을 확보하여야 한다.
    locator: /blocks/110
  - evidence_id: e_output_rate
    quote: 4) 위치데이터 출력속도는 100 Hz 이상이어야 하고, 실외 시험환경에서 안정적으로 운용할 수 있어야 한다.
    locator: /blocks/111
  - evidence_id: e_sync
    quote: '6) 데이터 연계 : 영상, 위치, 전력 및 상태진단 데이터를 공통 Trigger 또는 시간정보로 연계하고 분석·저장·Export할 수 있어야 한다.'
    locator: /blocks/104
  - evidence_id: e_acceptance
    quote: 100 Hz 이상 3차원 위치데이터 취득, Target 자동추적·재추적 및 주행궤적 분석기능 확인
