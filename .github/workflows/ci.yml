name: CI

on:
  pull_request:
  push:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: python3 -m unittest discover -s tests/documentation
      - run: python3 tests/documentation/check_docs.py
      - run: uv run --project backend --locked --all-extras --group orchestration teoria-pipelines deployment-docs --check docs/pipelines/deployments.md

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project backend --locked --all-extras --all-groups pytest backend/tests --ignore=backend/tests/integration
      - run: uv run --project backend --locked --extra api teoria validate backend/contracts/runtime
      - run: uv run --project backend --locked teoria-pipelines validate backend
      - run: uv run --project backend --locked --extra api teoria-pipelines validate-integration backend --platform-registries backend/contracts/runtime
      - run: uv run --project backend --locked --all-extras pytest backend/tests/integration/test_provider_reference_ownership.py

  application-db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teoria_app
          POSTGRES_USER: teoria_test
          POSTGRES_PASSWORD: teoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teoria_test -d teoria_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEORIA_TEST_APP_DATABASE_URL: postgresql://teoria_test:teoria_test@localhost:5432/teoria_app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project backend --locked --all-extras --group orchestration pytest backend/tests/integration/application

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teoria_data
          POSTGRES_USER: teoria_test
          POSTGRES_PASSWORD: teoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teoria_test -d teoria_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEORIA_TEST_DATA_DATABASE_URL: postgresql://teoria_test:teoria_test@localhost:5432/teoria_data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Initialize database roles
        run: |
          uv run --project backend --locked --all-extras --group orchestration python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["TEORIA_TEST_DATA_DATABASE_URL"], autocommit=True) as connection:
              connection.execute("CREATE ROLE teoria_pipeline")
              connection.execute("CREATE ROLE teoria_runtime")
          PY
      - name: Test Pipeline database integration
        run: uv run --project backend --locked --all-extras --group orchestration pytest backend/tests/integration/data_operations
      - name: Test Pipeline and Platform contracts
        run: uv run --project backend --locked --all-extras --group orchestration pytest tests/integration
      - run: uv run --project backend --locked --all-extras --group orchestration teoria-pipelines validate-integration backend --platform-registries backend/contracts/runtime

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test shared Prefect execution policies
        run: uv run --project backend --locked --all-extras --group orchestration --group kubernetes-orchestration pytest backend/tests/integrations/data_operations/test_deployment_registration.py backend/tests/integration/data_operations/test_prefect_scheduling.py
      - name: Validate Docker Compose
        env:
          TEORIA_ADMIN_API_TOKEN: validation
          TEORIA_LOCAL_RUNTIME_DB_PASSWORD: validation
          TEORIA_OPA_CONTROL_PLANE_TOKEN: validation
          TEORIA_PREFECT_PASSWORD: validation
          TEORIA_PREFECT_USERNAME: validation
          TEORIA_RUNTIME_API_TOKEN: validation
        run: docker compose -f deploy/compose/compose.yaml config --quiet
      - name: Validate manifests against a K3s API server
        run: |
          set -euo pipefail
          docker run -d --privileged --name teoria-ci-k3s --tmpfs /run --tmpfs /var/run \
            rancher/k3s:v1.37.1-k3s1 server --disable-agent --disable traefik \
            --disable servicelb --disable metrics-server --disable local-storage
          trap 'docker rm -fv teoria-ci-k3s >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec teoria-ci-k3s kubectl get --raw=/readyz >/dev/null 2>&1; then ready=true; break; fi
            echo "Waiting for K3s API ($attempt/60)"
            sleep 2
          done
          [ "$ready" = true ]
          # Traefik CRDs are installed separately because this API-only test disables Traefik.
          docker exec teoria-ci-k3s kubectl apply --server-side -f https://raw.githubusercontent.com/traefik/traefik/v3.7.16/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
          docker exec teoria-ci-k3s kubectl create namespace teoria
          docker exec teoria-ci-k3s kubectl create namespace teoria-pipelines
          for phase in execution infrastructure openmetadata application; do
            namespace=teoria
            if [ "$phase" = execution ]; then namespace=teoria-pipelines; fi
            docker run --rm --entrypoint kubectl -v "$PWD:/work" -w /work \
              ghcr.io/helmfile/helmfile:v1.7.1 kustomize "deploy/k3s/$phase" \
              --load-restrictor LoadRestrictionsNone \
              > "$RUNNER_TEMP/k3s-$phase.yaml"
            docker exec -i teoria-ci-k3s kubectl -n "$namespace" apply --dry-run=server -f - \
              < "$RUNNER_TEMP/k3s-$phase.yaml"
          done
          for job in deploy/k3s/jobs/*.yaml; do
            docker exec -i teoria-ci-k3s kubectl -n teoria apply --dry-run=server -f - < "$job"
          done
          bash -n deploy/k3s/deploy.sh
      - name: Test Compose volume isolation and authentication
        run: python3 -m unittest discover -s deploy/compose/tests -v
      - name: Validate OpenMetadata Compose profile
        env:
          TEORIA_ADMIN_API_TOKEN: validation
          TEORIA_LOCAL_RUNTIME_DB_PASSWORD: validation
          TEORIA_OPA_CONTROL_PLANE_TOKEN: validation
          TEORIA_PREFECT_PASSWORD: validation
          TEORIA_PREFECT_USERNAME: validation
          TEORIA_RUNTIME_API_TOKEN: validation
        run: >-
          docker compose
          -f deploy/compose/compose.yaml
          --profile metadata
          config --quiet
