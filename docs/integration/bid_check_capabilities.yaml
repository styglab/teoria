schema_version: "1.0"
consumer: bid_check
description: 입찰체크 서비스가 직접 사용하는 Runtime Capability 계약
retired_capabilities:
  - id: find_similar_bid_notices
    replacements: [search_bid_related_projects]
    reason: 입찰체크 시장 컨텍스트가 최신 관련 계약사업 검색 결과를 사용하도록 전환했다.
  - id: find_bid_relevant_companies
    replacements: [search_bid_related_projects]
    reason: 관련 사업의 계약업체를 입찰체크 adapter에서 집계하도록 전환했다.
  - id: analyze_bid_organization_field_companies
    replacements: [analyze_bid_participation_context]
    reason: 기관·분야 업체 화면을 최신 참여 판단 컨텍스트 결과로 전환했다.
  - id: get_bid_result
    replacements: [search_bid_awards, get_bid_notice_participations]
    reason: 공고별 낙찰과 개찰 참여 조회를 하나로 중복 조합하던 구 계약이다.
  - id: get_company_bid_history
    replacements: [search_bid_awards, search_bid_participations]
    reason: 기업별 낙찰과 참여 검색을 하나로 중복 조합하던 구 계약이다.
  - id: get_demand_organization
    replacements: [search_public_organizations]
    reason: Provider 등록일 기반 구 조회이며 최신 기관 검색 계약으로 대체한다.
  - id: get_women_owned_business_qualification
    replacements: [get_company_bid_qualification_profile]
    reason: 기업 입찰자격 프로필이 동일 자격과 직접생산확인을 함께 제공한다.
  - id: get_disabled_owned_business_qualification
    replacements: [get_company_bid_qualification_profile]
    reason: 기업 입찰자격 프로필이 동일 자격과 직접생산확인을 함께 제공한다.
  - id: verify_business_registration
    replacements: [get_business_registration_status]
    reason: 입찰평가는 사업자 상태조회만 사용하며 별도 진위확인 Capability 실행 경로가 없다.
internal_support_capabilities:
  assessment:
    - get_bid_notices_by_ids
    - get_bid_requirements_by_notice_ids
    - get_business_registration_status
    - get_company_qualifications
    - get_direct_production_confirmations
    - get_procurement_supplier
    - get_procurement_supplier_industries
    - get_procurement_supplier_products
    - get_procurement_supplier_sanctions
    - verify_innobiz_company
    - verify_mainbiz_company
    - verify_venture_company
  company_identity:
    - get_company_profile
    - get_company_financials
    - get_company_relationships
    - resolve_company_identifiers
  market_context:
    - get_company_similar_project_experience
ontology_decision:
  change_required: true
  strategy: new_draft_from_published
  target_namespace: teoria
  reuse_stable_concepts: true
  rationale: 기존 Published artifact는 재사용하지 않되 의미가 같은 stable concept를 승계한 새 Draft를 검토·게시하고 Capability를 다시 연결한다.
capabilities:
  - {id: search_bid_notices, area: bid_notice, status: active}
  - {id: get_bid_notice, area: bid_notice, status: active}
  - {id: get_bid_requirements, area: bid_notice, status: active}
  - {id: get_bid_participation_findings, area: bid_notice, status: active}
  - {id: get_bid_notice_participations, area: bid_notice, status: active}
  - {id: get_bid_notice_contracts, area: bid_notice, status: active}
  - {id: get_bid_notice_relationship_context, area: bid_notice, status: active}
  - {id: find_bid_project_lineage, area: bid_notice, status: active}
  - {id: analyze_bid_participation_context, area: bid_analysis, status: active}
  - {id: search_bid_related_projects, area: bid_analysis, status: active}
  - {id: search_public_organizations, area: organization, status: active}
  - {id: analyze_organization_procurement_profile, area: organization, status: active}
  - {id: search_procurement_activity, area: organization, status: active}
  - {id: search_procurement_outcomes, area: organization, status: active}
  - {id: search_organization_supplier_entries, area: organization, status: active}
  - {id: get_organization_company_relationship, area: organization, status: active}
  - {id: search_public_procurement_contracts, area: organization, status: active}
  - {id: get_company_procurement_profile, area: company, status: active}
  - {id: get_company_bid_qualification_profile, area: company, status: active}
  - {id: get_company_detail_context, area: company, status: active}
  - {id: analyze_company_procurement_profile, area: company, status: active}
  - {id: search_bid_participations, area: company, status: active}
  - {id: analyze_company_competitors, area: company, status: active}
  - {id: search_companies_by_name, area: company, status: active}
  - {id: search_bid_awards, area: award, status: active}
  - {id: assess_company_bid_eligibility, area: eligibility, status: active}
  - {id: assess_company_bid_eligibilities, area: eligibility, status: active}
