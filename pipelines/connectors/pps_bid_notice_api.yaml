  operations:
  - id: list_construction_bid_notices
    name: 나라장터검색조건에 의한 입찰공고공사조회
    method: GET
    idempotent: true
    path: /getBidPblancListInfoCnstwkPPSSrch
    description: 검색조건에 공고게시일시, 개찰일시 범위, 공고기관, 수요기관, 참조번호 등을 입력하여 나라장터의 입찰공고번호, 공고명, 발주기관, 수요기관, 계약체결방법명 등 공사부분의 입찰공고정보를 조회함
    pagination:
      type: page_number
      page:
        request: query.pageNo
      page_size:
        request: query.numOfRows
      total_count: response.body.totalCount
    request:
      query:
        fields:
        - id: numOfRows
          name: 한 페이지 결과 수
          data_type: integer
        - id: pageNo
          name: 페이지 번호
          data_type: integer
        - id: type
          name: 타입
          data_type: string
          default: json
          values:
          - value: json
          - value: xml
        - id: inqryDiv
          name: 조회구분
          data_type: string
          values:
          - value: '1'
          - value: '2'
        - id: inqryBgnDt
          name: 조회시작일시
          data_type: string
        - id: inqryEndDt
          name: 조회종료일시
          data_type: string
        - id: bidNtceNm
          name: 입찰공고명
          data_type: string
        - id: ntceInsttCd
          name: 공고기관코드
          data_type: string
        - id: ntceInsttNm
          name: 공고기관명
          data_type: string
        - id: dminsttCd
          name: 수요기관코드
          data_type: string
        - id: dminsttNm
          name: 수요기관명
          data_type: string
        - id: refNo
          name: 참조번호
          data_type: string
        - id: prtcptLmtRgnCd
          name: 참가제한지역코드
          data_type: string
        - id: prtcptLmtRgnNm
          name: 참가제한지역명
          data_type: string
        - id: indstrytyCd
          name: 업종코드
          data_type: string
        - id: indstrytyNm
          name: 업종명
          data_type: string
        - id: presmptPrceBgn
          name: 추정가격시작
          data_type: string
        - id: presmptPrceEnd
          name: 추정가격종료
          data_type: string
        - id: dtilPrdctClsfcNo
          name: 세부품명번호
          data_type: string
        - id: masYn
          name: 다수공급경쟁자여부
          data_type: string
        - id: prcrmntReqNo
          name: 조달요청번호
          data_type: string
        - id: bidClseExcpYn
          name: 입찰마감제외여부
          data_type: string
        - id: intrntnlDivCd
          name: 국제입찰구분코드
          data_type: string
        required:
        - numOfRows
        - pageNo
        - inqryDiv
    response:
      content_type: application/json
      http_status: 200
      control:
        record_path: response.header
        success:
          field: resultCode
          equals: '00'
        fields:
        - id: resultCode
          name: 결과코드
          data_type: string
          values:
          - value: '00'
            label: 정상
        - id: resultMsg
          name: 결과메세지
          data_type: string
      data:
        record_path: response.body.items[]
        ref: construction_bid_notice
