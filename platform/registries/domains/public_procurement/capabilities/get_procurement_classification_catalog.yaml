registry:
  version: 1.0.0
  registered_at: "2026-10-13"
capability:
  id: get_procurement_classification_catalog
  exposure: public
  name: 공식 조달분류 카탈로그 조회
  description: 공고 원천에서 확인된 공식 조달분류 코드와 명칭, 대·중분류 계층 및 관측 범위를 안정적인 cursor로 조회한다.
  kind: compute
  processor: procurement_exploration.get_procurement_classification_catalog
  semantic_requirements:
    concepts:
      - stable_key: procurement.Industry
      - stable_key: procurement.BidNotice
    properties:
      - stable_key: procurement.Industry.industryCode
      - stable_key: procurement.Industry.name
      - stable_key: procurement.BidNotice.workType
    relationships:
      - stable_key: procurement.CLASSIFIED_AS_INDUSTRY
  effects:
    reads: [public_procurement.bid_notice]
    produces: [public_procurement.procurement_classification_catalog]
  inputs:
    query: {data_type: string}
    work_type: {data_type: string, enum: [goods, service, construction, foreign, other, unknown]}
    large_category: {data_type: string}
    middle_category: {data_type: string}
    limit: {data_type: integer, default: 50, minimum: 1, maximum: 100}
    cursor: {data_type: string}
  returns: [public_procurement.procurement_classification_catalog]
