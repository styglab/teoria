map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream admin_api {
    zone admin_api 64k;
    server admin-api:8001 resolve;
}

upstream runtime_api {
    zone runtime_api 64k;
    server runtime-api:8000 resolve;
}

upstream prefect_server {
    zone prefect_server 64k;
    server prefect-server:4200 resolve;
}

upstream minio_console {
    zone minio_console 64k;
    server minio:9001 resolve;
}

# Local Compose edge proxy.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /admin-api/v1/admin/specification-processing/documents {
        client_max_body_size 40m;
        proxy_pass http://admin_api/v1/admin/specification-processing/documents;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
    }

    location /admin-api/ {
        proxy_pass http://admin_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /runtime-api/ {
        proxy_pass http://runtime_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional demo serving resolves only when requested; core UI starts without MLOps.
    location /inference-api/ {
        set $model_upstream demo-inference:8003;
        rewrite ^/inference-api/(.*)$ /$1 break;
        proxy_pass http://$model_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # MLflow uses the existing Prefect operator credentials, checked server-side.
    # Keep the optional upstream lazy so the core stack starts without MLOps.
    location = /_operations_auth {
        internal;
        proxy_pass http://prefect_server/api/admin/version;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location @operations_login {
        add_header WWW-Authenticate 'Basic realm="Teoria operations"' always;
        return 401;
    }

    location /mlflow/ {
        auth_request /_operations_auth;
        error_page 401 = @operations_login;
        set $mlflow_upstream mlflow:5000;
        proxy_pass http://$mlflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host mlflow:5000;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prefect/api/ {
        proxy_pass http://prefect_server/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /prefect/ {
        proxy_pass http://prefect_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /minio {
        absolute_redirect off;
        return 308 /minio/;
    }

    # Only the authenticated object browser is proxied; S3 stays on the internal API.
    location /minio/ {
        client_max_body_size 40m;
        proxy_pass http://minio_console/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
