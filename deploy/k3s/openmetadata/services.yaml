apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmetadata-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmetadata-server
  template:
    metadata:
      labels:
        app: openmetadata-server
    spec:
      containers:
      - name: openmetadata-server
        image: docker.getcollate.io/openmetadata/server:2.0.5
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
            cpu: '2'
        env:
        - name: DB_DRIVER_CLASS
          value: org.postgresql.Driver
        - name: DB_SCHEME
          value: postgresql
        - name: DB_PARAMS
          value: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
        - name: DB_USER
          value: openmetadata_user
        - name: DB_HOST
          value: platform-postgres
        - name: DB_PORT
          value: '5432'
        - name: OM_DATABASE
          value: openmetadata_db
        - name: SEARCH_TYPE
          value: elasticsearch
        - name: ELASTICSEARCH_HOST
          value: openmetadata-search
        - name: ELASTICSEARCH_PORT
          value: '9200'
        - name: ELASTICSEARCH_SCHEME
          value: http
        - name: PIPELINE_SERVICE_CLIENT_ENABLED
          value: 'false'
        - name: AUTHENTICATION_PROVIDER
          value: basic
        - name: AUTHORIZER_CLASS_NAME
          value: org.openmetadata.service.security.DefaultAuthorizer
        - name: DB_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: OPENMETADATA_DB_PASSWORD
        ports:
        - containerPort: 8585
        readinessProbe:
          tcpSocket: &id001
            port: 8586
          periodSeconds: 10
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 10
          failureThreshold: 90
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata-server
spec:
  selector:
    app: openmetadata-server
  ports:
  - port: 8585
    targetPort: 8585
