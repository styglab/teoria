registry:
  version: 1.2.0
  registered_at: "2026-09-12"

capability:
  id: assess_company_bid_eligibilities
  exposure: public
  name: 기업 입찰 참가자격 일괄 평가
  description: 한 기업과 최대 100개 입찰공고의 bid_entry 참가요건을 평가하여 목록 표시용 종합 결과, 대표 요건 분류별 판정, 결과별 개수와 주요 문제 요건을 공고별로 반환한다.
  kind: decision
  processor: assessment.evaluate_bid_eligibilities
  semantic_requirements:
    concepts:
      - stable_key: procurement.BidNotice
      - stable_key: procurement.BidRequirementSet
      - stable_key: procurement.BidRequirement
      - stable_key: party.BusinessRegistration
      - stable_key: party.TaxpayerStatusObservation
      - stable_key: party.Qualification
      - stable_key: party.Certification
      - stable_key: procurement.Industry
      - stable_key: procurement.RegisteredIndustry
      - stable_key: procurement.SupplyProduct
      - stable_key: procurement.RegisteredSupplyProduct
      - stable_key: procurement.Sanction
    properties:
      - stable_key: procurement.BidNotice.bidNoticeId
      - stable_key: procurement.BidRequirementSet.requirementSetId
      - stable_key: procurement.BidRequirementSet.expression
      - stable_key: procurement.BidRequirement.requirementId
      - stable_key: procurement.BidRequirement.requirementType
      - stable_key: procurement.BidRequirement.originalText
      - stable_key: party.BusinessRegistration.businessRegistrationNumber
      - stable_key: party.TaxpayerStatusObservation.businessStatus
      - stable_key: party.Qualification.qualificationType
      - stable_key: party.Qualification.validFrom
      - stable_key: party.Qualification.validTo
      - stable_key: party.Certification.certificationType
      - stable_key: party.Certification.validFrom
      - stable_key: party.Certification.validTo
      - stable_key: procurement.Industry.industryCode
      - stable_key: procurement.RegisteredIndustry.validFrom
      - stable_key: procurement.RegisteredIndustry.validTo
      - stable_key: procurement.SupplyProduct.productCode
      - stable_key: procurement.Sanction.validFrom
      - stable_key: procurement.Sanction.validTo
    relationships:
      - stable_key: procurement.HAS_REQUIREMENT_SET
      - stable_key: procurement.CONTAINS_REQUIREMENT
      - stable_key: party.HAS_TAXPAYER_STATUS
      - stable_key: party.HAS_QUALIFICATION
      - stable_key: party.HAS_CERTIFICATION
      - stable_key: procurement.REGISTRATION_HAS_INDUSTRY
      - stable_key: procurement.CLASSIFIED_AS_INDUSTRY
      - stable_key: procurement.REGISTRATION_HAS_SUPPLY_PRODUCT
      - stable_key: procurement.CLASSIFIED_AS_SUPPLY_PRODUCT
      - stable_key: procurement.HAS_SANCTION
  effects:
    reads:
      - company.business_registration
      - company.taxpayer_status_observation
      - company.qualification
      - public_procurement.bid_notice
      - public_procurement.bid_requirement
    produces:
      - assessment.bid_eligibility_assessment
  inputs:
    business_registration_number:
      property: company.business_registration.business_registration_number
      required: true
    bid_notice_ids:
      property: public_procurement.bid_notice.bid_notice_id
      collection: list
      required: true
    reference_date:
      property: assessment.bid_eligibility_assessment.reference_date
    participation_mode:
      property: assessment.bid_eligibility_assessment.participation_mode
  returns:
    - assessment.bid_eligibility_assessment
