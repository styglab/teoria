apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/teoria
patches:
- target:
    kind: PersistentVolumeClaim
  patch: "- op: add\n  path: /spec/storageClassName\n  value: local-path\n"
- target:
    kind: Ingress
  patch: "- op: add\n  path: /spec/ingressClassName\n  value: traefik\n"
