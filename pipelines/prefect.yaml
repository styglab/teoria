name: teoria-data-pipelines
prefect-version: 3.8.1

build: null
push: null
pull: null

deployments:
  - name: pps-industry-weekly
    version: 1.1.0
    description: 나라장터 표준업종과 근거법규 전체 사전을 매주 일요일 동기화한다.
    entrypoint: teoria_pipelines.flows.pps_industries.sync_pps_industries
    concurrency_limit: {limit: 1, collision_strategy: CANCEL_NEW}
    parameters: {pipeline_root: /app/pipelines}
    schedules:
      - cron: "0 3 * * 0"
        timezone: Asia/Seoul
        active: true
    work_pool: {name: teoria-ingestion, work_queue_name: default}

  - name: pps-bid-notice-ingestion
    version: 1.1.0
    description: 신규·변경 나라장터 입찰공고를 수집하고 공고번호별 면허제한과 참가가능지역을 보강한다.
    entrypoint: teoria_pipelines.flows.pps_bid_notices.sync_pps_bid_notices
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      pipeline_root: /app/pipelines
      lookback_days: 1
      enrichment_batch_size: 20
    schedules:
      - cron: "0 * * * *"
        timezone: Asia/Seoul
        active: true
    work_pool:
      name: teoria-ingestion
      work_queue_name: default

  - name: pps-bid-document-processing
    version: 1.0.0
    description: 입찰공고에서 발견한 첨부파일을 다운로드하고 checksum과 함께 Object Storage에 저장한다.
    entrypoint: teoria_pipelines.flows.pps_bid_notices.sync_pps_bid_documents
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      batch_size: 500
      concurrency: 8
    schedules:
      - cron: "15 * * * *"
        timezone: Asia/Seoul
        active: false
    work_pool:
      name: teoria-ingestion
      work_queue_name: default

  - name: pps-contract-incremental
    version: 1.0.0
    description: 최근 나라장터 계약정보를 4시간마다 다시 조회하여 신규·변경 데이터를 반영한다.
    entrypoint: teoria_pipelines.flows.pps_contracts.sync_pps_contract_incremental
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      pipeline_root: /app/pipelines
      lookback_days: 3
    schedules:
      - cron: "0 */4 * * *"
        timezone: Asia/Seoul
        active: true
    work_pool:
      name: teoria-ingestion
      work_queue_name: default

  - name: pps-bid-result-incremental
    version: 1.1.0
    description: 최근 3일의 최종낙찰과 해당 공고의 개찰 참여업체 결과를 4시간마다 갱신한다.
    entrypoint: teoria_pipelines.flows.pps_bid_results.sync_pps_bid_results_incremental
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      pipeline_root: /app/pipelines
      lookback_days: 3
    schedules:
      - cron: "30 */4 * * *"
        timezone: Asia/Seoul
        active: true
    work_pool:
      name: teoria-ingestion
      work_queue_name: default

  - name: pps-bid-notice-reconciliation-3d
    version: 1.0.0
    description: 최근 3일의 신규·변경 입찰공고와 참가제한 정보를 매일 보정한다.
    entrypoint: teoria_pipelines.flows.pps_bid_notices.sync_pps_bid_notices
    concurrency_limit: {limit: 1, collision_strategy: CANCEL_NEW}
    parameters:
      pipeline_root: /app/pipelines
      lookback_days: 3
    schedules:
      - {cron: "10 1 * * *", timezone: Asia/Seoul, active: false}
    work_pool: {name: teoria-ingestion, work_queue_name: default}

  - name: pps-contract-reconciliation-30d
    version: 1.0.0
    description: 최근 30일 계약정보의 지연 등록과 정정을 매일 보정한다.
    entrypoint: teoria_pipelines.flows.pps_contracts.sync_pps_contract_incremental
    concurrency_limit: {limit: 1, collision_strategy: CANCEL_NEW}
    parameters: {pipeline_root: /app/pipelines, lookback_days: 30}
    schedules:
      - {cron: "0 2 * * *", timezone: Asia/Seoul, active: true}
    work_pool: {name: teoria-ingestion, work_queue_name: default}

  - name: pps-contract-reconciliation-90d
    version: 1.0.0
    description: 최근 90일 계약정보의 장기 지연·정정을 매주 보정한다.
    entrypoint: teoria_pipelines.flows.pps_contracts.sync_pps_contract_incremental
    concurrency_limit: {limit: 1, collision_strategy: CANCEL_NEW}
    parameters: {pipeline_root: /app/pipelines, lookback_days: 90}
    schedules:
      - {cron: "0 3 * * 0", timezone: Asia/Seoul, active: true}
    work_pool: {name: teoria-ingestion, work_queue_name: default}

  - name: pps-bid-result-reconciliation-30d
    version: 1.0.0
    description: 최근 30일 개찰 건의 지연 낙찰 확정과 참여업체 결과를 매일 보정한다.
    entrypoint: teoria_pipelines.flows.pps_bid_results.sync_pps_bid_results_incremental
    concurrency_limit: {limit: 1, collision_strategy: CANCEL_NEW}
    parameters: {pipeline_root: /app/pipelines, lookback_days: 30}
    schedules:
      - {cron: "30 2 * * *", timezone: Asia/Seoul, active: true}
    work_pool: {name: teoria-ingestion, work_queue_name: default}

  - name: pps-bid-result-reconciliation-90d
    version: 1.0.0
    description: 최근 90일 개찰 건의 장기 지연 낙찰 확정을 매주 보정한다.
    entrypoint: teoria_pipelines.flows.pps_bid_results.sync_pps_bid_results_incremental
    concurrency_limit: {limit: 1, collision_strategy: CANCEL_NEW}
    parameters: {pipeline_root: /app/pipelines, lookback_days: 90}
    schedules:
      - {cron: "30 3 * * 0", timezone: Asia/Seoul, active: true}
    work_pool: {name: teoria-ingestion, work_queue_name: default}

  - name: pps-bid-document-parsing
    version: 1.2.0
    description: 저장된 입찰공고 첨부파일을 페이지·문단·표 단위 JSON으로 파싱한다.
    entrypoint: teoria_pipelines.flows.bid_eligibility.parse_pps_bid_documents
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      batch_size: 100
      concurrency: 4
    schedules:
      - cron: "*/10 * * * *"
        timezone: Asia/Seoul
        active: false
    work_pool:
      name: teoria-ai-extraction
      work_queue_name: default

  - name: pps-bid-document-retention
    version: 1.0.0
    description: 입찰 마감 후 90일이 지난 원본·파싱·AI 출력 객체를 삭제하고 메타데이터와 정규 요건은 보존한다.
    entrypoint: teoria_pipelines.flows.pps_bid_notices.purge_expired_pps_bid_documents
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      retention_days: 90
      batch_size: 500
    schedules:
      - cron: "45 3 * * *"
        timezone: Asia/Seoul
        active: true
    work_pool:
      name: teoria-ingestion
      work_queue_name: default

  - name: pps-bid-eligibility-extraction
    version: 1.14.0
    description: 최신 활성 공고 20건을 선점하고 결정론적 추출 또는 Codex 추출을 최대 4개 병렬 실행한다.
    entrypoint: teoria_pipelines.flows.bid_eligibility.extract_pps_bid_eligibility
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      batch_size: 20
    schedules:
      - cron: "5-55/10 * * * *"
        timezone: Asia/Seoul
        active: false
    work_pool:
      name: teoria-ai-extraction
      work_queue_name: default

  - name: pps-contract-backfill
    version: 1.1.0
    description: 2026-09-13부터 2021-01-01까지 최신 연도 우선으로 나라장터 계약정보를 Backfill한다.
    entrypoint: teoria_pipelines.flows.pps_contracts.sync_pps_contract_backfill
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      checkpoint_id: pps_contract_backfill_2021_2026
      start_date: "2021-01-01"
      end_date: "2026-09-13"
      pipeline_root: /app/pipelines
      batch_days: 30
    schedules:
      - cron: "20 * * * *"
        timezone: Asia/Seoul
        active: true
    work_pool:
      name: teoria-ingestion
      work_queue_name: default

  - name: pps-bid-notice-backfill
    version: 1.0.0
    description: 2026-09-13부터 2021-01-01까지 최신 날짜 우선으로 첨부파일을 제외한 나라장터 입찰공고와 참가제한 정보를 Backfill한다.
    entrypoint: teoria_pipelines.flows.pps_bid_notices.sync_pps_bid_notice_backfill
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      checkpoint_id: pps_bid_notice_backfill_2021_2026
      start_date: "2021-01-01"
      end_date: "2026-09-13"
      pipeline_root: /app/pipelines
      batch_days: 30
      enrichment_batch_size: 20
    schedules:
      - cron: "50 * * * *"
        timezone: Asia/Seoul
        active: false
    work_pool:
      name: teoria-ingestion
      work_queue_name: default

  - name: pps-bid-result-backfill
    version: 1.1.0
    description: 2026-09-13부터 2021-01-01까지 최신 연도 우선으로 개찰일시 기준 낙찰정보를 Backfill한다.
    entrypoint: teoria_pipelines.flows.pps_bid_results.sync_pps_bid_results_backfill
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      checkpoint_id: pps_bid_result_backfill_5y
      start_date: "2021-01-01"
      end_date: "2026-09-13"
      pipeline_root: /app/pipelines
      batch_days: 30
    schedules:
      - cron: "40 * * * *"
        timezone: Asia/Seoul
        active: true
    work_pool:
      name: teoria-ingestion
      work_queue_name: default
