[tool.uv.workspace]
members = ["packages/provider_api", "packages/goods_normalization", "packages/codex_inference", "platform", "pipelines", "mcp"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["."]
norecursedirs = [".git", ".venv", "node_modules", "archive"]
