registry:
  version: 1.0.0
  registered_at: '2026-10-26'
capability:
  id: get_server_requirement_evidence
  name: 서버 요구조건 원문 근거 조회
  description: checksum으로 고정된 추출 산출물에서 원문 node와 조건을 조회한다.
  version: 1.0.0
  exposure: public
  returns:
  - server_specifications.requirement_observation
  semantic_requirements:
    concepts:
    - stable_key: computer_server.server
    - stable_key: computer_server.memory
    properties:
    - stable_key: computer_server.server.memory_capacity
    - stable_key: computer_server.memory.capacity
    relationships:
    - stable_key: computer_server.has_memory
  kind: compute
  processor: server_specifications.evidence
  inputs:
    snapshot_id:
      data_type: string
      field: specification_observations.server_requirements.snapshot_id
      required: true
    observation_id:
      data_type: string
      field: specification_observations.server_requirements.observation_id
      required: true
