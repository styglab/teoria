apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../base/mlops/base
- ../../../generic/mlops/base/ingress.yaml
components:
- ../../../../components/web_proxy
patches:
- target:
    kind: PersistentVolumeClaim
  patch: |-
    - op: add
      path: /spec/storageClassName
      value: local-path
- target:
    kind: Ingress
  patch: |-
    - op: add
      path: /spec/ingressClassName
      value: traefik
