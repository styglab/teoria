# The public deployment probe trusts the local certificate explicitly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
spec:
  template:
    spec:
      containers:
        - name: admin-api
          volumeMounts:
            - name: local-tls
              mountPath: /run/teoria-local-tls
              readOnly: true
      volumes:
        - name: local-tls
          secret:
            secretName: teoria-tls
            items:
              - key: tls.crt
                path: tls.crt
