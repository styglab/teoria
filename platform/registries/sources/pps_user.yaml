    - id: list_demand_organizations
      name: 수요기관정보조회
      method: GET
      idempotent: true
      path: /getDminsttInfo02
      description: 수요기관코드, 사업자등록번호 또는 수요기관명과 조회 기준 기간으로 수요기관정보 목록을 조회한다.
      pagination: &pagination
        type: page_number
        page: {request: query.pageNo}
        page_size: {request: query.numOfRows}
        total_count: response.body.totalCount
      request:
        query:
          fields:
            - {id: numOfRows, name: 한 페이지 결과 수, data_type: integer, default: 100}
            - {id: pageNo, name: 페이지 번호, data_type: integer, default: 1}
            - &type_field
              id: type
              name: 타입
              data_type: string
              default: json
              values: [{value: json}, {value: xml}]
            - {id: inqryDiv, name: 조회구분, data_type: string, default: "3", values: [{value: "1"}, {value: "2"}, {value: "3"}]}
            - {id: inqryBgnDt, name: 조회기준시작일시, data_type: string}
            - {id: inqryEndDt, name: 조회기준종료일시, data_type: string}
            - {id: dminsttCd, name: 수요기관코드, data_type: string}
            - {id: dminsttNm, name: 수요기관명, data_type: string}
            - {id: bizno, name: 사업자등록번호, data_type: string}
          required: [numOfRows, pageNo, inqryDiv]
      response: &demand_response
        content_type: application/json
        http_status: 200
        control: &control
          record_path: response.header
          success: {field: resultCode, equals: "00"}
          fields:
            - {id: resultCode, name: 결과코드, data_type: string, values: [{value: "00", label: 정상}]}
            - {id: resultMsg, name: 결과메세지, data_type: string}
        data:
          record_path: response.body.items[]
          ref: demand_organization
