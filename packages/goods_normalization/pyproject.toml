[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teoria-goods-normalization"
version = "0.1.0"
description = "Versioned goods normalization contracts consumed by Platform and Pipelines"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/teoria_goods_normalization"]
