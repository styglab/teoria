apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-prefix
spec:
  stripPrefix:
    prefixes:
    - /admin-api
    - /runtime-api
    - /prefect
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teoria
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - teoria.invalid
    secretName: teoria-tls
  rules:
  - host: teoria.invalid
    http:
      paths:
      - path: /prefect
        pathType: Prefix
        backend:
          service:
            name: prefect-server
            port:
              number: 4200
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-ui
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teoria-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: teoria-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - teoria.invalid
    secretName: teoria-tls
  rules:
  - host: teoria.invalid
    http:
      paths:
      - path: /admin-api
        pathType: Prefix
        backend:
          service:
            name: admin-api
            port:
              number: 8001
      - path: /prefect/api
        pathType: Prefix
        backend:
          service:
            name: prefect-server
            port:
              number: 4200
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-auth
spec:
  basicAuth:
    secret: model-ui-auth
    realm: Teoria MLOps
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teoria-mlflow
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: teoria-mlflow-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - teoria.invalid
    secretName: teoria-tls
  rules:
  - host: teoria.invalid
    http:
      paths:
      - path: /mlflow
        pathType: Prefix
        backend:
          service:
            name: mlflow
            port:
              number: 5000
