name: teoria

services:
  data-db:
    image: postgres:17
    environment:
      POSTGRES_DB: teoria_data
      POSTGRES_USER: teoria_pipeline
      POSTGRES_PASSWORD: ${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teoria_pipeline -d teoria_data"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - data-db:/var/lib/postgresql/data

  data-db-migrate:
    build:
      context: ../..
      dockerfile: pipelines/Dockerfile
      target: worker
    command:
      - teoria-pipelines
      - migrate
      - --migrations
      - /app/pipelines/database/migrations
    environment:
      TEORIA_PIPELINE_DATA_DATABASE_URL: postgresql://teoria_pipeline:${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}@data-db:5432/teoria_data
    depends_on:
      data-db:
        condition: service_healthy

  prefect-db:
    image: postgres:17
    environment:
      POSTGRES_DB: prefect
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${TEORIA_LOCAL_PREFECT_DB_PASSWORD:-prefect_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - prefect-db:/var/lib/postgresql/data

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${TEORIA_LOCAL_PREFECT_DB_PASSWORD:-prefect_local}@prefect-db:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
    depends_on:
      prefect-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "4200:4200"

  prefect-init:
    build:
      context: ../..
      dockerfile: pipelines/Dockerfile
      target: worker
    command: ["prefect", "work-pool", "create", "--type", "process", "--overwrite", "teoria-ingestion"]
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy

  deployment-apply:
    build:
      context: ../..
      dockerfile: pipelines/Dockerfile
      target: worker
    command: ["prefect", "deploy", "--all", "--prefect-file", "/app/pipelines/prefect.yaml"]
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-init:
        condition: service_completed_successfully

  ingestion-worker:
    build:
      context: ../..
      dockerfile: pipelines/Dockerfile
      target: worker
    command: ["prefect", "worker", "start", "--pool", "teoria-ingestion"]
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      TEORIA_PIPELINE_PATH: /app/pipelines
      TEORIA_PIPELINE_DATA_DATABASE_URL: postgresql://teoria_pipeline:${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}@data-db:5432/teoria_data
      TEORIA_CONNECTOR_PPS_CONTRACT_API_KEY: ${TEORIA_CONNECTOR_PPS_CONTRACT_API_KEY:-}
      TEORIA_PIPELINE_SOURCE_TIMEOUT_SECONDS: ${TEORIA_PIPELINE_SOURCE_TIMEOUT_SECONDS:-30}
      TEORIA_PIPELINE_SOURCE_MAX_ATTEMPTS: ${TEORIA_PIPELINE_SOURCE_MAX_ATTEMPTS:-3}
    depends_on:
      data-db-migrate:
        condition: service_completed_successfully
      deployment-apply:
        condition: service_completed_successfully

volumes:
  data-db:
  prefect-db:
