registry:
  version: 1.0.0
  registered_at: '2026-10-26'
capability:
  id: compare_server_specifications
  name: 서버 규격서 요구조건 비교
  description: 동일 의미·단위·역할·범위·Ontology와 프로파일 버전일 때만 비교한다. 여러 서버 또는 중복 조건은 모호함으로 반환한다.
  version: 1.0.0
  exposure: public
  returns:
  - server_specifications.requirement_observation
  semantic_requirements:
    concepts:
    - stable_key: computer_server.server
    - stable_key: computer_server.memory
    properties:
    - stable_key: computer_server.server.memory_capacity
    - stable_key: computer_server.memory.capacity
    relationships:
    - stable_key: computer_server.has_memory
  kind: compute
  processor: server_specifications.compare
  inputs:
    left_snapshot_id:
      data_type: string
      required: true
    right_snapshot_id:
      data_type: string
      required: true
