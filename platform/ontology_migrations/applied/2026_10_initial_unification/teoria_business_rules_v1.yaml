schema_version: "1.0"
ontology_namespace: teoria
ontology_version: 0.1.0
rules:
  - code: BID_NOTICE_IDENTITY
    name: 공고 식별자 구성
    stable_key: procurement.rule.BID_NOTICE_IDENTITY
    subject: BidNotice
    description: 공고번호와 공고차수를 결합해 공고 식별자를 만든다.
    evaluator_key: procurement.bid_notice_identity.v1
    expression: {operation: concat, arguments: [noticeNumber, ":", noticeOrder]}
  - code: PROCUREMENT_LOT_IDENTITY
    name: 조달 분할 단위 식별자 구성
    stable_key: procurement.rule.PROCUREMENT_LOT_IDENTITY
    subject: ProcurementLot
    description: 공고번호·공고차수·입찰분류번호·재입찰번호를 결합한다.
    evaluator_key: procurement.procurement_lot_identity.v1
    expression: {operation: concat, arguments: [noticeNumber, ":", noticeOrder, ":", bidClassificationNumber, ":", rebidNumber]}
  - code: BID_PARTICIPATION_IDENTITY
    name: 입찰 참여 식별자 구성
    stable_key: procurement.rule.BID_PARTICIPATION_IDENTITY
    subject: BidParticipation
    description: 조달 분할 단위 식별자와 사업자등록번호를 결합한다.
    evaluator_key: procurement.bid_participation_identity.v1
    expression: {operation: concat, arguments: [lotId, ":", businessRegistrationNumber]}
  - code: CONTRACT_EVENT_IDENTITY
    name: 원계약 사건 식별
    stable_key: procurement.rule.CONTRACT_EVENT_IDENTITY
    subject: Contract
    description: 장기계속 계약은 공고와 계약명으로 묶고, 그 외에는 확정계약번호·계약참조번호·통합계약번호 순으로 선택한다.
    evaluator_key: procurement.contract_event_identity.v1
    expression:
      operation: case
      when:
        all: [longTermContinuation, normalizedNoticePresent, contractNamePresent]
        value: {operation: concat, arguments: ["long_term:", normalizedNoticeNumber, ":", {operation: md5, argument: trimmedContractName}]}
      otherwise: {operation: coalesce_non_blank, arguments: [confirmedContractNumber, contractReferenceNumber, unifiedContractNumber]}
  - code: CURRENT_CONTRACT_VERSION
    name: 현재 계약 버전 선택
    stable_key: procurement.rule.CURRENT_CONTRACT_VERSION
    subject: Contract
    description: 분석 종료시점 이전 버전 중 계약체결일·수정시각·통합계약번호 내림차순 첫 버전을 선택한다.
    evaluator_key: procurement.current_contract_version.v1
    expression:
      operation: first
      filter: {sourceChangedAt: {lte: analysisPeriodTo}}
      order_by: [concludedDate_desc_nulls_last, updatedAt_desc, unifiedContractNumber_desc]
  - code: CURRENT_CONTRACT_AMOUNT
    name: 현재 계약금액 선택
    stable_key: procurement.rule.CURRENT_CONTRACT_AMOUNT
    subject: Contract
    description: 장기계속 계약의 유효한 총액을 우선하고, 없으면 선택된 버전의 현재 계약금액을 사용한다.
    evaluator_key: procurement.current_contract_amount.v1
    expression:
      operation: case
      when: {all: [longTermContinuation, totalAmountPositive], value: totalAmount}
      otherwise: currentContractAmount
  - code: CONTRACT_PARTY_ATTRIBUTED_AMOUNT
    name: 계약업체 귀속금액
    stable_key: procurement.rule.CONTRACT_PARTY_ATTRIBUTED_AMOUNT
    subject: ContractParty
    description: 확인된 지분율을 적용하고 단독계약은 전체 금액을 귀속하며, 복수 업체의 미확인 지분은 금액을 추정하지 않는다.
    evaluator_key: procurement.contract_party_attributed_amount.v1
    expression:
      operation: case
      cases:
        - {when: sharePercentPresent, value: {operation: multiply, arguments: [contractAmount, {operation: divide, arguments: [sharePercent, 100]}]}}
        - {when: soleContractor, value: contractAmount}
      otherwise: null
