# API backends listen at /; their public prefixes are carried by FastAPI root_path.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-prefix
spec:
  stripPrefix:
    prefixes:
    - /admin-api
    - /runtime-api
    - /prefect
---
# UI assets and the Prefect UI retain their public paths.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teoria
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - teoria.invalid
    secretName: teoria-tls
  rules:
  - host: teoria.invalid
    http:
      paths:
      - path: /prefect
        pathType: Prefix
        backend:
          service:
            name: prefect-server
            port:
              number: 4200
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-ui
            port:
              number: 80
---
# The longer /prefect/api route wins over the Prefect UI route above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teoria-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: teoria-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - teoria.invalid
    secretName: teoria-tls
  rules:
  - host: teoria.invalid
    http:
      paths:
      - path: /admin-api
        pathType: Prefix
        backend:
          service:
            name: admin-api
            port:
              number: 8001
      - path: /runtime-api
        pathType: Prefix
        backend:
          service:
            name: runtime-api
            port:
              number: 8000
      - path: /prefect/api
        pathType: Prefix
        backend:
          service:
            name: prefect-server
            port:
              number: 4200
