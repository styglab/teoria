registry:
  version: 1.1.0
  registered_at: "2026-08-08"

ontology:
  id: assessment
  name: 평가 업무 온톨로지
  description: 기업과 업무 대상 사이에서 수행된 평가, 개별 요건 판단과 그 판단에 사용된 근거를 표현한다.

  object_types:
    - id: bid_eligibility_assessment
      name: 입찰 참가자격 평가
      description: 특정 사업자를 특정 입찰공고의 참가요건에 대하여 평가한 업무 결과
      primary_key: assessment_id
      properties:
        - {id: assessment_id, name: 평가 식별자, description: 하나의 참가자격 평가 실행을 식별하는 값, data_type: string}
        - {id: assessment_fingerprint, name: 평가 지문, description: 회사·공고·기준일·요건·규칙·근거 버전을 조합한 재현 가능한 평가 지문, data_type: string}
        - {id: business_registration_number, name: 사업자등록번호, description: 참가자격 평가 대상 사업자의 사업자등록번호, data_type: business_registration_number}
        - {id: bid_notice_id, name: 입찰공고 식별자, description: 참가자격을 평가한 입찰공고의 Teoria 식별자, data_type: string}
        - {id: reference_date, name: 평가 기준일, description: 자격과 증빙의 유효성을 판단한 기준 날짜, data_type: date}
        - {id: participation_mode, name: 참가방식, description: 평가에 적용한 단독 또는 공동수급 참가방식, data_type: string}
        - {id: outcome, name: 종합 평가 결과, description: 개별 요건 평가를 집계한 전체 참가자격 평가 결과, value_set: assessment_outcome}
        - {id: lifecycle_status, name: 평가 실행 상태, description: 평가 업무의 실행 완료·검토 필요·실패 상태, value_set: assessment_lifecycle_status}
        - {id: requirement_set_hash, name: 요건 집합 해시, description: 평가에 사용한 정규화된 참가요건 집합의 내용 해시, data_type: string}
        - {id: evidence_fingerprint, name: 근거 지문, description: 평가에 사용한 회사 및 공고 근거들의 내용과 관찰시점을 식별하는 지문, data_type: string}
        - {id: ruleset_version, name: 평가 규칙 버전, description: 결과 계산에 사용한 평가 규칙 집합의 버전, data_type: string}
        - {id: registry_version, name: Registry 버전, description: 평가 실행에 사용한 Semantic Registry 릴리스 버전, data_type: string}
        - {id: satisfied_count, name: 충족 요건 수, description: 충족으로 평가된 개별 참가요건의 수, data_type: integer}
        - {id: unsatisfied_count, name: 미충족 요건 수, description: 미충족으로 평가된 개별 참가요건의 수, data_type: integer}
        - {id: needs_review_count, name: 확인 필요 요건 수, description: 사람의 확인이 필요한 개별 참가요건의 수, data_type: integer}
        - {id: started_at, name: 평가 시작시각, description: Runtime이 참가자격 평가 실행을 시작한 시각, data_type: datetime}
        - {id: completed_at, name: 평가 완료시각, description: Runtime이 참가자격 평가 실행을 완료한 시각, data_type: datetime}

    - id: requirement_assessment
      name: 입찰 참가요건 평가
      description: 특정 사업자가 입찰공고의 개별 참가요건을 충족하는지 판단한 업무 결과
      primary_key: requirement_assessment_id
      properties:
        - {id: requirement_assessment_id, name: 요건 평가 식별자, description: 전체 평가와 개별 요건을 조합하여 생성한 요건 평가 식별자, data_type: string}
        - {id: assessment_id, name: 평가 식별자, description: 개별 요건 평가가 속한 참가자격 평가의 식별자, data_type: string}
        - {id: requirement_id, name: 참가요건 식별자, description: 평가 대상이 된 입찰 참가요건의 식별자, data_type: string}
        - {id: business_registration_number, name: 사업자등록번호, description: 개별 요건의 평가 대상 사업자등록번호, data_type: business_registration_number}
        - {id: outcome, name: 요건 평가 결과, description: 개별 참가요건의 충족·미충족·확인 필요 결과, value_set: assessment_outcome}
        - {id: reason_code, name: 평가 사유 코드, description: 개별 요건 평가 결과의 기계 판독 가능한 사유 코드, value_set: assessment_reason_code}
        - {id: required_value_text, name: 요구값 요약, description: 입찰공고가 요구하는 정규화된 값의 표시용 요약, data_type: string}
        - {id: evaluated_value_text, name: 평가값 요약, description: 회사 근거에서 확인하여 요구값과 비교한 실제 값의 표시용 요약, data_type: string}
        - {id: reasoning_summary, name: 판단 요약, description: 요구조건과 회사 근거를 어떻게 비교했는지 설명하는 짧은 판단 요약, data_type: string}
        - {id: evaluator_id, name: 평가기 식별자, description: 개별 요건을 평가한 Runtime Evaluator의 안정적인 식별자, data_type: string}
        - {id: evaluator_version, name: 평가기 버전, description: 개별 판단에 사용한 Evaluator 구현 버전, data_type: string}
        - {id: evaluated_at, name: 평가시각, description: 개별 참가요건 판단이 수행된 시각, data_type: datetime}

    - id: evidence
      name: 평가 근거
      description: 개별 요건 평가에 사용된 공고문 구간, 공식 API 관찰값, 데이터베이스 레코드 또는 기업 제출문서의 참조
      primary_key: evidence_id
      properties:
        - {id: evidence_id, name: 근거 식별자, description: 평가에서 사용한 하나의 근거 참조를 식별하는 값, data_type: string}
        - {id: evidence_kind, name: 근거 유형, description: 공고문서·정형 API·DB·기업문서·수동확인 중 근거의 유형, value_set: assessment_evidence_kind}
        - {id: source_id, name: Source 식별자, description: 근거를 조회한 Teoria Source 또는 Database Source 식별자, data_type: string}
        - {id: source_operation_id, name: Source Operation 식별자, description: 근거를 조회한 외부 API Operation 또는 DB Relation 식별자, data_type: string}
        - {id: source_record_id, name: 원천 레코드 식별자, description: 비밀정보를 포함하지 않는 범위에서 원천 레코드를 식별하는 값, data_type: string}
        - {id: document_id, name: 문서 식별자, description: 공고 또는 기업 증빙문서에서 유래한 경우 해당 문서의 식별자, data_type: string}
        - {id: property_path, name: 속성 경로, description: 판단에 사용한 Ontology 또는 원천 필드의 경로, data_type: string}
        - {id: observed_value_text, name: 관찰값 요약, description: 판단에 사용한 값을 안전하게 표현한 표시용 요약, data_type: string}
        - {id: page_number, name: 페이지 번호, description: 문서 근거가 위치한 1부터 시작하는 페이지 번호, data_type: integer}
        - {id: section, name: 문서 구역, description: 근거 문구가 속한 문서의 장 또는 구역 명칭, data_type: string}
        - {id: clause, name: 문서 조항, description: 근거 문구가 속한 조항 또는 항목 식별자, data_type: string}
        - {id: excerpt, name: 근거 발췌문, description: 판단을 뒷받침하는 데 필요한 범위로 제한한 원문 발췌, data_type: string}
        - {id: observed_at, name: 관찰시각, description: 공식 원천 또는 저장된 사실을 조회하여 관찰한 시각, data_type: datetime}
        - {id: valid_from, name: 유효기간 시작일, description: 근거가 효력을 갖기 시작하는 날짜, data_type: date}
        - {id: valid_until, name: 유효기간 종료일, description: 근거의 효력이 종료되는 날짜, data_type: date}
        - {id: content_hash, name: 내용 해시, description: 원문 전체를 노출하지 않고 근거 내용의 동일성을 확인하기 위한 해시, data_type: string}

  link_types:
    - id: business_registration_has_bid_eligibility_assessment
      description: 사업자등록으로 식별되는 기업을 대상으로 입찰 참가자격 평가가 수행됐음을 나타낸다.
      source: company.business_registration
      target: bid_eligibility_assessment
    - id: bid_eligibility_assessment_evaluates_bid_notice
      description: 입찰 참가자격 평가가 특정 입찰공고의 요건을 대상으로 수행됐음을 나타낸다.
      source: bid_eligibility_assessment
      target: public_procurement.bid_notice
    - id: requirement_assessment_belongs_to_bid_eligibility_assessment
      description: 개별 참가요건 평가가 하나의 입찰 참가자격 평가 실행에 속함을 나타낸다.
      source: requirement_assessment
      target: bid_eligibility_assessment
    - id: requirement_assessment_evaluates_bid_requirement
      description: 개별 참가요건 평가가 공고에 정의된 특정 참가요건을 판단했음을 나타낸다.
      source: requirement_assessment
      target: public_procurement.bid_requirement
    - id: requirement_assessment_evaluated_for_business_registration
      description: 개별 참가요건 평가의 대상이 특정 사업자등록으로 식별되는 기업임을 나타낸다.
      source: requirement_assessment
      target: company.business_registration
    - id: requirement_assessment_supported_by_evidence
      description: 개별 참가요건 평가 결과가 하나 이상의 평가 근거에 의해 뒷받침됨을 나타낸다.
      source: requirement_assessment
      target: evidence
    - id: evidence_derived_from_qualification
      description: 평가 근거가 기업의 특정 자격 객체에서 파생됐음을 나타낸다.
      source: evidence
      target: company.qualification
    - id: evidence_derived_from_direct_production_confirmation
      description: 평가 근거가 특정 직접생산확인 객체에서 파생됐음을 나타낸다.
      source: evidence
      target: public_procurement.direct_production_confirmation
