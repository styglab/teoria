registry:
  version: 1.0.0
  registered_at: "2026-10-07"
capability:
  id: analyze_procurement_relationship_context
  exposure: public
  name: 기관·업체 조달관계 컨텍스트 분석
  description: 기관코드 또는 사업자등록번호를 기준으로 동일 기간·업무유형·공식 조달분류 필터가 적용된 분류 계약 ledger의 직접 관계를 1단계 또는 2단계까지 집계한다. 기관과 업체는 코드로 식별하고 계약은 고유 계약사건으로 중복 제거한다. 업체 및 관계 금액은 귀속금액만 사용하며 귀속금액이 없을 때 총계약금액으로 대체하지 않는다. 분야 필터가 없으면 미분류 계약 제외를 완전성 정보로 알리고, 노드·관계 제한을 초과하면 절단 여부와 사유를 반환한다.
  kind: compute
  processor: market_context.analyze_procurement_relationship_context
  semantic_requirements:
    concepts:
      - stable_key: procurement.Organization
      - stable_key: procurement.Contract
      - stable_key: procurement.ContractParty
      - stable_key: procurement.Industry
      - stable_key: party.BusinessRegistration
    properties:
      - stable_key: procurement.Organization.organizationCode
      - stable_key: procurement.Contract.contractId
      - stable_key: procurement.Contract.currentAmount
      - stable_key: procurement.Contract.firstContractDate
      - stable_key: procurement.ContractParty.attributedAmount
      - stable_key: procurement.ContractParty.role
      - stable_key: procurement.Industry.industryCode
      - stable_key: party.BusinessRegistration.businessRegistrationNumber
    relationships:
      - stable_key: procurement.HAS_CONTRACT_PARTY
      - stable_key: procurement.REPRESENTS_CONTRACTOR
      - stable_key: procurement.SIGNS
      - stable_key: procurement.CLASSIFIED_AS_INDUSTRY
  effects:
    reads: [public_procurement.contract]
    produces: [public_procurement.procurement_relationship_context]
  inputs:
    seed_type:
      data_type: string
      required: true
      enum: [organization, company]
    seed_id: {data_type: string, required: true}
    depth: {data_type: integer, default: 2, minimum: 1, maximum: 2}
    period_years: {data_type: integer, default: 5, minimum: 1, maximum: 15}
    period_from_year: {data_type: integer, minimum: 2000, maximum: 2100}
    period_to_year: {data_type: integer, minimum: 2000, maximum: 2100}
    work_type:
      data_type: string
      enum: [goods, service, construction, foreign, other, unknown]
    large_category: {data_type: string}
    middle_category: {data_type: string}
    field_code: {data_type: string}
    minimum_contract_count: {data_type: integer, default: 1, minimum: 1}
    minimum_contract_amount: {data_type: number, default: 0, minimum: 0}
    sort:
      data_type: string
      enum: [contract_amount_desc, contract_count_desc, latest_contract_desc]
      default: contract_amount_desc
    max_organizations: {data_type: integer, default: 30, minimum: 1, maximum: 200}
    max_companies: {data_type: integer, default: 50, minimum: 1, maximum: 500}
    max_links: {data_type: integer, default: 200, minimum: 1, maximum: 2000}
  returns: [public_procurement.procurement_relationship_context]
