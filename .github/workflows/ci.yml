name: CI

on:
  pull_request:
  push:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: python3 -m unittest discover -s tests/documentation
      - run: python3 tests/documentation/check_docs.py
      # Render the authoritative declarations; the retired duplicate inventory file is not maintained.
      - run: uv run --project backend --locked --all-extras --group orchestration teoria-pipelines deployment-docs > /dev/null

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  admin-ui-visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-visual-diffs
          path: |
            frontend/playwright-report/
            frontend/test-results/

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project backend --locked --all-extras --all-groups pytest backend/tests --ignore=backend/tests/integration
      - run: uv run --project backend --locked --extra api teoria validate backend/contracts/runtime
      - run: uv run --project backend --locked teoria-pipelines validate backend
      - run: uv run --project backend --locked --extra api teoria-pipelines validate-integration backend --platform-registries backend/contracts/runtime
      - run: uv run --project backend --locked --all-extras pytest backend/tests/integration/test_provider_reference_ownership.py

  application-db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teoria_app
          POSTGRES_USER: teoria_test
          POSTGRES_PASSWORD: teoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teoria_test -d teoria_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEORIA_TEST_APP_DATABASE_URL: postgresql://teoria_test:teoria_test@localhost:5432/teoria_app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project backend --locked --all-extras --group orchestration pytest backend/tests/integration/application

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teoria_data
          POSTGRES_USER: teoria_test
          POSTGRES_PASSWORD: teoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teoria_test -d teoria_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEORIA_TEST_DATA_DATABASE_URL: postgresql://teoria_test:teoria_test@localhost:5432/teoria_data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Initialize database roles
        run: |
          uv run --project backend --locked --all-extras --group orchestration python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["TEORIA_TEST_DATA_DATABASE_URL"], autocommit=True) as connection:
              connection.execute("CREATE ROLE teoria_pipeline")
              connection.execute("CREATE ROLE teoria_runtime")
          PY
      - name: Test Pipeline database integration
        run: uv run --project backend --locked --all-extras --group orchestration pytest backend/tests/integration/data_operations
      - name: Test Pipeline and Platform contracts
        run: uv run --project backend --locked --all-extras --group orchestration pytest tests/integration
      - run: uv run --project backend --locked --all-extras --group orchestration teoria-pipelines validate-integration backend --platform-registries backend/contracts/runtime

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test shared Prefect execution policies
        run: uv run --project backend --locked --all-extras --group orchestration --group kubernetes-orchestration pytest backend/tests/platform/data/operations/test_deployment_registration.py backend/tests/integration/data_operations/test_prefect_scheduling.py
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.1
      - name: Test portable Kubernetes rendering
        run: uv run --project backend --locked --all-extras --group orchestration --group kubernetes-orchestration pytest backend/tests/entrypoints/test_kubernetes_deployment.py backend/tests/integration/test_specification_execution_contract.py -q
      - name: Validate manifests against a Kubernetes API server
        run: |
          set -euo pipefail
          docker run -d --privileged --name teoria-ci-k3s --tmpfs /run --tmpfs /var/run \
            rancher/k3s:v1.37.1-k3s1 server --disable-agent --disable traefik \
            --disable servicelb --disable metrics-server --disable local-storage
          trap 'docker rm -fv teoria-ci-k3s >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec teoria-ci-k3s kubectl get --raw=/readyz >/dev/null 2>&1; then ready=true; break; fi
            echo "Waiting for K3s API ($attempt/60)"
            sleep 2
          done
          [ "$ready" = true ]
          docker exec teoria-ci-k3s kubectl create namespace teoria
          docker exec teoria-ci-k3s kubectl create namespace teoria-pipelines
          docker exec teoria-ci-k3s kubectl create namespace teoria-models
          # All environments use the same standard Ingress and UI proxy routing.
          for overlay in generic k3s k3d; do
            bash deploy/kubernetes/deploy.sh ghcr.io/example/teoria aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa teoria.example.com \
              --component all --overlay "$overlay" --storage-class validation-csi --shared-storage-class validation-rwx --ingress-class public \
              --model-registry-host registry.example.com --render > "$RUNNER_TEMP/kubernetes-$overlay.yaml"
            docker exec -i teoria-ci-k3s kubectl apply --dry-run=server -f - < "$RUNNER_TEMP/kubernetes-$overlay.yaml"
          done
          bash -n deploy/kubernetes/deploy.sh
      - name: Test portable UI proxy routing and authentication
        run: |
          docker build --target admin -t teoria-kubernetes-proxy-client:validation -f backend/Dockerfile .
          docker pull nginx:1.27-alpine
          TEORIA_TEST_KUBERNETES_PROXY_DOCKER=1 TEORIA_KUBERNETES_PROXY_CLIENT_IMAGE=teoria-kubernetes-proxy-client:validation \
            uv run --project backend --locked --all-extras --group orchestration --group docker-orchestration \
            pytest backend/tests/integration/test_kubernetes_proxy_docker.py -q
      - name: Test Registry through the shared edge proxy
        run: |
          docker pull registry:3.1.2
          TEORIA_TEST_REGISTRY_DOCKER=1 TEORIA_REGISTRY_TEST_CLIENT_IMAGE=teoria-kubernetes-proxy-client:validation \
            uv run --project backend --locked --all-extras --group orchestration --group docker-orchestration \
            pytest backend/tests/integration/test_image_registry_docker.py -q
