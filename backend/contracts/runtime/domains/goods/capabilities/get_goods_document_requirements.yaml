registry:
  version: 1.0.0
  registered_at: '2026-11-10'
capability:
  id: get_goods_document_requirements
  name: 게시 의미로 문서 요구조건 조회
  description: 승인된 표현 연결·프로파일과 게시 Ontology를 고정한 artifact에서 문서 관찰을 조회한다. 작성 DB나 원본
    Registry를 조회하지 않는다.
  version: 1.0.0
  kind: query
  exposure: public
  processor: goods.document_requirements
  implementation:
    handler: goods.document_requirements
    code_version: 1.0.0
  policy:
    permissions: [metadata_admin]
  effects:
    reads:
    - goods_requirements.document
  inputs:
    run_id:
      data_type: string
      required: true
    document_id:
      data_type: string
      required: true
    concept_id:
      data_type: string
    offset:
      data_type: integer
      minimum: 0
      default: 0
    limit:
      data_type: integer
      minimum: 1
      maximum: 100
      default: 100
  returns:
  - goods_requirements.document
  lifecycle:
    status: validated
