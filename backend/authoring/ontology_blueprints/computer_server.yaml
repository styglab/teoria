schema_version: '1.0'
namespace: computer_server
name: 컴퓨터 서버
description: 서버와 메모리 용량의 지속 가능한 업무 의미. 문서별 수치·연산·범위는 관찰로 관리한다.
target_version: 0.1.0
objects:
- code: server
  name: 컴퓨터 서버
  stable_key: computer_server.server
  identity_properties:
  - item_id
  properties:
  - code: item_id
    name: 물품 항목 식별자
    stable_key: computer_server.server.item_id
    value_type: string
    cardinality: one
  - code: memory_capacity
    name: 메모리 용량
    stable_key: computer_server.server.memory_capacity
    value_type: decimal
    unit: GB
  description: 납품 요구의 주체인 컴퓨터 서버. 같은 이름으로 문서 간 동일 물품임을 추론하지 않는다.
- code: memory
  name: 서버 메모리
  stable_key: computer_server.memory
  description: 서버 구성의 메모리. 시스템 전체와 모듈별 요구값은 관찰의 적용 범위로 구분한다.
  identity_properties:
  - item_id
  properties:
  - code: item_id
    name: 구성 항목 식별자
    stable_key: computer_server.memory.item_id
    value_type: string
    cardinality: one
  - code: capacity
    name: 메모리 용량
    stable_key: computer_server.memory.capacity
    value_type: decimal
    unit: GB
relationships:
- code: has_memory
  name: 메모리를 갖는다
  stable_key: computer_server.has_memory
  source: server
  target: memory
  description: 원문에 근거가 있는 서버와 메모리 구성의 연결
