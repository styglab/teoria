registry:
  version: 1.0.0
  registered_at: "2026-08-08"

capability:
  id: get_company_bid_qualification_profile
  exposure: public
  name: 기업 입찰 자격 프로필 조회
  description: 기준일에 유효한 기업 자격과 세부품명별 직접생산확인을 함께 조회한다.
  semantic_requirements:
    concepts:
      - stable_key: party.BusinessEntity
      - stable_key: party.BusinessRegistration
      - stable_key: party.Qualification
      - stable_key: party.Certification
    properties:
      - stable_key: party.BusinessRegistration.businessRegistrationNumber
      - stable_key: party.Qualification.qualificationId
      - stable_key: party.Qualification.qualificationType
      - stable_key: party.Qualification.validFrom
      - stable_key: party.Qualification.validTo
      - stable_key: party.Certification.certificationId
      - stable_key: party.Certification.certificationType
      - stable_key: party.Certification.validFrom
      - stable_key: party.Certification.validTo
    relationships:
      - stable_key: party.HAS_BUSINESS_REGISTRATION
      - stable_key: party.HAS_QUALIFICATION
      - stable_key: party.HAS_CERTIFICATION
  inputs:
    business_registration_number:
      property: company.business_registration.business_registration_number
      required: true
    reference_date:
      property: company.qualification.reference_date
      required: true
  steps:
    - call: kodma_smpp_certificate.list_women_owned_business_certificates
    - call: kodma_smpp_certificate.list_disabled_owned_business_certificates
    - call: kodma_smpp_certificate.list_direct_production_certificates
  returns:
    - company.business_registration
    - company.qualification
    - company.business_registration_has_qualification
    - public_procurement.direct_production_confirmation
    - public_procurement.business_registration_has_direct_production_confirmation
