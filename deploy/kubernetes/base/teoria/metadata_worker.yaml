apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-metadata-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-metadata-worker
  template:
    metadata:
      labels:
        app: prefect-metadata-worker
    spec:
      containers:
      - name: prefect-metadata-worker
        image: teoria/metadata-worker:release
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env:
        - name: TEORIA_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: teoria-mlops-connections
              key: TEORIA_ENVIRONMENT
        - name: TEORIA_PIPELINE_PATH
          value: /app/backend
        - name: PREFECT_API_URL
          valueFrom:
            configMapKeyRef:
              name: teoria-mlops-connections
              key: PREFECT_API_URL
        - name: TEORIA_OPENMETADATA_INGESTION_BACKEND
          value: kubernetes
        - name: TEORIA_KUBERNETES_NAMESPACE
          value: teoria
        - name: TEORIA_KUBERNETES_IMAGE_PULL_SECRET
          value: teoria-registry
        - name: TEORIA_OPENMETADATA_INGESTION_ALLOWED_IMAGE
          value: teoria/ingestion:release
        - name: PREFECT_API_AUTH_STRING
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: PREFECT_API_AUTH_STRING
        command:
        - prefect
        - worker
        - start
        - --pool
        - teoria-metadata
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: true
      serviceAccountName: teoria-metadata-worker
  strategy:
    type: Recreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teoria-metadata-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teoria-metadata-worker
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teoria-metadata-worker
subjects:
- kind: ServiceAccount
  name: teoria-metadata-worker
  namespace: teoria
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teoria-metadata-worker
