apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openmetadata-search
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openmetadata-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmetadata-search
  template:
    metadata:
      labels:
        app: openmetadata-search
    spec:
      containers:
      - name: openmetadata-search
        image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 3Gi
            cpu: '2'
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms1g -Xmx1g
        - name: node.store.allow_mmap
          value: 'false'
        ports:
        - containerPort: 9200
        readinessProbe:
          httpGet: &id001
            path: /_cluster/health
            port: 9200
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        volumeMounts:
        - name: openmetadata-search
          mountPath: /usr/share/elasticsearch/data
          readOnly: false
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
      volumes:
      - name: openmetadata-search
        persistentVolumeClaim:
          claimName: openmetadata-search
      securityContext:
        fsGroup: 1000
  serviceName: openmetadata-search
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata-search
spec:
  selector:
    app: openmetadata-search
  ports:
  - port: 9200
    targetPort: 9200
