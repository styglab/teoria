apiVersion: batch/v1
kind: Job
metadata:
  name: metadata-register
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: metadata-register
    spec:
      containers:
      - name: metadata-register
        image: teoria/metadata-worker:release
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env:
        - name: TEORIA_PREFECT_SCHEDULES_ENABLED
          valueFrom:
            configMapKeyRef:
              name: teoria-mlops-connections
              key: TEORIA_METADATA_SYNC_SCHEDULE_ENABLED
        - name: TEORIA_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: teoria-mlops-connections
              key: TEORIA_ENVIRONMENT
        - name: TEORIA_PIPELINE_PATH
          value: /app/backend
        - name: PREFECT_API_URL
          valueFrom:
            configMapKeyRef:
              name: teoria-mlops-connections
              key: PREFECT_API_URL
        - name: TEORIA_OPENMETADATA_INGESTION_ALLOWED_IMAGE
          value: teoria/ingestion:release
        - name: PREFECT_API_AUTH_STRING
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: PREFECT_API_AUTH_STRING
        command:
        - teoria-pipelines
        - register
        - --backend
        - kubernetes
        - --kind
        - metadata
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
      restartPolicy: Never
