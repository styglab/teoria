registry:
  version: 1.1.0
  registered_at: "2026-09-26"

capability:
  id: analyze_bid_organization_field_companies
  name: 기관·분야 수주업체 분석
  description: 현재 공고를 기준으로 실제 낙찰·확정계약 이력이 있는 업체를 세 관계로 구분하고 설명 가능한 수주 근거, 단계별 실행시간과 Registry 버전 기반 캐시 상태를 반환한다.
  kind: compute
  processor: market_context.analyze_bid_organization_field_companies
  effects:
    reads:
      - public_procurement.bid_notice
      - public_procurement.bid_award
      - public_procurement.contract
    produces:
      - public_procurement.bid_organization_field_company
  inputs:
    bid_notice_id:
      property: public_procurement.bid_notice.bid_notice_id
      required: true
    period_years:
      data_type: integer
      default: 5
      minimum: 1
      maximum: 10
    limit:
      data_type: integer
      default: 50
      minimum: 1
      maximum: 100
  returns:
    - public_procurement.bid_organization_field_company
