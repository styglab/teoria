    bid_notice.notice_number:
      - {field: teoria_public_procurement.bid_requirement_sets.notice_number, role: requirement_set_notice}
    bid_notice.notice_order:
      - {field: teoria_public_procurement.bid_requirement_sets.notice_order, role: requirement_set_notice}
    bid_requirement.bid_notice_id:
      - {field: teoria_public_procurement.bid_requirement_sets.bid_notice_id}
    bid_requirement.notice_number:
      - {field: teoria_public_procurement.bid_requirement_sets.notice_number}
    bid_requirement.notice_order:
      - {field: teoria_public_procurement.bid_requirement_sets.notice_order}
    bid_requirement_set.requirement_set_id:
      - {field: teoria_public_procurement.bid_requirement_sets.requirement_set_id}
    bid_requirement_set.bid_notice_id:
