apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-postgres-init
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: platform-postgres-init
    spec:
      containers:
      - name: mlops-postgres-init
        image: postgres:17
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env:
        - name: PGHOST
          value: platform-postgres
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: postgres
        - name: PGUSER
          value: platform_admin
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_LOCAL_PLATFORM_DB_PASSWORD
        - name: TEORIA_LOCAL_APP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_LOCAL_APP_DB_PASSWORD
        - name: TEORIA_LOCAL_PREFECT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_LOCAL_PREFECT_DB_PASSWORD
        - name: TEORIA_MLFLOW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: model-control
              key: TEORIA_MLFLOW_DB_PASSWORD
              optional: false
        command:
        - sh
        - -ec
        - 'psql --set=ON_ERROR_STOP=1 --set=app_password="$TEORIA_LOCAL_APP_DB_PASSWORD"
          --set=prefect_password="$TEORIA_LOCAL_PREFECT_DB_PASSWORD" --set=mlflow_password="$TEORIA_MLFLOW_DB_PASSWORD"
          <<''SQL''

          SELECT format(''CREATE ROLE teoria_app LOGIN PASSWORD %L'', :''app_password'')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=''teoria_app'');

          \gexec

          SELECT format(''ALTER ROLE teoria_app PASSWORD %L'', :''app_password'');

          \gexec

          SELECT format(''CREATE ROLE prefect LOGIN PASSWORD %L'', :''prefect_password'')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=''prefect'');

          \gexec

          SELECT format(''ALTER ROLE prefect PASSWORD %L'', :''prefect_password'');

          \gexec

          SELECT format(''CREATE ROLE mlflow LOGIN PASSWORD %L'', :''mlflow_password'')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=''mlflow'');

          \gexec

          SELECT format(''ALTER ROLE mlflow PASSWORD %L'', :''mlflow_password'');

          \gexec

          SELECT ''CREATE DATABASE teoria_app OWNER teoria_app'' WHERE NOT EXISTS
          (SELECT 1 FROM pg_database WHERE datname=''teoria_app'');

          \gexec

          SELECT ''CREATE DATABASE prefect OWNER prefect'' WHERE NOT EXISTS (SELECT
          1 FROM pg_database WHERE datname=''prefect'');

          \gexec

          SELECT ''CREATE DATABASE mlflow OWNER mlflow'' WHERE NOT EXISTS (SELECT
          1 FROM pg_database WHERE datname=''mlflow'');

          \gexec

          REVOKE CONNECT ON DATABASE teoria_app, prefect, mlflow FROM PUBLIC;

          GRANT CONNECT ON DATABASE teoria_app TO teoria_app, platform_admin;

          GRANT CONNECT ON DATABASE prefect TO prefect, platform_admin;

          GRANT CONNECT ON DATABASE mlflow TO mlflow, platform_admin;

          SQL'
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
      restartPolicy: Never
