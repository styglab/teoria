name: teoria-metadata-pipelines
prefect-version: 3.8.1
build: null
push: null
pull: null
deployments:
- name: openmetadata-postgres-metadata-sync
  version: 1.0.0
  description: Teoria Data PostgreSQL metadata를 격리된 OpenMetadata ingestion container로
    동기화한다.
  entrypoint: teoria.features.metadata_management.ingestion.openmetadata.sync_openmetadata_postgres
  concurrency_limit:
    limit: 1
    collision_strategy: CANCEL_NEW
  parameters:
    timeout_seconds: 1800
  schedules:
  - cron: 0 5 * * *
    timezone: Asia/Seoul
    active: true
