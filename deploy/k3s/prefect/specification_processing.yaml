pools:
- name: teoria-specification-k3s
  type: kubernetes
  concurrency_limit: 2
  concurrency_limit_env: TEORIA_PIPELINE_CONCURRENCY
  job_secret: teoria-pipeline-secrets
  queues:
  - name: documents
    priority: 1
    concurrency_limit: 2
    concurrency_limit_env: TEORIA_PIPELINE_CONCURRENCY
deployments:
- name: specification-standard-management
  work_pool:
    name: teoria-specification-k3s
    work_queue_name: documents
- name: specification-document-processing
  work_pool:
    name: teoria-specification-k3s
    work_queue_name: documents
- name: specification-standard-workflow
  work_pool:
    name: teoria-specification-k3s
    work_queue_name: documents
