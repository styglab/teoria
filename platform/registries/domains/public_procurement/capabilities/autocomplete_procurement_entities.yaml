registry:
  version: 1.1.0
  registered_at: "2026-10-13"
capability:
  id: autocomplete_procurement_entities
  exposure: public
  name: 조달 개체 자동완성
  description: Runtime 내부 데이터에서 공고·기관·조달업체·공식 조달분류의 선택 후보를 이름·번호·초성으로 검색하고 공고의 모든 구조화 참가 지역조건을 포함한 자동 적용 필터와 누락값을 반환한다.
  kind: compute
  processor: procurement_exploration.autocomplete_procurement_entities
  semantic_requirements:
    concepts:
      - stable_key: procurement.BidNotice
      - stable_key: procurement.Organization
      - stable_key: party.BusinessRegistration
      - stable_key: procurement.Industry
    properties:
      - stable_key: procurement.BidNotice.bidNoticeId
      - stable_key: procurement.BidNotice.noticeName
      - stable_key: procurement.Organization.organizationCode
      - stable_key: procurement.Organization.name
      - stable_key: party.BusinessRegistration.businessRegistrationNumber
  effects:
    reads: [public_procurement.bid_notice, public_procurement.public_organization, public_procurement.contract]
    produces: [public_procurement.procurement_entity_suggestions]
  inputs:
    query: {data_type: string, required: true}
    types:
      data_type: string
      collection: list
      enum: [bid_notice, organization, company, classification]
    limit: {data_type: integer, default: 8, minimum: 1, maximum: 20}
    cursor: {data_type: string}
  returns: [public_procurement.procurement_entity_suggestions]
