registry:
  version: 1.2.0
  registered_at: "2026-09-22"

capability:
  id: find_bid_relevant_companies
  name: 입찰 관련업체 조회
  description: 입력된 유사 공고의 참여·낙찰·계약 업체만 후보로 선별하고 현재 수요기관 관계와 구조화된 지역 및 업종·면허 적합성을 결합해 반환한다.
  kind: compute
  processor: market_context.find_bid_relevant_companies
  effects:
    reads:
      - public_procurement.bid_notice
      - public_procurement.bid_award
      - public_procurement.bid_opening_participation
      - public_procurement.contract
      - public_procurement.contract_participation
      - public_procurement.procurement_supplier
      - public_procurement.registered_industry
      - public_procurement.public_organization
    produces:
      - public_procurement.bid_relevant_company
  inputs:
    bid_notice_id:
      property: public_procurement.bid_notice.bid_notice_id
      required: true
    similar_bid_notice_ids:
      property: public_procurement.bid_notice.bid_notice_id
      collection: list
      required: true
    limit:
      data_type: integer
      default: 20
      minimum: 1
      maximum: 50
  returns:
    - public_procurement.bid_relevant_company
