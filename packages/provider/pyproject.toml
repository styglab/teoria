[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teoria-provider"
version = "0.1.0"
description = "Shared provider API contracts and HTTP execution for Teoria"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teoria_provider"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
