[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teoria-pipelines"
version = "0.1.0"
description = "Teoria Data Pipelines powered by Prefect"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "minio>=7.2,<8",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5,<7",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "teoria-provider",
]

[dependency-groups]
dev = [
  "prefect>=3,<4",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]
orchestration = [
  "prefect>=3,<4",
]
validation = [
  "teoria-platform",
]

[project.scripts]
teoria-pipelines = "teoria_pipelines.cli:main"

[tool.uv.sources]
teoria-platform = { workspace = true }
teoria-provider = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/teoria_pipelines"]

[tool.pytest.ini_options]
pythonpath = ["src", "../packages/provider/src"]
testpaths = ["tests"]
