apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
  name: image-registry
spec:
  ingressClassName: traefik
  rules:
  - host: registry.teoria.invalid
    http:
      paths:
      - backend:
          service:
            name: image-registry
            port:
              number: 5000
        path: /v2/
        pathType: Prefix
  tls:
  - hosts:
    - registry.teoria.invalid
    secretName: teoria-tls
