schema_version: "1.0"
source_registry_release: "2026.10.06.1"
target_ontology: procurement
classifications:
  BUSINESS_CONCEPT: 지속 가능한 업무 의미로 Ontology v2 승격 대상
  RUNTIME_PROJECTION: Capability 입출력 계약으로 유지
  ASSESSMENT_RESULT: 판단·관찰·근거 결과로 별도 결과 모델 유지
  DEPRECATED: 사용처 제거 후 폐기
objects:
