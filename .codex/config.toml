[mcp_servers.teoria]
  command = "uv"
  args = ["run", "--locked", "--package", "teoria-mcp", "python", ".codex/run-teoria-mcp.py"]
  cwd = "/workspace"
  startup_timeout_sec = 30
  tool_timeout_sec = 150
  required = true

[mcp_servers.teoria.tools.get_business_registration_status]
approval_mode = "approve"

[mcp_servers.teoria.tools.get_company_profile]
approval_mode = "approve"

[mcp_servers.teoria.tools.get_company_financials]
approval_mode = "approve"

[mcp_servers.teoria.tools.get_company_relationships]
approval_mode = "approve"

[mcp_servers.teoria.tools.verify_business_registration]
approval_mode = "approve"

[mcp_servers.teoria.tools.get_public_procurement_contract]
approval_mode = "approve"

[mcp_servers.teoria.tools.search_public_procurement_contracts]
approval_mode = "approve"

[mcp_servers.teoria.tools.get_company_public_procurement_contracts]
approval_mode = "approve"

[mcp_servers.teoria.tools.search_companies_by_name]
approval_mode = "approve"
