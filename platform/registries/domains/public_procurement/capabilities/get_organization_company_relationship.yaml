registry:
  version: 1.0.0
  registered_at: "2026-09-28"

capability:
  id: get_organization_company_relationship
  name: 기관·업체 전체 수주관계
  description: 분야 또는 유사사업 판정으로 사건을 제외하지 않고 특정 기관과 업체 사이의 전체 고유 수주사건을 최근순으로 페이지 조회한다.
  kind: compute
  processor: market_context.get_organization_company_relationship
  effects:
    reads:
      - public_procurement.bid_notice
      - public_procurement.bid_award
      - public_procurement.contract
    produces:
      - public_procurement.organization_company_relationship
  inputs:
    organization_code:
      data_type: string
      required: true
    business_registration_number:
      data_type: business_registration_number
      required: true
    work_type:
      data_type: string
    period_years:
      data_type: integer
      default: 10
      minimum: 1
      maximum: 15
    page:
      data_type: integer
      default: 1
      minimum: 1
    page_size:
      data_type: integer
      default: 20
      minimum: 1
      maximum: 100
  returns:
    - public_procurement.organization_company_relationship
