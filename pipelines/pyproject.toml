[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teoria-pipelines"
version = "0.1.0"
description = "Teoria Data Pipelines powered by Prefect"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "teoria-provider-api",
]

[dependency-groups]
dev = [
  "prefect>=3,<4",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]
orchestration = [
  "prefect>=3,<4",
]
kubernetes-orchestration = [
  "prefect-kubernetes>=0.7,<0.8",
]
metadata-orchestration = [
  "docker>=7,<8",
  "kubernetes>=34,<36",
  "prefect>=3,<4",
]
validation = [
  "teoria-platform",
]
specification-evaluation = [
  "harness2 ; python_version >= '3.12'",
]
etl-example = [
  "great-expectations>=1.8,<2",
  "pandas>=2.1,<3",
]

[project.scripts]
teoria-pipelines = "teoria_pipelines.cli:main"

[tool.uv.sources]
teoria-platform = { workspace = true }
teoria-provider-api = { workspace = true }
harness2 = { git = "https://github.com/google-research/harness2", rev = "1cfe254e8d25b15f37048c3730134686abe60335" }

[tool.hatch.build.targets.wheel]
packages = ["src/teoria_pipelines"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["src", "../packages/provider_api/src"]
testpaths = ["tests"]
