registry:
  version: 1.0.0
  registered_at: "2026-07-22"

data_types:

  - id: business_registration_number
    name: 사업자등록번호
    base_type: string
    pattern: "^[0-9]{10}$"
    normalization:
      - remove_non_digits

  - id: corporate_registration_number
    name: 법인등록번호
    base_type: string
    pattern: "^[0-9]{13}$"
    normalization:
      - remove_non_digits

  - id: date_yyyymmdd
    name: YYYYMMDD 날짜
    base_type: string
    pattern: "^[0-9]{8}$"

  - id: date_yyyy_mm_dd_slash
    name: YYYY/MM/DD 날짜
    base_type: string
    pattern: "^[0-9]{4}/[0-9]{2}/[0-9]{2}$"

  - id: date_yy_mm_dd_slash
    name: YY/MM/DD 날짜
    base_type: string
    pattern: "^[0-9]{2}/[0-9]{2}/[0-9]{2}$"

  - id: year
    name: 연도 형식
    base_type: string
    pattern: "^[0-9]{4}$"

  - id: iso_4217_currency_code
    name: ISO4217 통화코드
    base_type: string
    pattern: "^[A-Z]{3}$"

  - id: financial_supervisory_unique_number
    name: 금융감독원 법인고유번호
    base_type: string
    pattern: "^[0-9]{8}$"

  - id: fiscal_month
    name: 결산월
    base_type: integer

  - id: fiscal_year
    name: 사업연도
    base_type: integer

  - id: monetary_amount
    name: 통화 금액
    base_type: number


