apiVersion: batch/v1
kind: Job
metadata:
  name: runtime-artifact-check
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: runtime-artifact-check
    spec:
      containers:
      - name: runtime-artifact-check
        image: teoria/runtime:release
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env: []
        command:
        - python
        - -c
        - from teoria.registry.artifact import RegistryArtifactStore; b=RegistryArtifactStore('/app/runtime_artifacts').load_active();
          print('Runtime artifact verified:', b.manifest.version)
        volumeMounts:
        - name: runtime-artifacts
          mountPath: /app/runtime_artifacts
          readOnly: true
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
      volumes:
      - name: runtime-artifacts
        persistentVolumeClaim:
          claimName: runtime-artifacts
      restartPolicy: Never
