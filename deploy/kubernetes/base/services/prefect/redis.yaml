apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prefect-redis
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prefect-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-redis
  template:
    metadata:
      labels:
        app: prefect-redis
    spec:
      containers:
      - name: prefect-redis
        image: redis:7-alpine
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env: []
        command:
        - redis-server
        - --appendonly
        - 'yes'
        ports:
        - containerPort: 6379
        readinessProbe:
          exec: &id001
            command:
            - redis-cli
            - ping
          periodSeconds: 5
        startupProbe:
          exec: *id001
          periodSeconds: 5
          failureThreshold: 90
        volumeMounts:
        - name: prefect-redis
          mountPath: /data
          readOnly: false
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
      volumes:
      - name: prefect-redis
        persistentVolumeClaim:
          claimName: prefect-redis
  serviceName: prefect-redis
---
apiVersion: v1
kind: Service
metadata:
  name: prefect-redis
spec:
  selector:
    app: prefect-redis
  ports:
  - port: 6379
    targetPort: 6379
