registry:
  version: 1.1.0
  registered_at: "2026-08-07"

source:
  id: teoria_public_procurement
  name: Teoria 공공조달 데이터
  description: 등록된 수집 Connector에서 정규화한 입찰공고, 참가요건, 공공조달 계약, 업체와 기관 데이터를 Semantic Runtime에 제공하는 PostgreSQL Source
  type: database
  access:
    engine: postgresql
    connection_env: TEORIA_RUNTIME_DATA_DATABASE_URL
  relations:
    - id: procurement_industries
      name: 나라장터 표준업종 사전
      relation: public_procurement.procurement_industries
      primary_key: [industry_code]
      fields:
        - {id: industry_code, name: 업종코드, data_type: string}
        - {id: industry_name, name: 업종명, data_type: string}
        - {id: classification_code, name: 업종분류코드, data_type: string}
        - {id: classification_name, name: 업종분류명, data_type: string}
        - {id: base_law_name, name: 근거법령명, data_type: string}
        - {id: base_law_article, name: 근거법령조항명, data_type: string}
        - {id: base_law_url, name: 근거법령 URL, data_type: string}
        - {id: related_regulation_contents, name: 관련규정내용, data_type: string}
        - {id: included_license_text, name: 포함면허 원문, data_type: string}
        - {id: source_use_yn, name: 원천 업종사용여부, data_type: string}
        - {id: source_registered_at, name: 원천 업종등록일시, data_type: datetime}
        - {id: source_changed_at, name: 원천 업종변경일시, data_type: datetime}
        - {id: first_seen_at, name: 최초 관찰시각, data_type: datetime}
        - {id: last_seen_at, name: 최종 관찰시각, data_type: datetime}
        - {id: is_active, name: 활성 여부, data_type: boolean}
        - {id: missing_snapshot_count, name: 연속 누락 스냅샷 수, data_type: integer}
        - {id: source_record_hash, name: 원천 레코드 해시, data_type: string}
        - {id: updated_at, name: DB 수정일시, data_type: datetime}

    - id: contracts
      name: 조달계약
      relation: public_procurement.contracts
      primary_key: [unified_contract_number]
      fields:
        - {id: unified_contract_number, name: 통합계약번호, data_type: string}
        - {id: contract_type, name: 계약유형, data_type: string}
        - {id: confirmed_contract_number, name: 확정계약번호, data_type: string}
        - {id: contract_reference_number, name: 계약참조번호, data_type: string}
        - {id: contract_name, name: 계약명, data_type: string}
        - {id: is_joint_contract, name: 공동계약 여부, data_type: boolean}
        - {id: long_term_continuation_type, name: 장기계속구분, data_type: string}
        - {id: concluded_date, name: 계약체결일, data_type: date}
        - {id: contract_date, name: 계약일, data_type: date}
        - {id: contract_period_text, name: 계약기간 원문, data_type: string}
        - {id: basis_law_name, name: 근거법률명, data_type: string}
        - {id: total_amount, name: 총계약금액, data_type: number}
        - {id: total_amount_currency, name: 총계약금액 통화, data_type: iso_4217_currency_code}
        - {id: current_contract_amount, name: 금차계약금액, data_type: number}
        - {id: current_contract_amount_currency, name: 금차계약금액 통화, data_type: iso_4217_currency_code}
        - {id: guarantee_deposit_rate, name: 보증금률, data_type: number}
        - {id: payment_method_name, name: 지급구분명, data_type: string}
        - {id: request_number, name: 요청번호, data_type: string}
        - {id: notice_number, name: 공고번호, data_type: string}
        - {id: contract_method_name, name: 계약체결방법명, data_type: string}
        - {id: contracting_organization_code, name: 계약기관코드, data_type: string}
        - {id: contracting_department_name, name: 계약기관 담당부서명, data_type: string}
        - {id: procurement_classification_number, name: 공공조달분류번호, data_type: string}
        - {id: procurement_classification_name, name: 공공조달분류명, data_type: string}
        - {id: contract_information_url, name: 계약정보 URL, data_type: string}
        - {id: contract_detail_url, name: 계약상세정보 URL, data_type: string}
        - {id: source_registered_at, name: 원천 등록일시, data_type: datetime}
        - {id: source_changed_at, name: 원천 변경일시, data_type: datetime}
        - {id: created_at, name: DB 생성일시, data_type: datetime}
        - {id: updated_at, name: DB 수정일시, data_type: datetime}

    - id: contract_suppliers
      name: 계약업체
      relation: public_procurement.contract_suppliers
      primary_key: [unified_contract_number, supplier_sequence]
      fields:
        - {id: unified_contract_number, name: 통합계약번호, data_type: string}
        - {id: supplier_sequence, name: 업체 순번, data_type: integer}
        - {id: supplier_role_name, name: 업체구분명, data_type: string}
        - {id: joint_contract_method_name, name: 공동도급방식구분명, data_type: string}
        - {id: business_registration_number, name: 사업자등록번호, data_type: business_registration_number}
        - {id: supplier_name, name: 업체명, data_type: string}
        - {id: representative_name, name: 대표자명, data_type: string}
        - {id: nationality_name, name: 국적명, data_type: string}
        - {id: participation_share_rate, name: 지분율, data_type: number}
        - {id: creditor_name, name: 채권자명, data_type: string}
        - {id: supplier_manager_name, name: 업체 담당자명, data_type: string}
        - {id: created_at, name: DB 생성일시, data_type: datetime}
        - {id: updated_at, name: DB 수정일시, data_type: datetime}

    - id: public_organizations
      name: 공공기관
      relation: public_procurement.public_organizations
      primary_key: [organization_code]
      fields:
        - {id: organization_code, name: 기관코드, data_type: string}
        - {id: organization_name, name: 기관명, data_type: string}
        - {id: jurisdiction_type, name: 소관구분, data_type: string}
        - {id: created_at, name: DB 생성일시, data_type: datetime}
        - {id: updated_at, name: DB 수정일시, data_type: datetime}

    - id: contract_demand_organizations
      name: 계약 수요기관
      relation: public_procurement.contract_demand_organizations
      primary_key: [unified_contract_number, demand_organization_sequence]
      fields:
        - {id: unified_contract_number, name: 통합계약번호, data_type: string}
        - {id: demand_organization_sequence, name: 수요기관 순번, data_type: integer}
        - {id: organization_code, name: 수요기관코드, data_type: string}
        - {id: department_name, name: 담당부서명, data_type: string}
        - {id: manager_name, name: 담당자명, data_type: string}
        - {id: telephone_number, name: 담당자전화번호, data_type: string}
        - {id: created_at, name: DB 생성일시, data_type: datetime}
        - {id: updated_at, name: DB 수정일시, data_type: datetime}

    - id: bid_notices
      name: 입찰공고
      relation: public_procurement.runtime_bid_notices
      primary_key: [bid_notice_id]
      fields:
        - {id: bid_notice_id, name: 입찰공고 식별자, data_type: string}
        - {id: notice_number, name: 공고번호, data_type: string}
        - {id: notice_order, name: 공고차수, data_type: string}
        - {id: notice_name, name: 공고명, data_type: string}
        - {id: work_type, name: 업무유형, data_type: string}
        - {id: notice_kind_name, name: 공고종류명, data_type: string}
        - {id: is_re_notice, name: 재공고 여부, data_type: boolean}
        - {id: notice_published_at, name: 공고게시시각, data_type: datetime}
        - {id: bid_begin_at, name: 입찰시작시각, data_type: datetime}
        - {id: bid_deadline_at, name: 입찰마감시각, data_type: datetime}
        - {id: opening_at, name: 개찰시각, data_type: datetime}
        - {id: bid_status, name: 입찰상태, data_type: string}
        - {id: notice_organization_code, name: 공고기관코드, data_type: string}
        - {id: notice_organization_name, name: 공고기관명, data_type: string}
        - {id: demand_organization_code, name: 수요기관코드, data_type: string}
        - {id: demand_organization_name, name: 수요기관명, data_type: string}
        - {id: bid_method_name, name: 입찰방식명, data_type: string}
        - {id: contract_method_name, name: 계약방법명, data_type: string}
        - {id: estimated_price, name: 추정가격, data_type: number}
        - {id: allocated_budget, name: 배정예산, data_type: number}
        - {id: detail_url, name: 상세 URL, data_type: string}
        - {id: notice_url, name: 공고문 URL, data_type: string}
        - {id: source_changed_at, name: 원천 변경시각, data_type: datetime}
        - {id: requirement_expression, name: 참가요건 조건식, data_type: string}
        - {id: extraction_completeness, name: 요건추출 완전성, data_type: string}
        - {id: requires_review, name: 검토필요 여부, data_type: boolean}

    - id: bid_requirements
      name: 입찰 참가요건
      relation: public_procurement.runtime_bid_requirements
      primary_key: [requirement_id]
      fields:
        - {id: requirement_id, name: 참가요건 식별자, data_type: string}
        - {id: bid_notice_id, name: 입찰공고 식별자, data_type: string}
        - {id: notice_number, name: 공고번호, data_type: string}
        - {id: notice_order, name: 공고차수, data_type: string}
        - {id: notice_name, name: 공고명, data_type: string}
        - {id: bid_deadline_at, name: 입찰마감시각, data_type: datetime}
        - {id: local_id, name: 추출내 요건 ID, data_type: string}
        - {id: requirement_type, name: 요건유형, data_type: string}
        - {id: operator, name: 비교연산자, data_type: string}
        - {id: value_text, name: 요건값, data_type: string}
        - {id: original_text, name: 요건 원문, data_type: string}
        - {id: proposition_text, name: 원자 요건 원문, data_type: string}
        - {id: proposition_start, name: 원자 요건 시작 위치, data_type: integer}
        - {id: proposition_end, name: 원자 요건 끝 위치, data_type: integer}
        - {id: holder_scope, name: 보유주체 범위, data_type: string}
        - {id: reference_date_type, name: 기준일 유형, data_type: string}
        - {id: mandatory, name: 필수 여부, data_type: boolean}
        - {id: review_status, name: 검토상태, data_type: string}
        - {id: confidence, name: 추출신뢰도, data_type: number}
        - {id: evidence_summary, name: 근거 요약, data_type: string}
        - {id: assessment_stage, name: 판정 단계, data_type: string}
        - {id: failure_effect, name: 불충족 효과, data_type: string}
        - {id: comparison_mode, name: 비교 방식, data_type: string}
        - {id: proof_summary, name: 증빙 요구 요약, data_type: string}
        - {id: standard_rule_id, name: 표준 판정 규칙, data_type: string}
        - {id: standard_rule_version, name: 표준 판정 규칙 버전, data_type: string}
        - {id: rule_arguments_text, name: 판정 규칙 인수, data_type: string}
