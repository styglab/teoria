registry:
  version: 1.0.0
  registered_at: "2026-09-12"
capability:
  id: get_bid_participation_findings
  name: 입찰 참여정보 조회
  description: 공고별 참여 특이사항·수행 의무·경쟁 제한 검토 신호와 원문 근거를 조회한다.
  inputs:
    notice_number:
      property: public_procurement.bid_participation_finding.notice_number
      required: true
    notice_order:
      property: public_procurement.bid_participation_finding.notice_order
      required: true
  steps:
    - call: teoria_public_procurement.bid_participation_findings
    - call: teoria_public_procurement.bid_participation_finding_evidence
  returns:
    - public_procurement.bid_notice
    - public_procurement.bid_participation_finding
    - public_procurement.bid_participation_finding_evidence
    - public_procurement.bid_notice_has_participation_finding
    - public_procurement.bid_participation_finding_supported_by_evidence
