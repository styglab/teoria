apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/teoria
patches:
- target:
    kind: PersistentVolumeClaim
  patch: |-
    - op: add
      path: /spec/storageClassName
      value: teoria-local
- target:
    kind: Ingress
  patch: |-
    - op: add
      path: /spec/ingressClassName
      value: traefik
