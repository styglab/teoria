services:
  opa:
    cpus: 0.5
    mem_limit: 256m
    image: ${TEORIA_IMAGE_PREFIX:-}teoria-opa:${TEORIA_IMAGE_TAG:-1.21.1}
    build:
      context: ../..
      dockerfile: deploy/compose/opa/Dockerfile
      target: runtime
      labels:
        io.teoria.project: teoria
        io.teoria.role: runtime
    restart: unless-stopped
    command:
    - run
    - --server
    - --addr=0.0.0.0:8181
    - --log-format=json
    - --config-file=/config/opa_config.yaml
    - --set-file=keys.teoria.key=/keys/public.pem
    environment:
      TEORIA_ENVIRONMENT: production
      TEORIA_OPA_CONTROL_PLANE_TOKEN: ${TEORIA_OPA_CONTROL_PLANE_TOKEN:?set TEORIA_OPA_CONTROL_PLANE_TOKEN}
    volumes:
    - opa-signing-keys:/keys:ro
    - opa-state:/var/lib/opa
    depends_on:
      policy-control-plane:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8181/health?bundles=true&plugins=true
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '8181'
  policy-control-plane:
    cpus: 0.5
    mem_limit: 256m
    image: ${TEORIA_IMAGE_PREFIX:-}teoria-platform-authoring:${TEORIA_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: authoring
      labels:
        io.teoria.project: teoria
        io.teoria.role: authoring
    restart: unless-stopped
    command:
    - teoria-policy-control-plane
    environment:
      TEORIA_ENVIRONMENT: production
      TEORIA_APP_DATABASE_URL: postgresql://teoria_app:${TEORIA_LOCAL_APP_DB_PASSWORD:-teoria_local_app}@platform-postgres:5432/teoria_app
      TEORIA_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_DATABASE_CONCURRENCY_LIMIT:-10}
      TEORIA_OPA_CONTROL_PLANE_TOKEN: ${TEORIA_OPA_CONTROL_PLANE_TOKEN:?set TEORIA_OPA_CONTROL_PLANE_TOKEN}
      TEORIA_OPA_BUNDLE_PATH: /var/lib/teoria/opa/teoria.tar.gz
    volumes:
    - opa-bundles:/var/lib/teoria/opa:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8002/health')
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '8002'
  opa-bundle-build:
    cpus: 0.5
    mem_limit: 256m
    image: ${TEORIA_IMAGE_PREFIX:-}teoria-opa-bundle-builder:${TEORIA_IMAGE_TAG:-1.21.1}
    build:
      context: ../..
      dockerfile: deploy/compose/opa/Dockerfile
      target: bundle_builder
      labels:
        io.teoria.project: teoria
        io.teoria.role: bundle_builder
    restart: 'no'
    environment:
      TEORIA_OPA_BUNDLE_REVISION: ${TEORIA_OPA_BUNDLE_REVISION:-development}
    volumes:
    - opa-signing-keys:/keys
    - opa-bundles:/bundle
    profiles:
    - jobs
  admin-api:
    environment:
      TEORIA_POLICY_MODE: opa
    depends_on:
      opa:
        condition: service_healthy
