apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: image-registry
  template:
    metadata:
      labels:
        app: image-registry
    spec:
      automountServiceAccountToken: false
      containers:
      - name: registry
        image: registry:3.1.2
        ports:
        - containerPort: 5000
        env:
        - name: OTEL_TRACES_EXPORTER
          value: none
        - name: REGISTRY_HTTP_ADDR
          value: 0.0.0.0:5000
        - name: REGISTRY_HTTP_RELATIVEURLS
          value: 'true'
        - name: REGISTRY_LOG_LEVEL
          value: warn
        - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
          value: /var/lib/registry
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: 'false'
        - name: REGISTRY_AUTH
          value: htpasswd
        - name: REGISTRY_AUTH_HTPASSWD_REALM
          value: Teoria images
        - name: REGISTRY_AUTH_HTPASSWD_PATH
          value: /run/model-registry-auth/htpasswd
        - name: REGISTRY_HTTP_SECRET
          valueFrom:
            secretKeyRef:
              name: model-registry-auth
              key: http_secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 3
        livenessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 10
        volumeMounts:
        - name: images
          mountPath: /var/lib/registry
        - name: auth
          mountPath: /run/model-registry-auth
          readOnly: true
      volumes:
      - name: images
        persistentVolumeClaim:
          claimName: registry-data
      - name: auth
        secret:
          secretName: model-registry-auth
---
apiVersion: v1
kind: Service
metadata:
  name: image-registry
spec:
  selector:
    app: image-registry
  ports:
  - port: 5000
    targetPort: 5000
