apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-server
  template:
    metadata:
      labels:
        app: prefect-server
    spec:
      containers:
      - name: prefect-server
        image: prefecthq/prefect:3.8.1-python3.12
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env:
        - name: PREFECT_MESSAGING_BROKER
          value: prefect_redis.messaging
        - name: PREFECT_MESSAGING_CACHE
          value: prefect_redis.messaging
        - name: PREFECT_REDIS_MESSAGING_HOST
          value: prefect-redis
        - name: PREFECT_REDIS_MESSAGING_PORT
          value: '6379'
        - name: PREFECT_REDIS_MESSAGING_DB
          value: '0'
        - name: PREFECT_SERVER_DOCKET_URL
          value: redis://prefect-redis:6379/1
        - name: PREFECT_SERVER_UI_API_URL
          value: /prefect/api
        - name: PREFECT_SERVER_UI_SERVE_BASE
          value: /prefect
        - name: PREFECT_API_DATABASE_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: PREFECT_API_DATABASE_CONNECTION_URL
        - name: PREFECT_SERVER_API_AUTH_STRING
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: PREFECT_API_AUTH_STRING
        command:
        - prefect
        - server
        - start
        - --host
        - 0.0.0.0
        - --no-services
        ports:
        - containerPort: 4200
        readinessProbe:
          httpGet: &id001
            path: /api/health
            port: 4200
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: prefect-server
spec:
  selector:
    app: prefect-server
  ports:
  - port: 4200
    targetPort: 4200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-services
  template:
    metadata:
      labels:
        app: prefect-services
    spec:
      containers:
      - name: prefect-services
        image: prefecthq/prefect:3.8.1-python3.12
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env:
        - name: PREFECT_MESSAGING_BROKER
          value: prefect_redis.messaging
        - name: PREFECT_MESSAGING_CACHE
          value: prefect_redis.messaging
        - name: PREFECT_REDIS_MESSAGING_HOST
          value: prefect-redis
        - name: PREFECT_REDIS_MESSAGING_PORT
          value: '6379'
        - name: PREFECT_REDIS_MESSAGING_DB
          value: '0'
        - name: PREFECT_SERVER_DOCKET_URL
          value: redis://prefect-redis:6379/1
        - name: PREFECT_API_DATABASE_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: PREFECT_API_DATABASE_CONNECTION_URL
        command:
        - prefect
        - server
        - services
        - start
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
  strategy:
    type: Recreate
