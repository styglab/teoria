items:
  - id: module_capacity
    label: 모듈당 메모리 용량
    evidence: {id: memory_clause, locator: 'Sheet1!C2, 메모리(RAM)', quote: 'DDR5 32GB 5600 RDIMM  x 2개'}
    recorded_observation: {subject_id: a02, semantic_role: requirement_candidate, semantic_scope: per_module, value_raw: '32', unit_raw: GB}
    source_evidence: {node_id: n00012, fragment_id: n00012_f04, native_ref: /blocks/1/table/cells/1/2}
    source_observation_id: sample_09_c00_a008
    candidate:
      owner_type: goods.memory_module
      property: goods.memory_module.capacity
      value: '32'
      unit: GB
      operator: eq
      role: requirement
      scope: per_module
    proposed_changes: [meaning_link]
    review_question: 32GB가 서버 합계·GPU 메모리가 아닌 공급 메모리 모듈 하나의 용량인가?
    application_status: requires_published_concept_expression_link_and_profile_approval
  - id: supplied_module_count
    label: 공급 메모리 모듈 수
    evidence: {id: memory_clause, locator: 'Sheet1!C2, 메모리(RAM)', quote: 'DDR5 32GB 5600 RDIMM  x 2개'}
    recorded_observation: {subject_id: a02, property_key: quantity, semantic_role: requirement_candidate, semantic_scope: system_total, value_raw: '2', unit_raw: 개}
    source_observation_id: sample_09_c00_a011
    source_evidence: {node_id: n00012, fragment_id: n00012_f04, native_ref: /blocks/1/table/cells/1/2}
    recorded_component_relation: {id: rel_002, kind: component_of, source_id: a02, target_id: root, basis: explicit, review_status: needs_review}
    recorded_delivery_status: not_established
    declared_composition_quantity: absent
    candidate:
      kind: composition_quantity
      parent_type: goods.server
      child_type: goods.memory_module
      model: goods.composition_statement
      quantity_property: goods.composition_statement.quantity_value
      value: '2'
      unit: 개
      operator: eq
      scope: 서버 구성의 공급 모듈 수
      evidence_basis: interpreted
    proposed_changes: [review_supply_interpretation, project_attribute_as_composition_quantity]
    review_question: x 2개가 이 서버 구성에 공급할 메모리 모듈 수이며 슬롯 수나 물리 자산 식별이 아닌가?
    application_status: requires_published_profile_and_composition_approval
    note: >-
      수량은 메모리의 일반 속성에 저장돼 있고 declared_quantities에는 서버 1EA만 있다.
      a02의 납품 상태는 not_established이며 rel_002도 needs_review다. 공급 구성 수량으로 승인된 상태가 아니다.
      수량 근거의 value_raw spans에는 32GB의 2와 x 2개의 2가 함께 잡혀 있다. 원문 x 2개를 직접 대조했으며 저장 span을 독립 정답으로 쓰지 않는다.
      기존 review-meanings 자료는 이 수량을 검토하지 않았다.
  - id: socket_capacity_limit
    label: CPU 소켓당 메모리 지원 상한
    evidence: {id: socket_limit, locator: 'Sheet1!C2, 메모리(RAM), 최대 용량', quote: '최대 용량: CPU 소켓당 최대 3TB 지원'}
    recorded_observation: {subject_id: root, semantic_scope: support_limit, semantic_role: supported_capability, value_raw: '3', unit_raw: TB}
    source_observation_id: sample_09_c00_a017
    source_evidence: {node_id: n00012, fragment_id: n00012_f06, native_ref: /blocks/1/table/cells/1/2}
    candidate:
      owner_type: goods.server
      property: goods.server.memory_capacity_per_socket_limit
      value: '3'
      unit: TB
      operator: lte
      role: supported_capability
      scope: per_socket
    proposed_changes: [meaning_link, semantic_scope]
    review_question: 공급 용량이 아니라 CPU 소켓 하나당 지원 상한을 뜻하는가?
    application_status: requires_document_interpretation_approval
    note: 원래 support_limit을 변경하지 않는다. per_socket은 별도 검토할 해석이며 현재 프로파일에 자동 맞추지 않는다.
  - id: system_memory_slot_count
    label: 서버 전체 메모리 슬롯 수
    evidence: {id: memory_slots, locator: 'Sheet1!C2, 메모리(RAM), 총 슬롯 수', quote: '총 슬롯 수 : 32 개 DIMM 슬롯 (CPU당 16 DIMM, 2DPC), 최대 6400MHz DDR5 지원'}
    recorded_observation: {subject_id: a03, subject_name: DIMM 슬롯, semantic_role: requirement_candidate, semantic_scope: system_total, value_raw: '32', unit_raw: 개}
    source_observation_id: sample_09_c00_a012
    source_evidence: {node_id: n00012, fragment_id: n00012_f05, native_ref: /blocks/1/table/cells/1/2}
    candidate:
      owner_type: goods.server
      owner_subject_id: root
      property: goods.server.memory_slot_count
      value: '32'
      unit: 개
      operator: eq
      role: requirement
      scope: system_total
    proposed_changes: [meaning_link, subject_ids]
    review_question: 32개가 공급 모듈 수가 아니라 서버 전체 DIMM 슬롯 수인가?
    application_status: requires_document_interpretation_approval
    note: 원래 a03 귀속은 유지한다. 서버 root로의 귀속은 별도 승인된 해석이 필요하다.
blocked_until:
  - 현재 Draft의 ID·내용 checksum·게시 여부와 실제 분류 범위를 다시 조회한다.
  - 재확인한 네 관찰의 소유 대상·역할·scope·공급 여부에 대한 검토 주체의 판정을 기록한다.
  - 의미가 승인된 Ontology를 게시하고 표현 연결과 대상 분류에 맞는 프로파일을 승인한다.
  - 문서별 해석 API에서 scope·소유 대상 제안을 검토·승인하고 별도 산출물로 적용한다.
  - 공급 수량의 포함 조건·범위를 승인하고 새 Runtime view의 구성 수량을 대조한다.
constraints:
  - 32GB × 2를 원문에 명시된 전체 64GB로 생성하지 않는다.
  - 공급 수량·전체 슬롯 수·소켓당 지원 상한을 같은 속성으로 연결하지 않는다.
  - 현재 profile_template의 classification_code=null을 실제 문서에 그대로 적용하지 않는다. 실제 분류와 적용 범위를 먼저 확인한다.
  - 이 준비 자료나 과거 requires_review 결과를 승인된 연결·정답·Runtime 입력으로 사용하지 않는다.
