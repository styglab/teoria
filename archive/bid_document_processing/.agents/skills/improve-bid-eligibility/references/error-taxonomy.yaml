version: 1
layers:
  - id: acquisition
    examples: [missing_url, download_failed, size_limit, stale_document_state]
    fix_area: [pipelines/src/teoria_pipelines/tasks/pps_bid_notices.py, pipelines/src/teoria_pipelines/persistence/postgres.py]
  - id: parsing
    examples: [missing_text, broken_table, archive_member_lost, wrong_page_or_block]
    fix_area: [pipelines/src/teoria_pipelines/document_parsers.py]
  - id: selection
    examples: [relevant_block_omitted, wrong_document_deduplicated, input_budget_starvation]
    fix_area: [pipelines/src/teoria_pipelines/bid_document_selection.py]
  - id: extraction
    examples: [mandatory_gate_missed, unsupported_fact, proof_as_condition, wrong_atomic_split]
    fix_area: [.agents/skills/extract-bid-eligibility]
  - id: normalization
    examples: [wrong_type, wrong_scope, wrong_stage, wrong_value, duplicate_fact]
    fix_area: [pipelines/src/teoria_pipelines/tasks/bid_eligibility.py, .agents/skills/extract-bid-eligibility/references]
  - id: expression
    examples: [wrong_all_any, wrong_branch, missing_placement, duplicate_path]
    fix_area: [pipelines/src/teoria_pipelines/tasks/bid_eligibility.py]
  - id: persistence
    examples: [wrong_fingerprint, stale_result_selected, retry_or_version_not_applied]
    fix_area: [pipelines/src/teoria_pipelines/persistence/postgres.py, pipelines/src/teoria_pipelines/tasks/bid_eligibility.py]
severities:
  critical: eligibility result can be incorrectly allowed or denied
  major: structured assessment meaning is materially wrong
  minor: result-preserving metadata or canonicalization defect
