  assessment.requirement_assessment: {classification: ASSESSMENT_RESULT, migration_status: retain, rationale: 개별 요건 판단 결과}
  assessment.evidence: {classification: ASSESSMENT_RESULT, migration_status: retain, rationale: 평가 판단의 근거 기록}
  company.legal_entity: {classification: BUSINESS_CONCEPT, migration_status: mapped, target_stable_key: company.LegalEntity, rationale: 법적 실체의 지속 가능한 의미}
  company.postal_address: {classification: BUSINESS_CONCEPT, migration_status: mapped, target_stable_key: company.PostalAddress, rationale: 주소 값 객체}
