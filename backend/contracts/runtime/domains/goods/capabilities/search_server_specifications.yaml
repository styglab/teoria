registry:
  version: 1.0.0
  registered_at: '2026-10-26'
capability:
  id: search_server_specifications
  name: 서버 메모리 요구조건 검색
  description: 메모리 요구값이 기준 이상인 서버 관찰을 검색한다. 기본값은 납품 요구·시스템 전체·GB이다. 지원 한계와 기보유 사양을
    구분하며 실제 장착량이나 제품 충족 판정으로 확대하지 않는다.
  version: 1.0.0
  exposure: public
  returns:
  - server_specifications.requirement_observation
  semantic_requirements:
    concepts:
    - stable_key: computer_server.server
    - stable_key: computer_server.memory
    properties:
    - stable_key: computer_server.server.memory_capacity
    - stable_key: computer_server.memory.capacity
    relationships:
    - stable_key: computer_server.has_memory
  kind: query
  inputs:
    memory_min:
      data_type: number
      field: specification_observations.server_requirements.value_decimal
      required: true
      minimum: 0
      operator: gte
    role:
      data_type: string
      field: specification_observations.server_requirements.role
      required: false
      enum:
      - requirement_candidate
      - supported_capability
      - existing_reference
      - recommended
      - optional
      default: requirement_candidate
    scope:
      data_type: string
      field: specification_observations.server_requirements.semantic_scope
      required: false
      enum:
      - system_total
      - per_module
      - per_component
      - support_limit
      default: system_total
    unit:
      data_type: string
      field: specification_observations.server_requirements.unit
      required: false
      enum:
      - GB
      - GiB
      default: GB
    snapshot_id:
      data_type: string
      field: specification_observations.server_requirements.snapshot_id
      required: false
    page:
      data_type: integer
      default: 1
      minimum: 1
    page_size:
      data_type: integer
      default: 20
      minimum: 1
      maximum: 100
    operators:
      data_type: string
      field: specification_observations.server_requirements.operator
      operator: in
      collection: list
      default:
      - eq
      - gte
      - gt
      enum:
      - eq
      - gte
      - gt
    property_keys:
      data_type: string
      field: specification_observations.server_requirements.property_stable_key
      operator: in
      collection: list
      default:
      - computer_server.server.memory_capacity
      - computer_server.memory.capacity
      enum:
      - computer_server.server.memory_capacity
      - computer_server.memory.capacity
  steps:
  - call: specification_observations.server_requirements
    database_query:
      pagination:
        page_input: page
        page_size_input: page_size
        root_field: observation_id
        count_distinct: false
