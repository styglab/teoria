apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-control-plane
  template:
    metadata:
      labels:
        app: policy-control-plane
    spec:
      containers:
      - name: policy-control-plane
        image: teoria/authoring:release
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env:
        - name: TEORIA_ENVIRONMENT
          value: production
        - name: TEORIA_OPA_BUNDLE_PATH
          value: /var/lib/teoria/opa/teoria.tar.gz
        - name: TEORIA_APP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_APP_DATABASE_URL
        - name: TEORIA_OPA_CONTROL_PLANE_TOKEN
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_OPA_CONTROL_PLANE_TOKEN
        command:
        - teoria-policy-control-plane
        ports:
        - containerPort: 8002
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        volumeMounts:
        - name: opa-bundles
          mountPath: /var/lib/teoria/opa
          readOnly: true
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
      volumes:
      - name: opa-bundles
        persistentVolumeClaim:
          claimName: opa-bundles
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: policy-control-plane
spec:
  selector:
    app: policy-control-plane
  ports:
  - port: 8002
    targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
      - name: opa
        image: teoria/opa:release
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
            cpu: '1'
        env:
        - name: TEORIA_ENVIRONMENT
          value: production
        - name: TEORIA_OPA_CONTROL_PLANE_TOKEN
          valueFrom:
            secretKeyRef:
              name: teoria-secrets
              key: TEORIA_OPA_CONTROL_PLANE_TOKEN
        ports:
        - containerPort: 8181
        readinessProbe:
          httpGet: &id001
            path: /health?bundles=true&plugins=true
            port: 8181
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        volumeMounts:
        - name: opa-signing-keys
          mountPath: /keys
          readOnly: true
        - name: opa-state
          mountPath: /var/lib/opa
          readOnly: false
        args:
        - run
        - --server
        - --addr=0.0.0.0:8181
        - --log-format=json
        - --config-file=/config/opa_config.yaml
        - --set-file=keys.teoria.key=/keys/public.pem
      imagePullSecrets:
      - name: teoria-registry
      automountServiceAccountToken: false
      volumes:
      - name: opa-signing-keys
        persistentVolumeClaim:
          claimName: opa-signing-keys
      - name: opa-state
        persistentVolumeClaim:
          claimName: opa-state
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: opa
spec:
  selector:
    app: opa
  ports:
  - port: 8181
    targetPort: 8181
