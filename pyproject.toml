[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teoria"
version = "0.1.0"
description = "Semantic registry and execution platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.27,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
teoria = "teoria.adapters.cli.main:main"
teoria-mcp = "teoria.adapters.mcp.stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teoria"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
