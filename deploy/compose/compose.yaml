# Service modules are composed by deploy.sh; jobs run explicitly with --rm.
name: teoria
services:
  nginx:
    cpus: 0.5
    mem_limit: 128m
    image: teoria-nginx:latest
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: '1'
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      target: gateway
      labels:
        io.teoria.project: teoria
        io.teoria.role: gateway
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost/health
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
    - ${TEORIA_HTTP_PORT:-8081}:80
  admin-api:
    cpus: 1
    mem_limit: 512m
    image: ${TEORIA_ADMIN_API_IMAGE:-teoria-platform-admin:latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: admin
      labels:
        io.teoria.project: teoria
        io.teoria.role: admin
    restart: unless-stopped
    command:
    - teoria-admin-api
    environment:
      TEORIA_ENVIRONMENT: production
      TEORIA_REGISTRY_PATH: /app/backend/contracts/runtime
      TEORIA_ADMIN_API_ROOT_PATH: /admin-api
      TEORIA_ADMIN_AUTH_MODE: bearer
      TEORIA_ADMIN_METADATA_PUBLIC_READ: ${TEORIA_ADMIN_METADATA_PUBLIC_READ:-false}
      TEORIA_ADMIN_API_TOKEN: ${TEORIA_ADMIN_API_TOKEN:?set TEORIA_ADMIN_API_TOKEN}
      TEORIA_ADMIN_API_ACTOR: ${TEORIA_ADMIN_API_ACTOR:-system:admin}
      TEORIA_ADMIN_API_ROLES: ${TEORIA_ADMIN_API_ROLES:-metadata_admin,metadata_reviewer,binding_reviewer,ontology_owner}
      TEORIA_ADMIN_DATA_DATABASE_URL: ${TEORIA_RUNTIME_DATA_DATABASE_URL:-postgresql://teoria_runtime:${TEORIA_LOCAL_RUNTIME_DB_PASSWORD:?set TEORIA_LOCAL_RUNTIME_DB_PASSWORD}@postgres:5432/teoria_data}
      TEORIA_APP_DATABASE_URL: postgresql://teoria_app:${TEORIA_LOCAL_APP_DB_PASSWORD:-teoria_local_app}@platform-postgres:5432/teoria_app
      TEORIA_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_DATABASE_CONCURRENCY_LIMIT:-10}
      TEORIA_POLICY_MODE: opa
      TEORIA_OPA_URL: http://opa:8181
      TEORIA_OPA_DECISION_PATH: teoria/authz/decision
      TEORIA_SEMANTIC_MODELING_ENABLED: 'false'
      TEORIA_FORMATID_ENABLED: 'false'
      TEORIA_LEGAL_INFORMATION_ENABLED: 'false'
      TEORIA_MODEL_OPERATIONS_ENABLED: 'false'
      TEORIA_OPENMETADATA_ENABLED: 'false'
      TEORIA_SPECIFICATION_UPLOAD_ENABLED: 'false'
      TEORIA_MODEL_PREFECT_AUTH: ${TEORIA_PREFECT_USERNAME:?set TEORIA_PREFECT_USERNAME}:${TEORIA_PREFECT_PASSWORD:?set TEORIA_PREFECT_PASSWORD}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/health')
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '8001'
    depends_on:
      opa:
        condition: service_healthy
  postgres:
    stop_grace_period: 60s
    cpus: 2
    mem_limit: 4g
    image: postgres:17
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_DB: teoria_data
      POSTGRES_USER: teoria_pipeline
      POSTGRES_PASSWORD: ${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U teoria_pipeline -d teoria_data
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '5432'
    volumes:
    - postgres:/var/lib/postgresql/data
  platform-postgres:
    stop_grace_period: 60s
    cpus: 2
    mem_limit: 2g
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${TEORIA_LOCAL_PLATFORM_DB_PASSWORD:-platform_local}
      TEORIA_LOCAL_APP_DB_PASSWORD: ${TEORIA_LOCAL_APP_DB_PASSWORD:-teoria_local_app}
      TEORIA_LOCAL_PREFECT_DB_PASSWORD: ${TEORIA_LOCAL_PREFECT_DB_PASSWORD:-prefect_local}
      OPENMETADATA_DB_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-openmetadata_local}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U platform_admin -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '5432'
    volumes:
    - platform-postgres:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    cpus: 1
    mem_limit: 1g
    restart: unless-stopped
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: ${TEORIA_MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${TEORIA_MINIO_ROOT_PASSWORD:-}
      MINIO_BROWSER_REDIRECT_URL: ${TEORIA_MINIO_BROWSER_REDIRECT_URL:-http://localhost:${TEORIA_HTTP_PORT:-8081}/minio/}
    volumes:
    - model-objects:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
  prefect-redis:
    cpus: 0.25
    mem_limit: 256m
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - 128mb
    - --maxmemory-policy
    - noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
    - prefect-redis:/data
  prefect-server:
    cpus: 1
    mem_limit: 1g
    image: prefecthq/prefect:3-python3.12
    restart: unless-stopped
    command:
    - prefect
    - server
    - start
    - --host
    - 0.0.0.0
    - --no-services
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${TEORIA_LOCAL_PREFECT_DB_PASSWORD:-prefect_local}@platform-postgres:5432/prefect
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: prefect-redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
      PREFECT_SERVER_DOCKET_URL: redis://prefect-redis:6379/1
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: /prefect/api
      PREFECT_SERVER_UI_SERVE_BASE: /prefect
      PREFECT_SERVER_API_AUTH_STRING: ${TEORIA_PREFECT_USERNAME:?set TEORIA_PREFECT_USERNAME}:${TEORIA_PREFECT_PASSWORD:?set TEORIA_PREFECT_PASSWORD}
    depends_on:
      prefect-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')
      interval: 5s
      timeout: 5s
      retries: 30
    expose:
    - '4200'
  prefect-services:
    cpus: 1
    mem_limit: 1g
    image: prefecthq/prefect:3-python3.12
    restart: unless-stopped
    command:
    - prefect
    - server
    - services
    - start
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${TEORIA_LOCAL_PREFECT_DB_PASSWORD:-prefect_local}@platform-postgres:5432/prefect
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: prefect-redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
      PREFECT_SERVER_DOCKET_URL: redis://prefect-redis:6379/1
    depends_on:
      prefect-redis:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
  opa:
    cpus: 0.5
    mem_limit: 256m
    image: teoria-opa:1.21.1
    build:
      context: ../..
      dockerfile: deploy/compose/opa/Dockerfile
      target: runtime
      labels:
        io.teoria.project: teoria
        io.teoria.role: runtime
    restart: unless-stopped
    command:
    - run
    - --server
    - --addr=0.0.0.0:8181
    - --log-format=json
    - --config-file=/config/opa_config.yaml
    - --set-file=keys.teoria.key=/keys/public.pem
    environment:
      TEORIA_ENVIRONMENT: production
      TEORIA_OPA_CONTROL_PLANE_TOKEN: ${TEORIA_OPA_CONTROL_PLANE_TOKEN:?set TEORIA_OPA_CONTROL_PLANE_TOKEN}
    volumes:
    - opa-signing-keys:/keys:ro
    - opa-state:/var/lib/opa
    depends_on:
      policy-control-plane:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:8181/health?bundles=true&plugins=true
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '8181'
  policy-control-plane:
    cpus: 0.5
    mem_limit: 256m
    image: teoria-platform-authoring:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: authoring
      labels:
        io.teoria.project: teoria
        io.teoria.role: authoring
    restart: unless-stopped
    command:
    - teoria-policy-control-plane
    environment:
      TEORIA_ENVIRONMENT: production
      TEORIA_APP_DATABASE_URL: postgresql://teoria_app:${TEORIA_LOCAL_APP_DB_PASSWORD:-teoria_local_app}@platform-postgres:5432/teoria_app
      TEORIA_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_DATABASE_CONCURRENCY_LIMIT:-10}
      TEORIA_OPA_CONTROL_PLANE_TOKEN: ${TEORIA_OPA_CONTROL_PLANE_TOKEN:?set TEORIA_OPA_CONTROL_PLANE_TOKEN}
      TEORIA_OPA_BUNDLE_PATH: /var/lib/teoria/opa/teoria.tar.gz
    volumes:
    - opa-bundles:/var/lib/teoria/opa:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8002/health')
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '8002'
  postgres-init:
    cpus: 0.5
    mem_limit: 256m
    image: postgres:17
    command:
    - sh
    - -ec
    - |
      psql --set=ON_ERROR_STOP=1 \
        --set=runtime_password="$${TEORIA_LOCAL_RUNTIME_DB_PASSWORD}" \
        --set=metadata_password="$${TEORIA_METADATA_DB_PASSWORD}" <<'SQL'
      SELECT format('CREATE ROLE teoria_runtime LOGIN PASSWORD %L', :'runtime_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'teoria_runtime')
      \gexec
      ALTER ROLE teoria_runtime PASSWORD :'runtime_password';
      ALTER ROLE teoria_runtime SET statement_timeout = '30s';
      SELECT format('CREATE ROLE teoria_metadata LOGIN PASSWORD %L', :'metadata_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'teoria_metadata')
      \gexec
      ALTER ROLE teoria_metadata PASSWORD :'metadata_password';
      ALTER ROLE teoria_metadata SET statement_timeout = '60s';
      GRANT CONNECT ON DATABASE teoria_data TO teoria_metadata;
      SQL
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: teoria_data
      PGUSER: teoria_pipeline
      PGPASSWORD: ${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}
      TEORIA_LOCAL_RUNTIME_DB_PASSWORD: ${TEORIA_LOCAL_RUNTIME_DB_PASSWORD:?set TEORIA_LOCAL_RUNTIME_DB_PASSWORD}
      TEORIA_METADATA_DB_PASSWORD: ${TEORIA_METADATA_DB_PASSWORD:-teoria_local_metadata}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
    - jobs
  platform-postgres-init:
    cpus: 0.5
    mem_limit: 256m
    image: postgres:17
    restart: 'no'
    command:
    - sh
    - -ec
    - |
      psql --set=ON_ERROR_STOP=1 \
        --set=teoria_app_password="$${TEORIA_LOCAL_APP_DB_PASSWORD}" \
        --set=prefect_password="$${TEORIA_LOCAL_PREFECT_DB_PASSWORD}" \
        --set=openmetadata_password="$${OPENMETADATA_DB_PASSWORD}" <<'SQL'
      SELECT format('CREATE ROLE teoria_app LOGIN PASSWORD %L', :'teoria_app_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'teoria_app')
      \gexec
      ALTER ROLE teoria_app PASSWORD :'teoria_app_password';
      SELECT format('CREATE ROLE prefect LOGIN PASSWORD %L', :'prefect_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'prefect')
      \gexec
      ALTER ROLE prefect PASSWORD :'prefect_password';
      SELECT format('CREATE ROLE openmetadata_user LOGIN PASSWORD %L', :'openmetadata_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openmetadata_user')
      \gexec
      ALTER ROLE openmetadata_user PASSWORD :'openmetadata_password';
      SELECT 'CREATE DATABASE teoria_app OWNER teoria_app'
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'teoria_app')
      \gexec
      SELECT 'CREATE DATABASE prefect OWNER prefect'
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'prefect')
      \gexec
      SELECT 'CREATE DATABASE openmetadata_db OWNER openmetadata_user'
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'openmetadata_db')
      \gexec
      REVOKE CONNECT ON DATABASE teoria_app FROM PUBLIC;
      GRANT CONNECT ON DATABASE teoria_app TO teoria_app, platform_admin;
      REVOKE CONNECT ON DATABASE prefect FROM PUBLIC;
      GRANT CONNECT ON DATABASE prefect TO prefect, platform_admin;
      REVOKE CONNECT ON DATABASE openmetadata_db FROM PUBLIC;
      GRANT CONNECT ON DATABASE openmetadata_db TO openmetadata_user, platform_admin;
      SQL
    environment:
      PGHOST: platform-postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: platform_admin
      PGPASSWORD: ${TEORIA_LOCAL_PLATFORM_DB_PASSWORD:-platform_local}
      TEORIA_LOCAL_APP_DB_PASSWORD: ${TEORIA_LOCAL_APP_DB_PASSWORD:-teoria_local_app}
      TEORIA_LOCAL_PREFECT_DB_PASSWORD: ${TEORIA_LOCAL_PREFECT_DB_PASSWORD:-prefect_local}
      OPENMETADATA_DB_PASSWORD: ${OPENMETADATA_DB_PASSWORD:-openmetadata_local}
    depends_on:
      platform-postgres:
        condition: service_healthy
    profiles:
    - jobs
  postgres-migrate:
    image: teoria-data-operations:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: operations
      labels:
        io.teoria.project: teoria
        io.teoria.role: operations
    cpus: 1
    mem_limit: 512m
    command:
    - teoria-pipelines
    - migrate
    - --migrations
    - /app/backend/migrations/data
    environment:
      TEORIA_PIPELINE_DATA_DATABASE_URL: ${TEORIA_PIPELINE_DATA_DATABASE_URL:-postgresql://teoria_pipeline:${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}@postgres:5432/teoria_data}
      TEORIA_PIPELINE_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_PIPELINE_DATABASE_CONCURRENCY_LIMIT:-10}
    profiles:
    - jobs
  app-postgres-migrate:
    cpus: 1
    mem_limit: 512m
    image: teoria-platform-admin:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: admin
      labels:
        io.teoria.project: teoria
        io.teoria.role: admin
    command:
    - teoria
    - migrate-app
    - --migrations
    - /app/backend/migrations/application
    environment:
      TEORIA_APP_DATABASE_URL: postgresql://teoria_app:${TEORIA_LOCAL_APP_DB_PASSWORD:-teoria_local_app}@platform-postgres:5432/teoria_app
      TEORIA_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_DATABASE_CONCURRENCY_LIMIT:-10}
    profiles:
    - jobs
  opa-bundle-build:
    cpus: 0.5
    mem_limit: 256m
    image: teoria-opa-bundle-builder:1.21.1
    build:
      context: ../..
      dockerfile: deploy/compose/opa/Dockerfile
      target: bundle_builder
      labels:
        io.teoria.project: teoria
        io.teoria.role: bundle_builder
    restart: 'no'
    environment:
      TEORIA_OPA_BUNDLE_REVISION: ${TEORIA_OPA_BUNDLE_REVISION:-development}
    volumes:
    - opa-signing-keys:/keys
    - opa-bundles:/bundle
    profiles:
    - jobs
  platform-check:
    cpus: 0.5
    mem_limit: 512m
    image: teoria-platform-authoring:latest
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: authoring
      labels:
        io.teoria.project: teoria
        io.teoria.role: authoring
    command:
    - teoria
    - validate
    - /app/backend/contracts/runtime
    volumes:
    - ../../backend/contracts/runtime:/app/backend/contracts/runtime:ro
    - ../../backend/references:/app/backend/references:ro
    profiles:
    - jobs
  pipelines-check:
    cpus: 0.5
    mem_limit: 512m
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: check
      labels:
        io.teoria.project: teoria
        io.teoria.role: check
    command:
    - teoria-pipelines
    - validate-integration
    - /app/backend
    - --platform-registries
    - /app/backend/contracts/runtime
    volumes:
    - ../../backend/contracts/ingestion/connectors:/app/backend/contracts/ingestion/connectors:ro
    - ../../backend/contracts/ingestion/pipelines:/app/backend/contracts/ingestion/pipelines:ro
    - ./prefect:/app/deploy/compose/prefect:ro
    - ../k3s/prefect:/app/deploy/k3s/prefect:ro
    - ../../backend/config:/app/backend/config:ro
    - ../../backend/verification_cases:/app/backend/verification_cases:ro
    - ../../backend/references:/app/backend/references:ro
    - ../../backend/contracts/runtime:/app/backend/contracts/runtime:ro
    profiles:
    - jobs
    image: teoria-pipelines-check:latest
volumes:
  specification-model-auth: null
  metadata-model-auth: null
  postgres:
    name: ${COMPOSE_PROJECT_NAME}_data-db
  platform-postgres:
    name: ${COMPOSE_PROJECT_NAME}_platform-db
  prefect-redis: null
  runtime-redis: null
  runtime-artifacts:
    name: ${COMPOSE_PROJECT_NAME}_runtime-artifacts
  opa-bundles:
    name: ${COMPOSE_PROJECT_NAME}_opa-bundles
  opa-signing-keys:
    name: ${COMPOSE_PROJECT_NAME}_opa-signing-keys
  opa-state:
    name: ${COMPOSE_PROJECT_NAME}_opa-state
  openmetadata-search: null
  # Legacy MLflow volume is retained for rollback; no service mounts it.
  mlflow-postgres: null
  model-objects: null
  model-release: null
