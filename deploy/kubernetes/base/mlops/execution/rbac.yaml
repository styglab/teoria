apiVersion: v1
kind: Namespace
metadata:
  name: teoria-models
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-executor
  namespace: teoria-models
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - create
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - create
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - list
  - create
  - patch
  - delete
- apiGroups: ['']
  resources: [pods, pods/log]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-executor
  namespace: teoria-models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-executor
subjects:
- kind: ServiceAccount
  name: model-executor
  namespace: teoria
