  - id: list_goods_contracts
    name: 나라장터검색조건에 의한 계약현황 물품조회
    method: GET
    idempotent: true
    path: /getCntrctInfoListThngPPSSrch
    description: 나라장터 검색조건으로 물품 계약현황을 조회한다.
    pagination:
      type: page_number
      page:
        request: query.pageNo
      page_size:
        request: query.numOfRows
      total_count: response.body.totalCount
    request:
      query:
        fields:
        - id: numOfRows
          name: 한 페이지 결과 수
          data_type: integer
        - id: pageNo
          name: 페이지 번호
          data_type: integer
        - id: type
          name: 타입
          data_type: string
          default: json
          values:
          - value: json
          - value: xml
        - id: inqryDiv
          name: 조회구분
          data_type: string
          values:
          - value: '1'
            label: 계약체결일자
          - value: '2'
            label: 확정계약번호
          - value: '3'
            label: 요청번호
          - value: '4'
            label: 공고번호
        - id: inqryBgnDate
          name: 조회시작일자
