apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teoria
spec:
  tls:
  - hosts:
    - teoria.invalid
    secretName: teoria-tls
  rules:
  - host: teoria.invalid
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-ui
            port:
              number: 80
