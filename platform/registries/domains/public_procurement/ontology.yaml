registry:
  version: 1.3.0
  registered_at: "2026-08-08"

ontology:
  id: public_procurement
  name: 대한민국 공공조달
  description: 대한민국 공공기관의 입찰공고, 참가요건, 조달계약, 기관과 계약업체의 참여 관계를 표현한다.
  object_types:
    - id: bid_notice
      name: 입찰공고
      description: 나라장터 공고번호와 차수로 식별되는 공공조달 입찰공고
      primary_key: bid_notice_id
      properties:
        - {id: bid_notice_id, name: 입찰공고 식별자, description: 공고번호와 공고차수를 결합한 Teoria 입찰공고 식별자, data_type: string}
        - {id: notice_number, name: 공고번호, description: 나라장터가 입찰공고에 부여한 번호, data_type: string}
        - {id: notice_order, name: 공고차수, description: 동일 공고번호의 공고 차수, data_type: string}
        - {id: notice_name, name: 공고명, description: 입찰 대상 사업 또는 물품을 설명하는 공고 명칭, data_type: string}
        - {id: work_type, name: 업무유형, description: 물품·용역·공사·외자 등 입찰 업무 유형, data_type: string}
        - {id: notice_kind_name, name: 공고종류명, description: 원천에서 제공한 공고 종류 명칭, data_type: string}
        - {id: is_re_notice, name: 재공고 여부, description: 해당 입찰공고가 재공고인지 여부, data_type: boolean}
        - {id: notice_published_at, name: 공고게시시각, description: 나라장터에 공고가 게시된 시각, data_type: datetime}
        - {id: bid_begin_at, name: 입찰시작시각, description: 입찰서 접수가 시작되는 시각, data_type: datetime}
        - {id: bid_deadline_at, name: 입찰마감시각, description: 입찰서 접수가 마감되는 시각, data_type: datetime}
        - {id: opening_at, name: 개찰시각, description: 입찰 개찰 예정 시각, data_type: datetime}
        - {id: bid_status, name: 입찰상태, description: 시작 및 마감시각을 기준으로 정규화한 scheduled·open·closed·unknown 상태, data_type: string}
        - {id: notice_organization_code, name: 공고기관코드, description: 입찰공고를 게시한 기관의 코드, data_type: string}
        - {id: notice_organization_name, name: 공고기관명, description: 입찰공고를 게시한 기관의 명칭, data_type: string}
        - {id: demand_organization_code, name: 수요기관코드, description: 입찰 대상 사업의 수요기관 코드, data_type: string}
        - {id: demand_organization_name, name: 수요기관명, description: 입찰 대상 사업의 수요기관 명칭, data_type: string}
        - {id: bid_method_name, name: 입찰방식명, description: 원천에서 제공한 입찰 방식 명칭, data_type: string}
        - {id: contract_method_name, name: 계약방법명, description: 원천에서 제공한 계약 방법 명칭, data_type: string}
        - {id: estimated_price, name: 추정가격, description: 입찰공고의 추정 가격, data_type: monetary_amount}
        - {id: allocated_budget, name: 배정예산, description: 입찰공고에 배정된 예산 금액, data_type: monetary_amount}
        - {id: detail_url, name: 상세 URL, description: 입찰공고 상세정보 URL, data_type: string}
        - {id: notice_url, name: 공고문 URL, description: 입찰공고 원문을 확인하는 URL, data_type: string}
        - {id: source_changed_at, name: 원천 변경시각, description: 나라장터에서 공고가 마지막으로 변경된 시각, data_type: datetime}
        - {id: requirement_expression, name: 참가요건 조건식, description: 최신 참가요건 추출 결과의 AND·OR 조건 트리 JSON 문자열, data_type: string}
        - {id: extraction_completeness, name: 요건추출 완전성, description: 첨부문서와 정형 API를 기준으로 한 complete·partial·api_only 추출 범위, data_type: string}
        - {id: requires_review, name: 검토필요 여부, description: 누락 문서 등으로 사람의 추가 검토가 필요한지 여부, data_type: boolean}

    - id: bid_requirement
      name: 입찰 참가요건
      description: 특정 입찰공고에 참가하려는 업체가 충족해야 하는 개별 조건과 그 근거
      primary_key: requirement_id
      properties:
        - {id: requirement_id, name: 참가요건 식별자, description: 추출 실행과 로컬 요건 ID로 생성한 고유 식별자, data_type: string}
        - {id: bid_notice_id, name: 입찰공고 식별자, description: 요건이 속한 입찰공고 식별자, data_type: string}
        - {id: notice_number, name: 공고번호, description: 요건이 속한 나라장터 공고번호, data_type: string}
        - {id: notice_order, name: 공고차수, description: 요건이 속한 공고 차수, data_type: string}
        - {id: local_id, name: 추출내 요건 ID, description: 한 추출 결과 안에서 요건을 식별하는 로컬 ID, data_type: string}
        - {id: requirement_type, name: 요건유형, description: 면허·지역·기업상태·인증·실적 등 정규화된 참가요건 유형, data_type: string}
        - {id: operator, name: 비교연산자, description: equals·contains·gte 등 요건 판정에 사용하는 연산자, data_type: string}
        - {id: value_text, name: 요건값, description: 요건의 정규화된 값을 보존한 JSON 문자열, data_type: string}
        - {id: original_text, name: 요건 원문, description: 공고 또는 첨부문서에서 확인한 참가요건 원문, data_type: string}
        - {id: holder_scope, name: 보유주체 범위, description: 대표사·공동수급 구성원 등 요건을 충족해야 하는 주체 범위, data_type: string}
        - {id: reference_date_type, name: 기준일 유형, description: 공고일·마감일 등 요건 유효성을 판단하는 기준일 유형, data_type: string}
        - {id: mandatory, name: 필수 여부, description: 참가를 위해 반드시 충족해야 하는 요건인지 여부, data_type: boolean}
        - {id: review_status, name: 검토상태, description: 자동 추출 완료 또는 사람의 검토 필요 상태, data_type: string}
        - {id: confidence, name: 추출신뢰도, description: 자동 추출 결과의 0 이상 1 이하 신뢰도, data_type: number}
        - {id: evidence_summary, name: 근거 요약, description: 출처 문서·페이지·절·원문을 결합한 근거 문자열, data_type: string}
        - {id: assessment_stage, name: 판정 단계, description: 입찰참가·적격심사·계약체결 중 요건을 확인하는 단계, data_type: string}
        - {id: failure_effect, name: 불충족 효과, description: 참가불가·입찰무효·적격탈락·계약불가 등 요건 불충족의 효과, data_type: string}
        - {id: comparison_mode, name: 비교 방식, description: 정형 회사정보·문서증빙·수동검토 중 요건 확인 방식, data_type: string}
        - {id: proof_summary, name: 증빙 요구 요약, description: 요건과 분리하여 추출한 제출 증빙·단계·기한과 근거 요약, data_type: string}

    - id: procurement_supplier
      name: 나라장터 조달업체
      description: 사업자등록번호로 식별되며 나라장터 입찰참가자격을 등록한 조달업체
      primary_key: business_registration_number
      properties:
        - {id: business_registration_number, name: 사업자등록번호, description: 나라장터 조달업체를 식별하는 사업자등록번호, data_type: business_registration_number}
        - {id: company_name, name: 업체명, description: 나라장터 입찰참가자격에 등록된 업체명, data_type: string}
        - {id: english_company_name, name: 영문업체명, description: 나라장터에 등록된 업체의 영문 명칭, data_type: string}
        - {id: opened_at, name: 개업일시, description: 원천에서 제공한 업체 개업 일시, data_type: datetime}
        - {id: region_code, name: 지역코드, description: 조달업체 소재 지역 코드, data_type: string}
        - {id: region_name, name: 지역명, description: 조달업체 소재 지역 명칭, data_type: string}
        - {id: postal_code, name: 우편번호, description: 조달업체 소재지 우편번호, data_type: string}
        - {id: base_address, name: 주소, description: 조달업체 소재지 기본주소, data_type: string}
        - {id: detail_address, name: 상세주소, description: 조달업체 소재지 상세주소, data_type: string}
        - {id: country_name, name: 국가명, description: 조달업체의 국가 명칭, data_type: string}
        - {id: manufacturer_type_code, name: 제조구분코드, description: 제조 또는 공급 여부를 구분하는 원천 코드, data_type: string}
        - {id: manufacturer_type_name, name: 제조구분명, description: 제조 또는 공급 여부를 나타내는 명칭, data_type: string}
        - {id: employee_count, name: 종업원수, description: 원천에서 제공한 조달업체 종업원 수, data_type: integer}
        - {id: business_category_codes, name: 업체업무구분코드, description: 조달업체가 등록한 물품·공사·용역 등 업무구분 코드 원문, data_type: string}
        - {id: business_category_names, name: 업체업무구분명, description: 조달업체가 등록한 업무구분 명칭 원문, data_type: string}
        - {id: head_office_type_name, name: 본사구분명, description: 본사 또는 지사 등 원천 구분명, data_type: string}
        - {id: registered_at, name: 등록일시, description: 조달업체가 나라장터에 등록된 시각, data_type: datetime}
        - {id: changed_at, name: 변경일시, description: 조달업체 정보가 나라장터에서 마지막으로 변경된 시각, data_type: datetime}
        - {id: essential_number_certificate_registered, name: 고유번호증명등록여부, description: 고유번호증명에 근거한 등록 여부, data_type: boolean}
        - {id: representative_name, name: 대표자명, description: 나라장터에 등록된 조달업체 대표자명, data_type: string}

    - id: direct_production_confirmation
      name: 직접생산확인
      description: 특정 사업자가 특정 세부품명을 직접 생산할 수 있음을 공공구매 기준으로 확인한 결과
      primary_key: direct_production_confirmation_id
      properties:
        - {id: direct_production_confirmation_id, name: 직접생산확인 식별자, description: 사업자등록번호와 세부품명번호 및 유효기간을 조합하여 생성한 결정적 식별자, data_type: string}
        - {id: business_registration_number, name: 사업자등록번호, description: 직접생산확인을 보유한 사업자의 사업자등록번호, data_type: business_registration_number}
        - {id: source_confirmation_code, name: 원천 확인서 코드, description: 원천기관이 직접생산확인증명서에 부여한 구분 코드, data_type: string}
        - {id: detailed_product_code, name: 세부품명번호, description: 직접생산확인의 대상이 되는 조달청 물품목록번호 기준 10자리 세부품명번호, data_type: string}
        - {id: confirmed_date, name: 확인일, description: 직접생산확인이 인증된 날짜, data_type: date}
        - {id: valid_from, name: 유효기간 시작일, description: 직접생산확인의 효력이 시작되는 날짜, data_type: date}
        - {id: valid_until, name: 유효기간 종료일, description: 직접생산확인의 효력이 종료되는 날짜, data_type: date}
        - {id: essential_notes, name: 필수특이사항, description: 특정 세부품명번호에 적용되는 직접생산확인의 필수특이사항, data_type: string}
        - {id: status, name: 확인 상태, description: 조회 기준일에 확인된 직접생산확인의 유효 상태, value_set: qualification_status}
        - {id: reference_date, name: 판정 기준일, description: 원천 서비스가 직접생산확인의 유효성을 확인한 기준 날짜, data_type: date}
        - {id: observed_at, name: 조회시점, description: Teoria가 공식 원천에서 직접생산확인을 조회한 시점, data_type: datetime}

    - id: registered_industry
      name: 나라장터 등록업종
      description: 조달업체가 나라장터에 등록한 업종과 유효기간 및 현재 상태
      primary_key: industry_registration_id
      properties:
        - {id: industry_registration_id, name: 등록업종 식별자, description: 조달업체와 업종코드 및 등록일시로 생성한 Teoria 식별자, data_type: string}
        - {id: business_registration_number, name: 사업자등록번호, description: 업종을 등록한 조달업체 사업자등록번호, data_type: business_registration_number}
        - {id: industry_code, name: 업종코드, description: 나라장터에 등록된 업종 코드, data_type: string}
        - {id: industry_name, name: 업종명, description: 나라장터에 등록된 업종 명칭, data_type: string}
        - {id: registered_at, name: 등록일시, description: 조달업체 업종 등록 시각, data_type: datetime}
        - {id: valid_until, name: 유효기간종료일시, description: 등록업종의 유효기간 만료 시각, data_type: datetime}
        - {id: changed_at, name: 변경일시, description: 등록업종 정보의 마지막 변경 시각, data_type: datetime}
        - {id: status_name, name: 업종상태명, description: 유효기간 경과 등 원천에서 제공한 업종 상태, data_type: string}
        - {id: is_representative, name: 대표업종여부, description: 조달업체의 대표업종인지 여부, data_type: boolean}

    - id: registered_supply_product
      name: 나라장터 등록 공급물품
      description: 조달업체가 나라장터에 공급 또는 제조 가능 물품으로 등록한 세부품명
      primary_key: supply_product_registration_id
      properties:
        - {id: supply_product_registration_id, name: 공급물품등록 식별자, description: 조달업체와 세부품명번호 및 등록일시로 생성한 Teoria 식별자, data_type: string}
        - {id: business_registration_number, name: 사업자등록번호, description: 공급물품을 등록한 조달업체 사업자등록번호, data_type: business_registration_number}
        - {id: detailed_product_code, name: 세부품명번호, description: 나라장터 세부품명 분류번호, data_type: string}
        - {id: detailed_product_name, name: 세부품명, description: 세부품명번호에 대응하는 한글 명칭, data_type: string}
        - {id: registered_at, name: 등록일시, description: 세부품명이 조달업체 공급물품으로 등록된 시각, data_type: datetime}
        - {id: changed_at, name: 변경일시, description: 공급물품 정보의 마지막 변경 시각, data_type: datetime}
        - {id: is_representative, name: 대표품명여부, description: 조달업체의 대표품명인지 여부, data_type: boolean}
        - {id: is_manufactured, name: 제조여부, description: 조달업체의 제조물품으로 등록됐는지 여부, data_type: boolean}

    - id: procurement_sanction
      name: 부정당업체 제재
      description: 나라장터 사용자정보서비스가 조회 시점에 제공하는 조달업체의 부정당 제재 정보
      primary_key: sanction_id
      properties:
        - {id: sanction_id, name: 제재 식별자, description: 조달업체와 제재문서 및 제재기간으로 생성한 Teoria 식별자, data_type: string}
        - {id: business_registration_number, name: 사업자등록번호, description: 제재 대상 조달업체 사업자등록번호, data_type: business_registration_number}
        - {id: company_name, name: 업체명, description: 제재 대상 업체명, data_type: string}
        - {id: document_name, name: 제재문서명, description: 부정당제재 처리 문서명, data_type: string}
        - {id: valid_from, name: 제재시작일, description: 부정당 제재가 시작되는 날짜, data_type: date}
        - {id: valid_until, name: 제재종료일, description: 부정당 제재가 종료되는 날짜, data_type: date}
        - {id: imposing_organization_code, name: 제재기관코드, description: 제재를 통보한 수요기관 코드, data_type: string}
        - {id: imposing_organization_name, name: 제재기관명, description: 제재를 통보한 수요기관 명칭, data_type: string}
        - {id: legal_basis_name, name: 근거법령명, description: 제재 근거 계약법 구분과 법률 명칭, data_type: string}
        - {id: legal_article, name: 조항호, description: 제재 근거 법령의 조항호, data_type: string}
        - {id: legal_article_code, name: 조항호코드, description: 제재 근거 조항호 코드, data_type: string}
        - {id: legal_article_name, name: 조항호코드명, description: 제재 근거 조항의 상세 명칭, data_type: string}
        - {id: enforcement_rule_code, name: 시행규칙코드, description: 제재 근거 시행령 또는 시행규칙 코드, data_type: string}
        - {id: enforcement_rule_name, name: 시행규칙코드명, description: 제재 근거 시행령 또는 시행규칙 명칭, data_type: string}
        - {id: published_at, name: 게재일시, description: 부정당 제재 정보가 게재된 시각, data_type: datetime}
        - {id: period_months, name: 제재기간개월수, description: 제재기간의 개월 수, data_type: integer}
        - {id: period_days, name: 제재기간일수, description: 제재기간의 추가 일수, data_type: integer}
        - {id: status_name, name: 제재상태명, description: 조회 시점에 원천이 제공한 제재 최종 상태명, data_type: string}

    - id: contract
      name: 공공조달계약
      description: 공공기관과 하나 이상의 업체 사이에 체결되어 나라장터 통합계약번호로 식별되는 조달계약
      primary_key: unified_contract_number
      properties:
        - {id: unified_contract_number, name: 통합계약번호, description: 나라장터가 계약을 통합 식별하기 위해 부여한 번호, data_type: string}
        - {id: contract_type, name: 계약유형, description: 물품·공사·용역·외자 중 계약이 속하는 업무 유형, value_set: public_procurement_contract_type}
        - {id: confirmed_contract_number, name: 확정계약번호, description: 계약 확정 후 부여된 계약번호, data_type: string}
        - {id: contract_reference_number, name: 계약참조번호, description: 계약 업무에서 참조하는 번호, data_type: string}
        - {id: contract_name, name: 계약명, description: 계약 대상 또는 사업을 설명하는 명칭, data_type: string}
        - {id: is_joint_contract, name: 공동계약 여부, description: 둘 이상의 업체가 공동으로 참여한 계약인지 여부, data_type: boolean}
        - {id: long_term_continuation_type, name: 장기계속구분, description: 계약의 장기계속 또는 차수 성격을 나타내는 구분, data_type: string}
        - {id: concluded_date, name: 계약체결일, description: 계약 당사자가 계약을 체결한 날짜, data_type: date}
        - {id: contract_date, name: 계약일, description: 나라장터 계약정보에서 계약일로 제공되는 날짜, data_type: date}
        - {id: contract_period_text, name: 계약기간, description: 원천에서 제공된 계약기간 설명, data_type: string}
        - {id: basis_law_name, name: 근거법률명, description: 계약 체결의 법적 근거가 되는 법령 또는 조항 명칭, data_type: string}
        - {id: total_amount, name: 총계약금액, description: 전체 계약기간에 대한 총 계약금액, data_type: monetary_amount}
        - {id: total_amount_currency, name: 총계약금액 통화, description: 총계약금액에 적용되는 ISO 4217 통화코드, data_type: iso_4217_currency_code}
        - {id: current_contract_amount, name: 금차계약금액, description: 현재 차수에 해당하는 계약금액, data_type: monetary_amount}
        - {id: current_contract_amount_currency, name: 금차계약금액 통화, description: 금차계약금액에 적용되는 ISO 4217 통화코드, data_type: iso_4217_currency_code}
        - {id: guarantee_deposit_rate, name: 보증금률, description: 계약금액 대비 계약보증금의 비율, data_type: number}
        - {id: payment_method_name, name: 지급구분명, description: 계약대금의 지급 방식을 나타내는 원천 구분명, data_type: string}
        - {id: request_number, name: 요청번호, description: 계약과 연결된 조달 요청번호, data_type: string}
        - {id: notice_number, name: 공고번호, description: 계약과 연결된 조달 공고번호, data_type: string}
        - {id: contract_method_name, name: 계약체결방법, description: 일반경쟁·제한경쟁·수의계약 등 계약 체결 방식의 명칭, data_type: string}
        - {id: contracting_department_name, name: 계약기관 담당부서명, description: 계약기관에서 해당 계약 업무를 담당하는 부서명, data_type: string}
        - {id: procurement_classification_number, name: 공공조달분류번호, description: 계약 대상에 부여된 공공조달 분류번호, data_type: string}
        - {id: procurement_classification_name, name: 공공조달분류명, description: 공공조달 분류번호에 대응하는 명칭, data_type: string}
        - {id: contract_information_url, name: 계약정보 URL, description: 계약정보를 확인할 수 있는 웹 주소, data_type: string}
        - {id: contract_detail_url, name: 계약상세정보 URL, description: 계약 상세화면의 웹 주소, data_type: string}
        - {id: source_registered_at, name: 원천 등록일시, description: 나라장터에 계약정보가 등록된 시각, data_type: datetime}
        - {id: source_changed_at, name: 원천 변경일시, description: 나라장터에서 계약정보가 마지막으로 변경된 시각, data_type: datetime}

    - id: public_organization
      name: 공공기관
      description: 조달계약에서 계약기관 또는 수요기관 역할로 참여하는 공공 조직
      primary_key: organization_code
      properties:
        - {id: organization_code, name: 기관코드, description: 나라장터에서 공공기관을 식별하는 코드, data_type: string}
        - {id: name, name: 기관명, description: 기관의 공식 또는 원천 제공 명칭, data_type: string}
        - {id: jurisdiction_type, name: 소관구분, description: 국가기관·지방자치단체·교육기관 등 기관의 소관 구분, data_type: string}

    - id: contract_participation
      name: 계약업체 참여
      description: 사업자가 특정 공공조달계약에 주계약업체 또는 도급업체로 참여한 사실과 공동도급 방식 및 지분율을 표현한다.
      primary_key: participation_id
      properties:
        - {id: participation_id, name: 계약참여 식별자, description: 통합계약번호와 업체 순번으로 생성한 Teoria 계약참여 식별자, data_type: string}
        - {id: supplier_sequence, name: 업체 순번, description: 한 계약 안에서 계약업체를 구분하는 원천 순번, data_type: integer}
        - {id: business_registration_number, name: 사업자등록번호, description: 계약 참여업체의 사업자등록번호, data_type: business_registration_number}
        - {id: supplier_name, name: 업체명, description: 계약정보에 기록된 참여업체 명칭, data_type: string}
        - {id: supplier_role_name, name: 업체 역할, description: 주계약업체·도급업체 등 계약에서의 업체 역할, data_type: string}
        - {id: joint_contract_method_name, name: 공동도급 방식, description: 단독·공동·분담 등 계약 참여 방식, data_type: string}
        - {id: participation_share_rate, name: 참여 지분율, description: 공동계약에서 해당 업체가 차지하는 참여 지분율, data_type: number}

  link_types:
    - id: bid_notice_requires_bid_requirement
      description: 입찰공고가 업체에 특정 참가요건의 충족을 요구함을 나타낸다.
      source: bid_notice
      target: bid_requirement
    - id: public_organization_publishes_bid_notice
      description: 공공기관이 특정 입찰공고를 게시했음을 나타낸다.
      source: public_organization
      target: bid_notice
    - id: business_registration_identifies_procurement_supplier
      description: 사업자등록이 나라장터에 등록된 동일 조달업체를 식별함을 나타낸다.
      source: company.business_registration
      target: procurement_supplier
    - id: business_registration_has_direct_production_confirmation
      description: 사업자등록으로 식별되는 기업을 세부품명별 직접생산확인과 연결한다.
      source: company.business_registration
      target: direct_production_confirmation
    - id: procurement_supplier_has_registered_industry
      description: 나라장터 조달업체가 특정 업종을 등록했음을 나타낸다.
      source: procurement_supplier
      target: registered_industry
    - id: procurement_supplier_has_registered_supply_product
      description: 나라장터 조달업체가 특정 세부품명을 공급 또는 제조 물품으로 등록했음을 나타낸다.
      source: procurement_supplier
      target: registered_supply_product
    - id: procurement_supplier_has_procurement_sanction
      description: 나라장터 조달업체가 특정 부정당 제재의 대상임을 나타낸다.
      source: procurement_supplier
      target: procurement_sanction
    - id: public_organization_imposes_procurement_sanction
      description: 공공기관이 조달업체에 특정 부정당 제재를 통보했음을 나타낸다.
      source: public_organization
      target: procurement_sanction
    - id: business_registration_is_supplier_of_contract
      description: 사업자등록으로 식별되는 업체가 공공조달계약의 공급자 또는 계약업체로 참여함을 나타낸다.
      source: company.business_registration
      target: contract
    - id: contract_participation_is_for_contract
      description: 계약업체 참여 사실이 특정 공공조달계약에 속함을 나타낸다.
      source: contract_participation
      target: contract
    - id: business_registration_has_contract_participation
      description: 사업자등록으로 식별되는 업체가 특정 계약업체 참여 사실의 주체임을 나타낸다.
      source: company.business_registration
      target: contract_participation
    - id: public_organization_awards_contract
      description: 공공기관이 계약기관으로서 공공조달계약을 체결했음을 나타낸다.
      source: public_organization
      target: contract
    - id: public_organization_demands_contract
      description: 공공기관이 수요기관으로서 공공조달계약의 수요를 제기했음을 나타낸다.
      source: public_organization
      target: contract
