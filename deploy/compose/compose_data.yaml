services:
  postgres:
    stop_grace_period: 60s
    cpus: 2
    mem_limit: 4g
    image: postgres:17
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_DB: teoria_data
      POSTGRES_USER: teoria_pipeline
      POSTGRES_PASSWORD: ${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U teoria_pipeline -d teoria_data
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
    - '5432'
    volumes:
    - postgres:/var/lib/postgresql/data
  postgres-init:
    cpus: 0.5
    mem_limit: 256m
    image: postgres:17
    command:
    - sh
    - -ec
    - "psql --set=ON_ERROR_STOP=1 \\\n  --set=runtime_password=\"$${TEORIA_LOCAL_RUNTIME_DB_PASSWORD}\"\
      \ \\\n  --set=metadata_password=\"$${TEORIA_METADATA_DB_PASSWORD}\" <<'SQL'\n\
      SELECT format('CREATE ROLE teoria_runtime LOGIN PASSWORD %L', :'runtime_password')\n\
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'teoria_runtime')\n\
      \\gexec\nALTER ROLE teoria_runtime PASSWORD :'runtime_password';\nALTER ROLE\
      \ teoria_runtime SET statement_timeout = '30s';\nSELECT format('CREATE ROLE\
      \ teoria_metadata LOGIN PASSWORD %L', :'metadata_password')\nWHERE NOT EXISTS\
      \ (SELECT 1 FROM pg_roles WHERE rolname = 'teoria_metadata')\n\\gexec\nALTER\
      \ ROLE teoria_metadata PASSWORD :'metadata_password';\nALTER ROLE teoria_metadata\
      \ SET statement_timeout = '60s';\nGRANT CONNECT ON DATABASE teoria_data TO teoria_metadata;\n\
      SQL\n"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: teoria_data
      PGUSER: teoria_pipeline
      PGPASSWORD: ${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}
      TEORIA_LOCAL_RUNTIME_DB_PASSWORD: ${TEORIA_LOCAL_RUNTIME_DB_PASSWORD:?set TEORIA_LOCAL_RUNTIME_DB_PASSWORD}
      TEORIA_METADATA_DB_PASSWORD: ${TEORIA_METADATA_DB_PASSWORD:-teoria_local_metadata}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
    - jobs
  postgres-migrate:
    image: ${TEORIA_IMAGE_PREFIX:-}teoria-data-operations:${TEORIA_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: operations
      labels:
        io.teoria.project: teoria
        io.teoria.role: operations
    cpus: 1
    mem_limit: 512m
    command:
    - teoria-pipelines
    - migrate
    - --migrations
    - /app/backend/migrations/data
    environment:
      TEORIA_PIPELINE_DATA_DATABASE_URL: ${TEORIA_PIPELINE_DATA_DATABASE_URL:-postgresql://teoria_pipeline:${TEORIA_LOCAL_DATA_DB_PASSWORD:-teoria_local_data}@postgres:5432/teoria_data}
      TEORIA_PIPELINE_DATABASE_CONCURRENCY_LIMIT: ${TEORIA_PIPELINE_DATABASE_CONCURRENCY_LIMIT:-10}
    profiles:
    - jobs
  admin-api:
    environment:
      TEORIA_ADMIN_DATA_DATABASE_URL: ${TEORIA_RUNTIME_DATA_DATABASE_URL:-postgresql://teoria_runtime:${TEORIA_LOCAL_RUNTIME_DB_PASSWORD:?set
        TEORIA_LOCAL_RUNTIME_DB_PASSWORD}@postgres:5432/teoria_data}
