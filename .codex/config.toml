[mcp_servers.teoria]
  # Enable after setting the reachable Runtime URL and dedicated MCP token.
  enabled = false
  command = "uv"
  args = ["run", "--project", "backend", "--locked", "--extra", "mcp", "teoria-mcp"]
  cwd = "/workspace"
  startup_timeout_sec = 30
  tool_timeout_sec = 150
  required = false
