version: 1
dimensions:
  work_type: [construction, service, goods, foreign, other]
  document_format: [pdf, hwp, hwpx, xls, xlsx, zip, other, api_only]
  participation: [single, consortium, mixed, unknown]
  requirement_family: [region, industry_license, past_performance, personnel, certificate, direct_production, company_scale, procurement_registration, sanction, custom]
  processing_state: [complete, partial, api_only, requires_review, parser_failed, unsupported]
  notice_kind: [initial, correction, re_notice]
  size: [short, ordinary, large]
rules:
  - Sample every work type represented in the population.
  - Oversample rare formats, partial results, custom facts, unresolved candidates, consortium logic, and corrected notices.
  - Include negative and near-miss clauses that mention documents, scoring, performance, or schedules without creating bidder eligibility gates.
  - Deduplicate the same notice revision and materially identical documents across partitions.
  - Record unavailable strata instead of silently replacing them with common cases.
