registry:
  version: 1.0.0
  registered_at: "2026-10-07"
capability:
  id: search_procurement_relationship_graph_entities
  exposure: public
  name: 조달관계 그래프 개체 검색
  description: overview에서 받은 graph_version과 군집·기간을 고정해 업체 노드를 cursor로 페이지 조회하고 각 업체에 연결된 기관 노드와 직접 계약관계를 반환한다. 회사 노드가 페이지 소유권을 가지므로 링크는 페이지 사이에 중복되지 않으며 기관 노드는 여러 페이지에 반복될 수 있다.
  kind: compute
  processor: market_context.search_procurement_relationship_graph_entities
  semantic_requirements:
    concepts:
      - stable_key: procurement.Organization
      - stable_key: procurement.Contract
      - stable_key: procurement.ContractParty
      - stable_key: party.BusinessRegistration
    properties:
      - stable_key: procurement.Organization.organizationCode
      - stable_key: procurement.Contract.contractId
      - stable_key: procurement.Contract.currentAmount
      - stable_key: procurement.ContractParty.attributedAmount
      - stable_key: procurement.ContractParty.role
      - stable_key: party.BusinessRegistration.businessRegistrationNumber
    relationships:
      - stable_key: procurement.HAS_CONTRACT_PARTY
      - stable_key: procurement.REPRESENTS_CONTRACTOR
      - stable_key: procurement.SIGNS
  effects:
    reads: [public_procurement.contract]
    produces: [public_procurement.procurement_relationship_graph_entities]
  inputs:
    graph_version: {data_type: string, required: true}
    cluster_id: {data_type: string, required: true}
    period_from_year: {data_type: integer, required: true, minimum: 2000, maximum: 2100}
    period_to_year: {data_type: integer, required: true, minimum: 2000, maximum: 2100}
    cursor: {data_type: string}
    page_size: {data_type: integer, default: 500, minimum: 1, maximum: 500}
  returns: [public_procurement.procurement_relationship_graph_entities]
