# Copy this file to platform/registries/sources/{source_id}.yaml and replace every
# provider-specific example value. Files below docs/ are not loaded as registries.
registry:
  version: 1.0.0
  registered_at: "2026-07-31"

source:
  id: provider_service
  name: 제공기관 서비스명
  provider:
    organization: 제공기관
    distribution: 배포기관
  type: api
  specification:
    format: manual
    version: "1.0"
    api_version: "v1"
    source_document: 제공기관_서비스문서.docx
  access:
    base_url: https://api.example.go.kr/service/v1
    authentication:
      type: api_key
      in: query
      name: serviceKey
      credential_env: TEORIA_SOURCE_PROVIDER_SERVICE_API_KEY
  components:
    objects:
      - id: source_record
        name: 원천 레코드
        fields:
          - id: recordId
            name: 레코드 식별자
            data_type: string
          - id: statusCode
            name: 상태 코드
            data_type: string
            values:
              - value: "01"
                label: 정상
  operations:
    - id: list_records
      name: 레코드 목록 조회
      method: GET
      idempotent: true
      path: /records
      description: 검색 조건에 해당하는 레코드 목록을 조회한다.
      pagination:
        type: page_number
        page:
          request: query.pageNo
        page_size:
          request: query.numOfRows
        total_count: response.body.totalCount
      request:
        query:
          fields:
            - id: pageNo
              name: 페이지 번호
              data_type: integer
              default: 1
            - id: numOfRows
              name: 페이지당 결과 수
              data_type: integer
              default: 10
            - id: searchValue
              name: 검색값
              data_type: string
          required:
            - searchValue
      response:
        content_type: application/json
        http_status: 200
        control:
          record_path: response.header
          success:
            field: resultCode
            equals: "00"
          fields:
            - id: resultCode
              name: 결과 코드
              data_type: string
            - id: resultMessage
              name: 결과 메시지
              data_type: string
        data:
          record_path: response.body.items[]
          ref: source_record
      errors:
        - http_status: 400
          source_code: BAD_REQUEST
          message: 잘못된 요청
        - http_status: 500
          source_code: INTERNAL_ERROR
          message: 제공기관 내부 오류
