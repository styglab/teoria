pipeline:
  id: moleg_law_ingestion
  description: 지정 법령의 연혁·현행·시행예정 원문을 시행일별 보존하고 구조화한다.
  connector: moleg_law_api
  operations:
  - list_law_versions
  - get_law_version
  cursor:
    field: reconciled_date
    window_days: 1
    overlap_days: 0
  sink:
    type: data_database
    schema_name: legal_information
    relations:
    - law
    - law_version
    - law_snapshot
    - law_provision
    - law_attachment
    - law_collection_run
  provenance:
    retain_raw_records: true
    fields:
    - connector
    - operation
    - fetched_at
    - source_record_hash
    - parser_version
    - law_id
    - mst
    - effective_date
